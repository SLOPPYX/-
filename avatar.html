<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* v336: личный ключ игрока (tk) — в каждый запрос к боту. Бот вписывает его только в ссылку самого игрока, поэтому
   действовать от чужого имени больше нельзя (раньше хватало общего ключа, который есть в ссылке у каждого). Страница
   открыта со старой кнопкой (без ключа) и бот отказал в действии — подсказка «открой заново». */
(function () {
  var TK = '';
  try { TK = new URLSearchParams(location.search).get('tk') || ''; } catch (e) {}
  window.__TK = TK;
  function stale() {
    try {
      if (document.getElementById('__tkStale')) return;
      var d = document.createElement('div'); d.id = '__tkStale';
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483647;'
        + 'padding:12px 14px;border-radius:14px;background:rgba(20,16,32,.97);border:1px solid rgba(139,92,246,.65);color:#f4f4f6;'
        + 'font:600 14px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.6);text-align:center';
      d.textContent = 'Кнопка устарела после обновления бота. Закрой это окно и открой раздел заново из меню бота (или нажми /start).';
      (document.body || document.documentElement).appendChild(d);
    } catch (e) {}
  }
  window.__tkStale = stale;
  var of = window.fetch;
  if (!of) return;
  window.fetch = function (u, o) {
    var act = false;
    try {
      if (typeof u === 'string' && u.indexOf('/casino/') >= 0) {
        o = o || {};
        act = String(o.method || 'GET').toUpperCase() !== 'GET';
        if (TK) {
          if (!act) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK);
          else if (typeof o.body === 'string' && o.body.charAt(0) === '{') {
            var b = JSON.parse(o.body);
            if (b && typeof b === 'object' && !Array.isArray(b) && !b.tk) { b.tk = TK; o.body = JSON.stringify(b); }
          }
        }
      }
    } catch (e) {}
    var p = of.call(this, u, o);
    if (act && !TK) p.then(function (r) { if (r && r.status === 401) stale(); }, function () {});
    return p;
  };
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Моя аватарка</title>
<style>
  /* v341: новый вид — чёрный, белый и фиолетовый, плавно (как админка, которая понравилась Кириллу).
     Готовые SVG-аватарки — файлы av/<id>.svg рядом со страницей; своя картинка — как раньше, с проверкой 18+.
     Анимируются только opacity и transform — на телефоне это не тормозит. */
  :root { color-scheme: dark;
          --bg: #050507; --card: #0d0d11; --card2: #15151b; --ln: rgba(255,255,255,.07); --ln2: rgba(255,255,255,.13);
          --tx: #f4f4f6; --tx2: #a1a1ab; --tx3: #6a6a75;
          --acc: #8b5cf6; --acc2: #a78bfa; --acc3: #c4b5fd; --accbg: rgba(139,92,246,.13);
          --grad: linear-gradient(135deg, #7c3aed, #9d6bff);
          --no: #f87171; --wait: #fcd34d;
          --ease: cubic-bezier(.22,.8,.2,1); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* overflow-x только у html: на body он делает body отдельной прокруткой, и кнопка «Поставить» перестаёт прилипать к низу экрана */
  html { overflow-x: hidden; }
  html, body { background: var(--bg); color: var(--tx); }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  body::before { content: ''; position: fixed; top: -200px; left: 0; right: 0; height: 380px; z-index: 0; pointer-events: none;
                 background: radial-gradient(380px 190px at 50% 50%, rgba(139,92,246,.18), transparent); }
  button, label { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }
  @keyframes rin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.9); } 100% { opacity: 1; transform: none; } }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  .app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto;
         padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); }

  /* шапка */
  .hd { display: flex; align-items: center; gap: 12px; animation: rin .4s var(--ease) both; }
  .hd-b { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; display: grid; place-items: center; background: var(--grad);
          box-shadow: 0 10px 24px -12px rgba(139,92,246,.95); }
  .hd-b svg { width: 23px; height: 23px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hd h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .hd p { font-size: 12.5px; color: var(--tx2); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--ln); border-radius: 20px; }

  /* что стоит сейчас (или предпросмотр выбранного) */
  .hero { margin-top: 16px; padding: 18px 16px 16px; display: flex; align-items: center; gap: 16px; animation: rin .4s .05s var(--ease) both; }
  .hav { position: relative; width: 104px; height: 104px; flex: 0 0 104px; border-radius: 50%; padding: 3px; background: var(--grad);
         box-shadow: 0 16px 40px -16px rgba(139,92,246,.95); }
  .hav.dim { background: linear-gradient(135deg, rgba(255,255,255,.35), rgba(255,255,255,.12)); box-shadow: none; }
  .hav .in { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #0b0b10; display: grid; place-items: center; font-size: 46px; }
  .hav img { width: 100%; height: 100%; object-fit: cover; display: block; animation: pop .3s var(--ease) both; }
  .hav .pv { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); padding: 2px 9px; border-radius: 999px; font-size: 10.5px;
             font-weight: 700; color: #fff; background: #1b1530; border: 1px solid rgba(167,139,250,.6); white-space: nowrap; }
  .hm { min-width: 0; flex: 1; }
  .hm .nm { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .hm .sb { font-size: 12.5px; color: var(--tx2); margin-top: 3px; line-height: 1.4; }
  .pill { display: inline-flex; align-items: center; gap: 7px; margin-top: 9px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
          color: var(--acc3); background: var(--accbg); border: 1px solid rgba(139,92,246,.3); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc2); box-shadow: 0 0 8px rgba(167,139,250,.9); }
  .pill.wait { color: #fde68a; background: rgba(252,211,77,.1); border-color: rgba(252,211,77,.35); }
  .pill.wait i { background: var(--wait); box-shadow: 0 0 8px rgba(252,211,77,.8); }
  .pill.no { color: #fecaca; background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.35); }
  .pill.no i { background: var(--no); box-shadow: 0 0 8px rgba(248,113,113,.8); }
  .pill.pv { color: #fff; background: rgba(255,255,255,.07); border-color: var(--ln2); }
  .pill.pv i { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.7); }

  /* «Готовые» | «Своя картинка» — переключатель с бегущей подложкой */
  .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; padding: 4px; border-radius: 15px;
         background: var(--card); border: 1px solid var(--ln); }
  .seg i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 11px; background: var(--grad);
           box-shadow: 0 6px 16px -9px rgba(139,92,246,.95); transition: transform .32s var(--ease); }
  .seg.own i { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; padding: 10px 6px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--tx2);
                transition: color .25s var(--ease); }
  .seg button.on { color: #fff; }
  .pane { animation: rin .3s var(--ease) both; }

  /* готовые аватарки */
  .grp { margin-top: 18px; }
  .grp h3 { font-size: 11px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .1em; margin: 0 0 9px 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
  @media (min-width: 430px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px 10px; border-radius: 16px;
          background: var(--card); border: 1px solid var(--ln);
          transition: transform .15s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease); }
  .tile:active { transform: scale(.96); }
  @media (hover: hover) { .tile:hover { border-color: var(--ln2); } }
  .tile img, .tile .emb { width: 62px; height: 62px; border-radius: 50%; display: block; box-shadow: 0 8px 18px -10px rgba(0,0,0,.9); }
  .tile .emb { display: grid; place-items: center; font-size: 30px; background: #15151b; border: 1px solid var(--ln2); }
  .tile span { font-size: 12px; line-height: 1.25; color: var(--tx2); text-align: center; max-width: 100%; overflow-wrap: anywhere; }   /* на 320 px «Эмблема ранга» — в две строки, не «Эмблема ра…» */
  .tile.sel { background: #13101d; border-color: rgba(167,139,250,.8); box-shadow: 0 0 0 3px rgba(139,92,246,.16), 0 12px 26px -16px rgba(139,92,246,.95); }
  .tile.sel span { color: #fff; font-weight: 600; }
  .tile .ck { position: absolute; top: 7px; right: 7px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
              background: var(--grad); opacity: 0; transform: scale(.5); transition: opacity .2s var(--ease), transform .25s var(--ease); }
  .tile .ck svg { width: 11px; height: 11px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tile.sel .ck { opacity: 1; transform: none; }
  /* «сейчас» — на верхней кромке плитки, чтобы не закрывать картинку */
  .tile .now { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); padding: 0 7px; border-radius: 6px; font-size: 9.5px;
               font-weight: 700; line-height: 16px; white-space: nowrap; color: #0b0b0e; background: #f4f4f6; box-shadow: 0 3px 10px rgba(0,0,0,.55); }
  .apply { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin-top: 16px;
           transition: opacity .25s var(--ease), transform .25s var(--ease); }
  .apply.off { opacity: 0; transform: translateY(14px); pointer-events: none; }

  /* кнопки */
  .btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 13px 16px;
         border-radius: 16px; font-size: 15px; font-weight: 700; letter-spacing: .01em;
         transition: transform .14s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease), opacity .2s; }
  .btn:active { transform: scale(.975); }
  .btn.pri { color: #fff; background: var(--grad); box-shadow: 0 12px 30px -12px rgba(139,92,246,.95), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.ghost { color: var(--tx); background: var(--card2); border: 1px solid var(--ln2); }
  .btn.dgr { color: #fca5a5; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.28); }
  .btn[disabled] { opacity: .45; }
  .btn + .btn { margin-top: 9px; }
  .btn .mini { width: 28px; height: 28px; flex: 0 0 28px; margin: -4px 0; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
               font-size: 15px; background: rgba(255,255,255,.16); box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .btn .mini img { width: 100%; height: 100%; display: block; }
  .btn.ld { color: transparent !important; }
  .btn.ld > * { visibility: hidden; }
  .btn.ld::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
                   border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* своя картинка */
  .mine { margin-top: 16px; padding: 14px; display: flex; align-items: center; gap: 13px; }
  .mine .th { width: 60px; height: 60px; flex: 0 0 60px; border-radius: 50%; overflow: hidden; background: #0b0b10; border: 1px solid var(--ln2);
              display: grid; place-items: center; font-size: 22px; color: var(--tx3); }
  .mine .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mine .m { flex: 1; min-width: 0; }
  .mine .t { font-weight: 700; }
  .mine .d { font-size: 12.5px; color: var(--tx2); margin-top: 2px; line-height: 1.4; }
  .drop { position: relative; display: block; width: 100%; margin-top: 14px; padding: 26px 16px 22px; border-radius: 20px; text-align: center;
          border: 1.5px dashed rgba(255,255,255,.18); background: rgba(255,255,255,.02);
          transition: border-color .2s var(--ease), background-color .2s var(--ease), transform .15s var(--ease); }
  .drop:active { transform: scale(.985); }
  .drop.over { border-color: rgba(167,139,250,.9); background: var(--accbg); }
  .drop .ic { width: 50px; height: 50px; margin: 0 auto 11px; border-radius: 15px; display: grid; place-items: center; background: var(--accbg);
              border: 1px solid rgba(139,92,246,.3); }
  .drop .ic svg { width: 26px; height: 26px; fill: none; stroke: var(--acc3); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .drop .t1 { font-size: 16px; font-weight: 800; }
  .drop .t2 { margin-top: 6px; font-size: 12.5px; color: var(--tx2); line-height: 1.5; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .prev { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: pop .3s var(--ease) both; }
  .prev img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px rgba(139,92,246,.45), 0 18px 44px -18px rgba(139,92,246,.95); }
  .prev .meta { font-size: 11.5px; color: var(--tx3); font-variant-numeric: tabular-nums; }

  /* сообщения */
  .note { margin-top: 12px; padding: 11px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; border: 1px solid transparent; animation: pop .3s var(--ease) both; }
  .note b { color: #fff; }
  .note.err { color: #fecaca; background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.3); }
  .note.warn { color: #fde68a; background: rgba(252,211,77,.07); border-color: rgba(252,211,77,.28); }
  .note.ban { color: #fecaca; background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); }
  .note.info { color: var(--acc3); background: var(--accbg); border-color: rgba(139,92,246,.28); }
  .cdw { margin-top: 14px; padding: 20px 16px; border-radius: 20px; text-align: center; border: 1.5px dashed rgba(252,211,77,.4); background: rgba(252,211,77,.04); }
  .cdw .t1 { font-size: 14px; font-weight: 700; color: #fde68a; }
  .cdw .cd { margin-top: 6px; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .cdw .t2 { margin-top: 4px; font-size: 12px; color: var(--tx2); }
  .rules { margin-top: 16px; padding: 4px 14px; list-style: none; }
  .rules li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; font-size: 12.5px; line-height: 1.45; color: var(--tx2); border-bottom: 1px solid var(--ln); }
  .rules li:last-child { border-bottom: 0; }
  .rules li::before { content: ''; flex: 0 0 6px; height: 6px; margin-top: 6px; border-radius: 2px; transform: rotate(45deg); background: var(--acc2); }
  .rules li.warn::before { background: var(--wait); }
  .foot { margin-top: 16px; text-align: center; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--tx3); }
  .sk { border-radius: 20px; border: 1px solid var(--ln); background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%) 0 0 / 200% 100%;
        animation: sk 1.3s ease-in-out infinite; }
  /* сверху: снизу закреплена кнопка «Поставить», и сообщение не должно её закрывать */
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 50; max-width: 90%; padding: 11px 16px; border-radius: 14px;
           transform: translate(-50%, -14px) scale(.98); opacity: 0; pointer-events: none; font-size: 13px; text-align: center;
           background: rgba(18,17,26,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(139,92,246,.45);
           box-shadow: 0 16px 36px -12px rgba(0,0,0,.9); transition: opacity .24s var(--ease), transform .24s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .toast.err { border-color: rgba(248,113,113,.5); color: #fecaca; }
  .fatal { display: none; padding: 50px 20px; text-align: center; position: relative; z-index: 1; }
  .fatal .t1 { font-size: 18px; font-weight: 800; }
  .fatal .t2 { margin-top: 10px; font-size: 13px; color: var(--tx2); line-height: 1.5; }
  .modal { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
           background: rgba(0,0,0,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .modal .mc { width: 100%; max-width: 360px; padding: 22px 18px 16px; border-radius: 22px; text-align: center; background: var(--card);
               border: 1px solid var(--ln2); animation: pop .3s var(--ease) both; }
  .modal .mi { font-size: 42px; line-height: 1; }
  .modal .mt { margin-top: 10px; font-size: 18px; font-weight: 800; }
  .modal .md { margin: 9px 0 16px; font-size: 13.5px; line-height: 1.55; color: var(--tx2); }
</style>
</head>
<body>
<div class="fatal" id="fatal">
  <div class="t1">Что-то пошло не так</div>
  <div class="t2" id="fatal-d"></div>
</div>

<main class="app" id="app">
  <header class="hd">
    <div class="hd-b"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.6"/><path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/></svg></div>
    <div><h1 id="ttl">Моя аватарка</h1><p id="sub">Её видят все игроки в топе «Рангов»</p></div>
  </header>

  <section id="v-load"><div class="sk" style="height:140px;margin-top:16px"></div><div class="sk" style="height:300px;margin-top:14px"></div></section>

  <section id="v-main" hidden>
    <!-- что стоит сейчас; выбрал готовую — здесь её предпросмотр -->
    <div class="hero card">
      <div class="hav" id="hav"><div class="in" id="hav-in"></div><span class="pv" id="hav-pv" hidden></span></div>
      <div class="hm"><div class="nm" id="h-nm"></div><div class="sb" id="h-sb"></div><div class="pill" id="h-pill"><i></i><span id="h-pill-t"></span></div></div>
    </div>

    <div class="note ban" id="ban" hidden><b id="ban-t"></b><span id="ban-d"></span></div>
    <div class="note err" id="lerr" hidden></div>

    <div class="seg" id="seg"><i></i>
      <button type="button" class="on" data-seg="ready" id="seg-ready">Готовые</button>
      <button type="button" data-seg="own" id="seg-own">Своя картинка</button>
    </div>

    <!-- готовые аватарки -->
    <div class="pane" id="p-ready">
      <div class="note info" id="old-bot" hidden></div>
      <div id="groups"></div>
      <div class="apply off" id="apply"><button class="btn pri" type="button" id="btn-apply"></button></div>
    </div>

    <!-- своя картинка -->
    <div class="pane" id="p-own" hidden>
      <div class="mine card" id="mine" hidden>
        <div class="th" id="mine-th"></div>
        <div class="m"><div class="t" id="mine-t"></div><div class="d" id="mine-d"></div></div>
      </div>
      <div id="mine-acts" hidden style="margin-top:10px">
        <button class="btn ghost" type="button" id="btn-use"></button>
        <button class="btn dgr" type="button" id="btn-rm"></button>
      </div>

      <div class="note warn" id="strk" hidden></div>
      <div class="note err" id="err" hidden></div>

      <div class="cdw" id="cdw" hidden>
        <div class="t1" id="cd-t"></div>
        <div class="cd" id="cd">60:00</div>
        <div class="t2" id="cd-d"></div>
      </div>

      <label class="drop" id="drop" for="file">

    S.loaded = true;
    S.status = j.status || 'none';
    S.url = j.url || null;
    S.active = j.active || (S.status !== 'none' && S.status !== 'blocked' ? 'custom' : 'rank');
    S.preset = j.my_preset ? (ALIAS[j.my_preset] || j.my_preset) : null;
    S.customUrl = j.custom_url !== undefined ? (j.custom_url || null) : (S.active === 'custom' ? S.url : null);
    if (j.tier) S.tier = j.tier;
    S.presets = j.presets || null;
    if (j.rules && j.rules.bans) { S.rules = j.rules; renderRules(); }
    if (j.strikes !== undefined) S.strikes = j.strikes || 0;
    if (j.cooldown_left !== undefined) S.cdUntil = j.cooldown_left ? Date.now() + j.cooldown_left * 1000 : 0;
    if (j.banned_until !== undefined) S.banUntil = j.banned_until;
  }

  // ── отрисовка ───────────────────────────────────────────────────────
  // картинка в кружке; не загрузилась (сервер недоступен, файл снят) — вместо значка «сломано» тихо ставим запасной знак.
  // Пересоздаём только когда картинка сменилась — иначе каждое нажатие на плитку заново грузило бы её и мигало.
  function putImg(box, src, fallback) {
    var k = (src || '') + '|' + fallback;
    if (box.getAttribute('data-k') === k) return;
    box.setAttribute('data-k', k);
    box.textContent = '';
    if (!src) { box.textContent = fallback; return; }
    var im = document.createElement('img'); im.alt = '';
    im.onerror = function () { if (im.parentNode === box) box.textContent = fallback; };
    im.src = src; box.appendChild(im);
  }
  function setHero(key, preview) {
    var src = key === 'custom' ? (S.customUrl || S.url) : key === 'rank' ? null : avSrc(key);
    putImg($('hav-in'), src, S.tier || '🎮');
    $('hav').classList.toggle('dim', key === 'rank');
    $('hav-pv').hidden = !preview; $('hav-pv').textContent = L.pv;
    $('h-nm').textContent = key === 'custom' ? L.h_custom : key === 'rank' ? L.h_rank : nameOf(key);
    var pill = $('h-pill'), cls = '', pt = L.pill_now, sb = key === 'rank' ? L.sb_rank : L.sb_all;
    if (preview) { cls = 'pv'; pt = L.pill_prev; sb = L.sb_prev; }
    else if (key === 'custom' && S.status === 'pending') { cls = 'wait'; sb = L.sb_wait; }
    pill.className = 'pill' + (cls ? ' ' + cls : ''); $('h-pill-t').textContent = pt; $('h-sb').textContent = sb;
  }
  function render() {
    var cur = curKey(), pick = S.pick && S.pick !== cur ? S.pick : null;
    setHero(pick || cur, !!pick);
    $('emb-rank').textContent = S.tier || '🎮';
    // плитки: выбранная и та, что стоит сейчас
    var tiles = $('groups').querySelectorAll('.tile');
    for (var i = 0; i < tiles.length; i++) {
      var k = tiles[i].getAttribute('data-p'), sel = (pick || cur) === k;
      tiles[i].classList.toggle('sel', sel);
      tiles[i].setAttribute('aria-pressed', sel ? 'true' : 'false');
      var nw = tiles[i].querySelector('.now');
      if (k === cur && !nw) { nw = document.createElement('i'); nw.className = 'now'; nw.textContent = L.now; tiles[i].appendChild(nw); }
      else if (k !== cur && nw) nw.remove();
    }
    $('old-bot').hidden = !S.loaded || !!S.presets; $('old-bot').textContent = L.old_bot;
    var ap = $('apply');
    ap.classList.toggle('off', !pick);
    if (pick) $('btn-apply').innerHTML = '<span class="mini">' + (pick === 'rank' ? esc(S.tier || '🎮') : '<img src="' + esc(avSrc(pick)) + '" alt="">')
      + '</span><span>' + esc(pick === 'rank' ? L.apply_rank : tpl(L.apply, { n: nameOf(pick) })) + '</span>';
    renderOwn();
  }
  function renderOwn() {
    var st = S.status, has = st !== 'none';
    $('mine').hidden = !has;
    if (has) {
      putImg($('mine-th'), S.customUrl, S.customUrl ? '🖼' : '🚫');
      $('mine-t').textContent = st === 'pending' ? L.mine_wait : st === 'blocked' ? L.mine_no : L.mine_ok;
      $('mine-d').textContent = st === 'pending' ? L.mine_wait_d : st === 'blocked' ? L.mine_no_d : (S.active === 'custom' ? L.mine_act_d : L.mine_ok_d);
    }
    $('mine-acts').hidden = !has;
    $('btn-use').hidden = !(st === 'ok' && S.active !== 'custom' && S.presets);
    var sk = $('strk');
    if (S.strikes > 0) {
      sk.innerHTML = tpl(L.strk, { days: S.rules.window_days, n: S.strikes }) + esc(tpl(L.strk_next, { x: nextText(S.strikes + 1) }));
      sk.hidden = false;
    } else sk.hidden = true;
    var banned = isBanned();
    $('ban').hidden = !banned;
    if (banned) { $('ban-t').textContent = L.ban_t; $('ban-d').textContent = ' · ' + (S.banUntil ? tpl(L.ban_until, { date: fdate(S.banUntil) }) : L.ban_forever); }
    var cd = !banned && S.cdUntil > Date.now();
    $('cdw').hidden = !cd;
    if (cd) {
      $('cd-t').textContent = L.cd_t; $('cd-d').textContent = L.cd_d;
      $('cd').textContent = mmss((S.cdUntil - Date.now()) / 1000);
      if (!cdTimer) cdTimer = setInterval(tickCd, 1000);
    }
    $('drop').hidden = banned || cd || !!S.shot;
    $('drop-t').textContent = (st === 'ok' || st === 'pending') ? L.drop_t2 : L.drop_t;     // своя уже есть — загрузка «другой»
  }
  var cdTimer = 0;
  function tickCd() {
    var left = (S.cdUntil - Date.now()) / 1000;
    $('cd').textContent = mmss(left);
    if (left <= 0) { clearInterval(cdTimer); cdTimer = 0; S.cdUntil = 0; render(); }
  }
  function setSeg(s) {
    if (S.seg === s) return;
    S.seg = s;
    $('seg').classList.toggle('own', s === 'own');
    $('seg-ready').classList.toggle('on', s === 'ready'); $('seg-own').classList.toggle('on', s === 'own');
    $('p-ready').hidden = s !== 'ready'; $('p-own').hidden = s !== 'own';
    if (s === 'own') S.pick = null;          // ушёл к своей картинке — предпросмотр готовой больше не нужен
    render(); haptic();
  }
  $('seg').addEventListener('click', function (e) { var b = e.target.closest('[data-seg]'); if (b) setSeg(b.getAttribute('data-seg')); });

  // ── готовые: выбрать → предпросмотр → «Поставить» ───────────────────
  $('groups').addEventListener('click', function (e) {
    var t = e.target.closest('.tile'); if (!t || S.busy) return;      // пока ставится выбранная — другую не выбираем
    if (isBanned()) { toast(L.e_ban, true); return; }
    var k = t.getAttribute('data-p');
    S.pick = k === curKey() ? null : k;
    render(); haptic();
  });
  function choose(key, btn, okText, retried) {
    if (S.busy && !retried) return;
    if (!S.loaded) { toast(L.e_load, true); return; }
    if (key !== 'custom' && key !== 'rank' && !presetOk(key)) { toast(L.old_bot, true); return; }
    S.busy = true; if (btn) btn.classList.add('ld');
    post('/casino/avatar/preset', { preset: key }).then(function (res) {
      var j = res.j || {};
      // две смены подряд быстрее, чем разрешает сервер (0,6 с), — не ошибка для игрока: молча повторяем, когда можно
      if (j.error === 'rate_limited' && !retried) {
        setTimeout(function () { choose(key, btn, okText, true); }, Math.min(3000, (+j.retry_after || 0.6) * 1000 + 120));
        return;
      }
      S.busy = false; if (btn) btn.classList.remove('ld');
      if (res.status === 404 && !res.j) { toast(L.old_bot, true); return; }
      if (j.ok) { applyState(j); S.pick = null; render(); toast(okText || L.applied); haptic('success'); return; }
      var e = j.error;
      if (e === 'banned') { S.banUntil = j.until || 0; render(); toast(L.e_ban, true); return; }
      if (e === 'rate_limited') { toast(L.e_rate, true); return; }
      if (e === 'no_custom') { toast(L.e_nocustom, true); return; }
      if (e === 'unauthorized') { toast(L.e_auth, true); return; }
      toast(L.e_srv, true); haptic('error');
    }).catch(function () { S.busy = false; if (btn) btn.classList.remove('ld'); toast(L.e_net, true); haptic('error'); });
  }
  $('btn-apply').addEventListener('click', function () {
    if (!S.pick) return;
    choose(S.pick, this, S.pick === 'rank' ? L.applied_rank : L.applied);
  });
  $('btn-use').addEventListener('click', function () { choose('custom', this, L.sent); });

  // ── проверка на 18+ прямо в браузере ────────────────────────────────
  /* v321: модель (MobileNetV2 из nsfwjs) и tfjs лежат рядом со страницей и грузятся ТОЛЬКО когда игрок выбрал картинку.
     Обойти проверку в браузере можно, поэтому решает сервер (v322) — эта лишь не пускает очевидное 18+ в сеть и не даёт
     получить за него нарушение (v324). Любой сбой = 'unknown' = пропускаем дальше. */
  var NSFW_BASE = 'nsfw/';
  var NSFW_LIMIT = 40000;
  var NSFW_SIDE = 224;
  var NSFW_PORN = 0.85, NSFW_HENTAI = 0.90, NSFW_BOTH = 0.92;
  var NSFW = { ready: null };
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script ' + src)); };
      (document.head || document.documentElement).appendChild(s);
    });
  }
  function nsfwModel() {
    if (NSFW.ready) return NSFW.ready;
    NSFW.ready = Promise.resolve()
      .then(function () { return window.tf ? null : loadScript(NSFW_BASE + 'tf.min.js'); })
      .then(function () {
        if (!window.tf) throw new Error('tf');
        return window.tf.loadLayersModel(NSFW_BASE + 'model.json');
      });
    return NSFW.ready;
  }
  function nsfwRun(canvas) {
    return nsfwModel().then(function (model) {
      var tf = window.tf;
      var out = tf.tidy(function () {
        var img = tf.browser.fromPixels(canvas).toFloat().div(tf.scalar(255));
        if (img.shape[0] !== NSFW_SIDE || img.shape[1] !== NSFW_SIDE) img = tf.image.resizeBilinear(img, [NSFW_SIDE, NSFW_SIDE], true);
        return model.predict(img.reshape([1, NSFW_SIDE, NSFW_SIDE, 3]));
      });
      return out.data().then(function (v) { out.dispose(); return Array.prototype.slice.call(v); });   // [Drawing, Hentai, Neutral, Porn, Sexy]
    });
  }
  function nsfwCheck(canvas) {
    var t0 = Date.now(), timer;
    var guard = new Promise(function (_, rej) { timer = setTimeout(function () { rej(new Error('timeout')); }, NSFW_LIMIT); });
    return Promise.race([nsfwRun(canvas), guard]).then(function (p) {
      clearTimeout(timer);
      var hentai = p[1], porn = p[3];
      var bad = (porn >= NSFW_PORN) || (hentai >= NSFW_HENTAI) || (porn + hentai >= NSFW_BOTH);
      return { v: bad ? 'block' : 'ok', p: p.map(function (x) { return Math.round(x * 1000) / 1000; }), ms: Date.now() - t0 };
    }, function (e) {
      clearTimeout(timer);
      return { v: 'unknown', why: String((e && e.message) || e).slice(0, 60), ms: Date.now() - t0 };
    });
  }
  function setSend(mode) {
    var b = $('btn-send');
    if (mode === 'check') { b.disabled = true; b.textContent = L.chk_run; }
    else if (mode === 'block') { b.disabled = true; b.textContent = L.chk_no; }
    else { b.disabled = false; b.textContent = L.send; }
  }

  // ── своя картинка: сжимаем в браузере ───────────────────────────────
  var MAXSIDE = 512, MAXBYTES = 400 * 1024;
  function readImage(file) {
    return new Promise(function (res, rej) {
      if (!file || !/^image\//.test(file.type || '')) return rej(new Error('type'));
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('read')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error('decode')); };
        im.onload = function () {
          var side = Math.min(im.width, im.height);
          var sx = (im.width - side) / 2, sy = (im.height - side) / 2;
          var out = Math.min(MAXSIDE, side);
          var c = document.createElement('canvas'); c.width = out; c.height = out;
          c.getContext('2d').drawImage(im, sx, sy, side, side, 0, 0, out, out);
          var q = 0.9, url = c.toDataURL('image/jpeg', q);
          while (url.length * 0.75 > MAXBYTES && q > 0.4) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
          res({ dataUrl: url, bytes: Math.round(url.length * 0.75), side: out, canvas: c });
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function handleFile(file) {
    if (isLocked()) return Promise.resolve();
    showErr('');
    if (S.seg !== 'own') setSeg('own');
    return readImage(file).then(function (shot) {
      if (shot.bytes > MAXBYTES * 1.3) { showErr(esc(L.e_big)); return; }
      S.shot = shot;
      $('prev-img').src = shot.dataUrl;
      $('prev-meta').textContent = shot.side + '×' + shot.side + ' · ' + Math.round(shot.bytes / 1024) + ' KB';
      $('prev').hidden = false; $('acts').hidden = false; $('drop').hidden = true;
      haptic();
      S.check = null;
      setSend('check');
      nsfwCheck(shot.canvas).then(function (r) {
        if (S.shot !== shot) return;
        S.check = r;
        if (r.v === 'block') { setSend('block'); showErr(esc(L.e_nsfw_dev)); haptic('error'); return; }
        setSend('ok');
      });
    }).catch(function () { showErr(esc(L.e_img)); });
  }
  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
    e.target.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (ev) { $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.remove('over'); }); });
  $('drop').addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); });
  document.addEventListener('paste', function (e) {
    var it = e.clipboardData && e.clipboardData.items;
    if (!it) return;
    for (var i = 0; i < it.length; i++) {
      if (it[i].type && it[i].type.indexOf('image') === 0) { var f = it[i].getAsFile(); if (f) handleFile(f); return; }
    }
  });
  $('btn-swap').addEventListener('click', backToPick);
  $('m-ok').addEventListener('click', function () { $('modal').hidden = true; });
  function backToPick() {
    S.shot = null; S.check = null;
    $('prev').hidden = true; $('acts').hidden = true; $('drop').hidden = isLocked(); showErr('');
    setSend('ok');
  }
  $('btn-send').addEventListener('click', function () {
    if (S.busy || !S.shot) return;
    if (S.check && S.check.v === 'block') return;
    S.busy = true; $('btn-send').disabled = true; $('btn-send').classList.add('ld');
    // check — только строка в логе сервера, а не решение: с устройства её можно подделать
    post('/casino/avatar/upload', { image: S.shot.dataUrl, check: S.check || { v: 'unknown' } }, 30000)
      .then(function (res) {
        S.busy = false; $('btn-send').classList.remove('ld'); setSend('ok');
        var j = res.j || {};
        if (j.ok) {
          S.status = j.status || 'ok'; S.active = 'custom';
          S.customUrl = S.shot.dataUrl; S.url = S.shot.dataUrl;      // показываем сразу: сервер уже принял решение
          S.pick = null; backToPick(); render();
          toast(L.sent); haptic('success');
          return;
        }
        var e = j.error;
        // v322: сервер не заменяет уже принятую аватарку, если новая не прошла, — здесь тоже ничего не стираем
        if (e === 'nsfw') {
          var sk = j.strike || null;
          if (sk) {
            S.strikes = sk.n || (S.strikes + 1);
            S.cdUntil = Date.now() + (sk.cooldown || S.rules.cooldown_min * 60) * 1000;
            if (sk.ban) {
              S.banUntil = sk.banned_until || 0;
              modal('⛔', L.m_ban_t, tpl(L.m_ban_d, { n: sk.n, days: S.rules.window_days,
                x: sk.ban_seconds ? tpl(L.nx_ban, { d: dur(sk.ban_seconds) }) : L.nx_ban_forever }));
            } else if (sk.warn) {
              modal('⚠️', L.m_warn_t, tpl(L.m_warn_d, { x: nextText(sk.n + 1) }));
            }
          }
          backToPick(); render();
          showErr(esc(sk ? tpl(L.e_nsfw, { cd: Math.round((sk.cooldown || 3600) / 60) }) : L.e_nsfw0));
          haptic('error'); return;
        }
        if (e === 'cooldown') {
          S.cdUntil = Date.now() + (j.retry_after || 60) * 1000;
          if (j.strikes) S.strikes = j.strikes;
          backToPick(); render();
          return showErr(esc(tpl(L.e_cd, { t: mmss(j.retry_after || 60) })));
        }
        if (e === 'banned') { S.banUntil = j.until || 0; backToPick(); render(); return showErr(esc(L.e_ban)); }
        if (e === 'check_unavailable') { showErr(esc(L.e_check)); haptic('error'); return; }
        if (e === 'rate_limited') return showErr(esc(L.e_rate));
        if (e === 'too_large') return showErr(esc(L.e_big));
        if (e === 'bad_image') return showErr(esc(L.e_img));
        if (e === 'unauthorized') return showErr(esc(L.e_auth));
        showErr(esc(L.e_srv)); haptic('error');
      })
      .catch(function () { S.busy = false; $('btn-send').classList.remove('ld'); setSend('ok'); showErr(esc(L.e_net)); haptic('error'); });
  });
  // подтверждение — окном Telegram, если оно есть (в старых клиентах и в браузере — обычное)
  function ask(text, yes) {
    try { if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) { tg.showConfirm(text, function (ok) { if (ok) yes(); }); return; } } catch (e) {}
    if (confirm(text)) yes();
  }
  $('btn-rm').addEventListener('click', function () {
    if (S.busy) return;
    var b = this;
    ask(L.rm_ask, function () { removeOwn(b); });
  });
  function removeOwn(b) {
    if (S.busy) return;
    S.busy = true; b.classList.add('ld');
    post('/casino/avatar/remove', {}).then(function (res) {
      S.busy = false; b.classList.remove('ld');
      var j = res.j || {};
      if (!j.ok) { showErr(esc(L.e_srv)); return; }
      if (j.status !== undefined) applyState(j);
      else { S.status = 'none'; S.customUrl = null; if (S.active === 'custom') { S.active = 'rank'; S.url = null; } }
      render(); toast(L.rm_done); haptic('success');
    }).catch(function () { S.busy = false; b.classList.remove('ld'); showErr(esc(L.e_net)); });
  }

  // ── старт ───────────────────────────────────────────────────────────
  function show(v) { $('v-load').hidden = v !== 'load'; $('v-main').hidden = v !== 'main'; $('v-none').hidden = v !== 'none'; }
  function boot() {
    texts();
    if (!API || !UID) { show('none'); return; }
    getState().then(function (res) {
      if (res.status === 401) { show('none'); $('none-d').textContent = L.e_auth; return; }
      var j = res.j;
      if (!j || j.ok !== true) { loadFail(); return; }
      applyState(j);
      show('main'); render();      // всегда с «Готовых»: что стоит сейчас, и так видно в карточке сверху
    }).catch(loadFail);
  }
  // данные не пришли — показываем страницу (выбрать всё равно можно) и сообщение над вкладками, видное на обеих
  function loadFail() {
    show('main'); render();
    $('lerr').textContent = L.e_load; $('lerr').hidden = false;
  }
  show('load');
  boot();

  window.AV = { state: function () { return S; }, handleFile: handleFile, render: render, ver: VER, nsfwCheck: nsfwCheck, nsfwModel: nsfwModel,
                seg: setSeg, choose: choose };
})();
</script>
