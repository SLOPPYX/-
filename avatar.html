<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Моя аватарка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* v319: та же чёрно-белая тема, что у «Результата матча» — приложения должны выглядеть одной семьёй.
     Цвет только по смыслу: зелёный — одобрено, красный — отклонено, янтарный — ждёт проверки. */
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #000; --ink: #fff; --ink2: #a3a3ac; --ink3: #62626b;
    --line: rgba(255,255,255,.11); --line2: rgba(255,255,255,.2);
    --ok: #34f5a4; --no: #ff4d6d; --wait: #ffcf5c;
  }
  html, body { background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, label { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  .aurora { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; }
  .aurora i:nth-child(1) { width: 560px; height: 420px; top: -230px; left: 50%; margin-left: -280px; background: radial-gradient(ellipse, rgba(255,255,255,.2), rgba(255,255,255,.05) 45%, transparent 70%); animation: drift1 14s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 340px; height: 340px; bottom: -170px; left: -130px; background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); animation: drift2 20s ease-in-out infinite; }
  .grain { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; opacity: .7;
    background-image: radial-gradient(rgba(255,255,255,.1) 1px, transparent 1px); background-size: 22px 22px;
    -webkit-mask: radial-gradient(ellipse 90% 60% at 50% 0, #000, transparent 75%); mask: radial-gradient(ellipse 90% 60% at 50% 0, #000, transparent 75%); }
  @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(38px,22px); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(46px,-30px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 60% { transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes ang { to { --ang: 360deg; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 16px calc(30px + env(safe-area-inset-bottom, 0px)); }

  .hd { display: flex; align-items: center; gap: 14px; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .hd-ic { width: 54px; height: 54px; flex-shrink: 0; overflow: visible; -webkit-filter: drop-shadow(0 0 14px rgba(255,255,255,.35)); filter: drop-shadow(0 0 14px rgba(255,255,255,.35)); }
  .hd-w { font-size: 24px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; line-height: 1.08;
    background: linear-gradient(100deg, #6b6b73 0%, #fff 30%, #fff 50%, #8d8d96 70%, #fff 100%) 0 0 / 260% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    -webkit-filter: drop-shadow(0 0 16px rgba(255,255,255,.28)); filter: drop-shadow(0 0 16px rgba(255,255,255,.28)); animation: sheen 6s linear infinite; }
  @keyframes sheen { to { background-position: 260% 0; } }
  .hd-s { margin-top: 6px; font-size: 12px; color: var(--ink2); line-height: 1.4; }

  /* ─── Текущая аватарка ─── */
  .now { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 22px 18px; border-radius: 26px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 24px 50px -28px rgba(255,255,255,.22);
    animation: rise .55s .06s cubic-bezier(.2,.8,.2,1) both; }
  /* кольцо вокруг аватарки крутится и красится по статусу — статус видно, не читая текст */
  .ring { position: relative; width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
  .ring::before { content: ''; position: absolute; top: -5px; right: -5px; bottom: -5px; left: -5px; border-radius: 50%; z-index: -1;
    background: conic-gradient(from var(--ang), transparent, var(--rc, rgba(255,255,255,.75)), transparent 62%);
    animation: ang 5.5s linear infinite; opacity: .9; }
  .ring img, .ring .ph { width: 138px; height: 138px; border-radius: 50%; object-fit: cover; display: block;
    background: #0b0b0d; border: 1px solid var(--line2); }
  .ring .ph { display: grid; place-items: center; font-size: 52px; }
  .st { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
    border: 1px solid var(--line2); background: rgba(255,255,255,.06); }
  .st i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); }
  .st.ok { color: #baf7dd; border-color: rgba(52,245,164,.45); background: rgba(52,245,164,.1); }
  .st.ok i { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .st.wait { color: #f0e2bd; border-color: rgba(255,207,92,.45); background: rgba(255,207,92,.1); }
  .st.wait i { background: var(--wait); box-shadow: 0 0 12px var(--wait); animation: blink 1.4s ease-in-out infinite; }
  .st.no { color: #ffd3da; border-color: rgba(255,77,109,.5); background: rgba(255,77,109,.1); }
  .st.no i { background: var(--no); box-shadow: 0 0 12px var(--no); }
  .st-d { font-size: 12.5px; line-height: 1.5; color: var(--ink2); text-align: center; max-width: 320px; }
  .st-d b { color: #fff; }

  /* ─── Выбор файла ─── */
  .drop { position: relative; isolation: isolate; overflow: hidden; display: block; width: 100%; margin-top: 14px;
    padding: 26px 18px 22px; border-radius: 24px; text-align: center;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.16), transparent 70%),
                linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.015));
    border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); transition: transform .15s, box-shadow .2s; }
  .drop:active { transform: scale(.985); }
  .drop.over { box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 0 40px -12px rgba(255,255,255,.6); }
  .drop .ic { width: 60px; height: 60px; margin: 0 auto 12px; display: block; }
  .drop .t1 { font-size: 17px; font-weight: 900; }
  .drop .t2 { margin-top: 7px; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .prev { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pop .35s both; }
  .prev img { width: 168px; height: 168px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line2);
    box-shadow: 0 0 50px -14px rgba(255,255,255,.5); }
  .prev .meta { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }

  .btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
    min-height: 54px; padding: 14px 18px; border-radius: 18px; font-size: 15px; font-weight: 900; letter-spacing: .04em;
    text-transform: uppercase; transition: transform .12s ease, background .2s; }
  .btn:active { transform: scale(.97); }
  .btn.pri { color: #000; background: linear-gradient(180deg, #fff, #d9d9de);
    box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 10px 34px -6px rgba(255,255,255,.45); }
  .btn.ghost { color: #fff; background: rgba(255,255,255,.06); border: 1px solid var(--line2); }
  .btn.ghost:active { background: rgba(255,255,255,.13); }
  .btn.dgr { color: #ffd3da; background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.42); }
  .btn[disabled] { opacity: .45; }
  .btn + .btn { margin-top: 10px; }
  .btn svg { width: 19px; height: 19px; flex-shrink: 0; }

  .err { margin-top: 14px; padding: 13px 15px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; color: #ffd3da;
    background: linear-gradient(180deg, rgba(255,77,109,.14), rgba(255,77,109,.05)); border: 1px solid rgba(255,77,109,.5); animation: pop .35s both; }
  .rules { margin-top: 18px; padding: 2px 4px 0; list-style: none; }
  .rules li { display: flex; gap: 11px; align-items: flex-start; padding: 8px 0; font-size: 12.5px; line-height: 1.45; color: var(--ink2);
    border-bottom: 1px solid rgba(255,255,255,.06); }
  .rules li:last-child { border-bottom: 0; }
  .rules li svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; stroke: #fff; }
  .rules li.warn svg { stroke: var(--wait); } .rules li.warn { color: #d8d3c4; }
  .foot { margin-top: 20px; text-align: center; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
  .sk { border-radius: 24px; background: linear-gradient(100deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.12) 50%, rgba(255,255,255,.05) 70%) 0 0 / 300% 100%; animation: sheen 1.6s linear infinite; }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    max-width: 88%; padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center;
    background: rgba(255,255,255,.96); color: #000; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fatal { display: none; padding: 40px 22px; text-align: center; }
  .fatal .t1 { font-size: 19px; font-weight: 900; }
  .fatal .t2 { margin-top: 10px; font-size: 13px; color: var(--ink2); line-height: 1.5; }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i></div><div class="grain"></div>

<div class="fatal" id="fatal">
  <div class="t1">Что-то пошло не так</div>
  <div class="t2" id="fatal-d"></div>
</div>

<main class="app" id="app">
  <header class="hd">
    <svg class="hd-ic" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="32" cy="32" r="25"/><circle cx="32" cy="25" r="8"/><path d="M15 52a17 17 0 0 1 34 0"/>
    </svg>
    <div>
      <div class="hd-w" id="ttl">Моя аватарка</div>
      <div class="hd-s" id="sub">Одна картинка — видна везде: казино, ранги, NFT</div>
    </div>
  </header>

  <section id="v-load"><div class="sk" style="height:250px;margin-top:20px"></div></section>

  <section id="v-main" hidden>
    <div class="now">
      <div class="ring" id="ring"><div class="ph" id="ph">🎮</div></div>
      <div class="st" id="st"><i></i><span id="st-t"></span></div>
      <div class="st-d" id="st-d"></div>
    </div>

    <div class="err" id="err" hidden></div>

    <label class="drop" id="drop" for="file">
      <svg class="ic" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="14" width="48" height="36" rx="8"/><circle cx="32" cy="32" r="9"/><path d="M22 14l3-5h14l3 5"/>
      </svg>
      <div class="t1" id="drop-t">Выбрать картинку</div>
      <div class="t2" id="drop-d">Квадратная — лучше всего. Из любой сделаем круг.</div>
    </label>
    <input type="file" id="file" accept="image/*" class="vh">

    <div class="prev" id="prev" hidden>
      <img id="prev-img" alt="">
      <span class="meta" id="prev-meta"></span>
    </div>

    <div style="margin-top:14px" id="acts" hidden>
      <button class="btn pri" type="button" id="btn-send"></button>
      <button class="btn ghost" type="button" id="btn-swap"></button>
    </div>

    <div style="margin-top:14px" id="rm-wrap" hidden>
      <button class="btn dgr" type="button" id="btn-rm"></button>
    </div>

    <ul class="rules" id="rules"></ul>
    <div class="foot" id="foot"></div>
  </section>

  <section id="v-none" hidden>
    <div class="now" style="margin-top:26px">
      <div class="st no"><i></i><span id="none-t"></span></div>
      <div class="st-d" id="none-d"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function (e) {
  try {
    document.getElementById('app').style.display = 'none';
    var f = document.getElementById('fatal'); f.style.display = 'block';
    document.getElementById('fatal-d').textContent = 'Закрой и открой приложение заново. Причина: ' + String((e && e.message) || 'ошибка') + ' · v319';
  } catch (_) {}
}, true);
</script>
<script>
/* SDK Telegram грузим НЕ блокируя страницу (урок v295): если telegram.org медленный, страница всё равно стартует. */
(function () {
  var s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js'; s.async = true;
  s.onload = function () { try { if (window.__avTg) window.__avTg(); } catch (e) {} };
  (document.head || document.documentElement).appendChild(s);
})();
</script>
<script>
(function () {
  'use strict';
  var VER = 'v319';
  function $(i) { return document.getElementById(i); }
  var Q = new URLSearchParams(location.search);
  var UID = Q.get('user_id') || '';
  var API = (Q.get('api_url') || '').replace(/\/+$/, '');
  var SECRET = Q.get('api_secret') || '';
  var LANG = (Q.get('lang') === 'en') ? 'en' : 'ru';
  var INIT = '', useInit = false;

  var tg = null;
  window.__avTg = function () {
    try {
      tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready(); tg.expand();
      INIT = tg.initData || '';
      if (tg.setHeaderColor) tg.setHeaderColor('#000000');
    } catch (e) {}
  };
  window.__avTg();

  var TX = {
    ru: {
      ttl: 'Моя аватарка', sub: 'Одна картинка — видна везде: казино, ранги, NFT',
      drop_t: 'Выбрать картинку', drop_d: 'Квадратная — лучше всего. Из любой сделаем круг.',
      drop_alt: 'Нажми, перетащи файл или вставь из буфера (Ctrl+V)',
      send: 'Отправить на проверку', swap: 'Выбрать другую', rm: 'Убрать мою картинку',
      s_none: 'Своей картинки нет', s_none_d: 'Сейчас показывается аватарка из набора. Загрузи свою — и она появится во всех мини-аппах.',
      s_wait: 'Ждёт проверки', s_wait_d: 'Картинку видишь пока <b>только ты</b>. Как только её одобрят, она появится у всех в топах.',
      s_ok: 'Одобрена', s_ok_d: 'Её видят все — в казино, рангах и NFT.',

      r1: 'Без 18+, жестокости и чужих логотипов — такие снимаются.',

      none_t: 'Приложение не открылось', none_d: 'Зайди в бот и нажми «🖼 Моя аватарка» в профиле.',

    },
    en: {
      ttl: 'My avatar', sub: 'One picture — shown everywhere: casino, ranks, NFT',
      drop_t: 'Choose a picture', drop_d: 'Square works best. Any image becomes a circle.',
      drop_alt: 'Tap, drop a file, or paste from clipboard (Ctrl+V)',
      send: 'Send for review', swap: 'Choose another', rm: 'Remove my picture',
      s_none: 'No custom picture', s_none_d: 'A preset avatar is shown for now. Upload yours and it appears in every mini app.',
      s_wait: 'Waiting for review', s_wait_d: 'Only <b>you</b> can see it so far. Once approved, everyone will.',
      s_ok: 'Approved', s_ok_d: 'Everyone sees it — in the casino, ranks and NFT.',
      s_no: 'Rejected', s_no_d: 'This picture did not fit the rules. Upload another one.',
      r1: 'No 18+, violence or other people’s logos — those get removed.',
      r2: 'Every new picture is reviewed, which takes some time.',
      r3: 'The picture is cropped to a 256×256 circle.',
      sent: 'Sent for review',
      rm_done: 'Picture removed', rm_ask: 'Remove your picture and go back to a preset avatar?',
      e_big: 'The file is too large even after compression. Pick a smaller image.',
      e_img: 'That does not look like an image. JPG or PNG is needed.',
      e_net: 'No connection to the server — check the internet and try again.',
      e_auth: 'Access not confirmed — reopen the app from the bot.',
      e_rate: 'Too often. Wait a bit and try again.',
      e_nsfw: 'The picture was rejected by the automatic check. Choose another one.',
      e_srv: 'Server error. Try again later.',
      e_load: 'Could not load your data. Check the internet.',
      none_t: 'The app did not open', none_d: 'Open the bot and tap "🖼 My avatar" in your profile.',
      foot: 'The picture is stored on the bot server and visible to other players'
    }
  };
  var L = TX[LANG];

  var S = { status: 'none', url: null, shot: null, busy: false };
  var toastT = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2600); }
  function haptic(kind) { try { tg && tg.HapticFeedback && (kind ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.selectionChanged()); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function showErr(h) { var e = $('err'); if (!h) { e.hidden = true; e.innerHTML = ''; return; } e.innerHTML = h; e.hidden = false; }

  function texts() {
    $('ttl').textContent = L.ttl; $('sub').textContent = L.sub;
    $('drop-t').textContent = L.drop_t; $('drop-d').textContent = L.drop_d + ' ' + L.drop_alt;
    $('btn-send').textContent = L.send; $('btn-swap').textContent = L.swap; $('btn-rm').textContent = L.rm;
    $('none-t').textContent = L.none_t; $('none-d').textContent = L.none_d;
    $('foot').textContent = L.foot;
    var ic = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16v.5"/><circle cx="12" cy="12" r="9"/></svg>';
    $('rules').innerHTML = '<li class="warn">' + ic + '<span>' + esc(L.r1) + '</span></li>'
      + '<li>' + ic + '<span>' + esc(L.r2) + '</span></li>'
      + '<li>' + ic + '<span>' + esc(L.r3) + '</span></li>';
  }

  // ── Запросы ─────────────────────────────────────────────────────────
  function jfetch(url, opts, limit) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, limit || 15000);
    opts = opts || {}; opts.cache = 'no-store'; if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; });
    }, function (e) { clearTimeout(timer); throw e; });
  }
  function getState() {
    var url = API + '/casino/avatar/state?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET) +
      (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');
    return jfetch(url, {}, 12000).then(function (res) {
      if (res.status === 401 && !useInit && INIT) { useInit = true; return getState(); }
      return res;
    });
  }

  // ── Отрисовка состояния ─────────────────────────────────────────────
  function render() {
    var st = S.status, ring = $('ring'), stEl = $('st');
    var img = ring.querySelector('img'), ph = $('ph');
    if (S.url) {
      if (!img) { img = document.createElement('img'); img.alt = ''; ring.appendChild(img); }
      img.src = S.url; if (ph) ph.hidden = true;
    } else {
      if (img) img.remove();
      if (ph) ph.hidden = false;
    }
    var map = {
      none: ['', L.s_none, L.s_none_d, 'rgba(255,255,255,.7)'],
      pending: ['wait', L.s_wait, L.s_wait_d, '#ffcf5c'],
      ok: ['ok', L.s_ok, L.s_ok_d, '#34f5a4'],
      blocked: ['no', L.s_no, L.s_no_d, '#ff4d6d']
    };
    var m = map[st] || map.none;
    stEl.className = 'st' + (m[0] ? ' ' + m[0] : '');
    $('st-t').textContent = m[1];
    $('st-d').innerHTML = m[2];
    ring.style.setProperty('--rc', m[3]);
    $('rm-wrap').hidden = (st === 'none');
  }

  // ── Картинка: сжимаем в браузере ────────────────────────────────────
  var MAXSIDE = 512, MAXBYTES = 400 * 1024;
  function readImage(file) {
    return new Promise(function (res, rej) {
      if (!file || !/^image\//.test(file.type || '')) return rej(new Error('type'));
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('read')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error('decode')); };
        im.onload = function () {
          // центральный квадрат — сервер сделает так же, но игрок должен видеть ровно то, что отправляет
          var side = Math.min(im.width, im.height);
          var sx = (im.width - side) / 2, sy = (im.height - side) / 2;
          var out = Math.min(MAXSIDE, side);
          var c = document.createElement('canvas'); c.width = out; c.height = out;
          c.getContext('2d').drawImage(im, sx, sy, side, side, 0, 0, out, out);
          var q = 0.9, url = c.toDataURL('image/jpeg', q);
          while (url.length * 0.75 > MAXBYTES && q > 0.4) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
          res({ dataUrl: url, bytes: Math.round(url.length * 0.75), side: out });
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function handleFile(file) {
    showErr('');
    return readImage(file).then(function (shot) {
      if (shot.bytes > MAXBYTES * 1.3) { showErr(esc(L.e_big)); return; }
      S.shot = shot;
      $('prev-img').src = shot.dataUrl;
      $('prev-meta').textContent = shot.side + '×' + shot.side + ' · ' + Math.round(shot.bytes / 1024) + ' KB';
      $('prev').hidden = false; $('acts').hidden = false; $('drop').hidden = true;
      haptic();
    }).catch(function () { showErr(esc(L.e_img)); });
  }

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
    e.target.value = '';
  });
  $('drop').addEventListener('pointermove', function (e) {
    var r = this.getBoundingClientRect();
    this.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    this.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  document.addEventListener('paste', function (e) {
    var it = e.clipboardData && e.clipboardData.items;
    if (!it) return;
    for (var i = 0; i < it.length; i++) {
      if (it[i].type && it[i].type.indexOf('image') === 0) { var f = it[i].getAsFile(); if (f) handleFile(f); return; }
    }
  });
  $('btn-swap').addEventListener('click', backToPick);
  function backToPick() {
    S.shot = null; $('prev').hidden = true; $('acts').hidden = true; $('drop').hidden = false; showErr('');
  }

  // ── Отправка ────────────────────────────────────────────────────────
  $('btn-send').addEventListener('click', function () {
    if (S.busy || !S.shot) return;
    S.busy = true; $('btn-send').disabled = true;
    var body = JSON.stringify({ uid: UID, secret: SECRET, init_data: INIT || undefined, image: S.shot.dataUrl });
    jfetch(API + '/casino/avatar/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }, 30000)
      .then(function (res) {
        S.busy = false; $('btn-send').disabled = false;
        var j = res.j || {};
        if (j.ok) {
          S.status = j.status || 'pending';
          S.url = S.shot.dataUrl;      // свою показываем сразу, не дожидаясь сервера
          backToPick(); render();
          toast(L.sent); haptic('success');
          return;
        }
        var e = j.error;
        if (e === 'nsfw') { S.status = 'blocked'; S.url = null; render(); showErr(esc(L.e_nsfw)); haptic('error'); return; }
        if (e === 'rate_limited') return showErr(esc(L.e_rate));
        if (e === 'too_large') return showErr(esc(L.e_big));
        if (e === 'bad_image') return showErr(esc(L.e_img));
        if (e === 'unauthorized') return showErr(esc(L.e_auth));
        showErr(esc(L.e_srv)); haptic('error');
      })
      .catch(function () { S.busy = false; $('btn-send').disabled = false; showErr(esc(L.e_net)); haptic('error'); });
  });

  $('btn-rm').addEventListener('click', function () {
    if (S.busy) return;
    if (!confirm(L.rm_ask)) return;
    S.busy = true; $('btn-rm').disabled = true;
    var body = JSON.stringify({ uid: UID, secret: SECRET, init_data: INIT || undefined });
    jfetch(API + '/casino/avatar/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }, 20000)
      .then(function (res) {
        S.busy = false; $('btn-rm').disabled = false;
        if (res.j && res.j.ok) { S.status = 'none'; S.url = null; render(); toast(L.rm_done); haptic('success'); return; }
        showErr(esc(L.e_srv));
      })
      .catch(function () { S.busy = false; $('btn-rm').disabled = false; showErr(esc(L.e_net)); });
  });

  // ── Старт ───────────────────────────────────────────────────────────
  function show(v) { $('v-load').hidden = v !== 'load'; $('v-main').hidden = v !== 'main'; $('v-none').hidden = v !== 'none'; }
  function boot() {
    texts();
    if (!API || !UID) { show('none'); return; }
    getState().then(function (res) {
      if (res.status === 401) { show('none'); $('none-d').textContent = L.e_auth; return; }
      var j = res.j;
      if (!j || j.ok !== true) { show('main'); render(); showErr(esc(L.e_load)); return; }
      S.status = j.status || 'none';
      S.url = j.url || null;
      show('main'); render();
    }).catch(function () { show('main'); render(); showErr(esc(L.e_load)); });
  }
  show('load');
  boot();

  window.AV = { state: function () { return S; }, handleFile: handleFile, render: render, ver: VER };
})();
</script>
</body>
