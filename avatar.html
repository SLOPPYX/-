<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Моя аватарка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* v320: фирменная пара казино — фиолетовый и циан — вместо прежней чёрно-белой темы.
     Смысловые цвета (одобрено / ждёт / отклонено) остаются отдельными: по ним читается статус. */
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #06060c; --ink: #fff; --ink2: #9d9db0; --ink3: #5e5e73;
    --vio: #bf00ff; --cy: #00e5ff;
    --line: rgba(255,255,255,.1); --line2: rgba(255,255,255,.18);
    --ok: #2ff3a4; --no: #ff4d6d; --wait: #ffc84a;
  }
  html, body { background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, label { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* Фон: два больших цветных пятна, медленно дышат. Они дают глубину без единой картинки. */
  .aurora { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
  .aurora i:nth-child(1) { width: 420px; height: 420px; top: -170px; left: -120px; background: radial-gradient(circle, rgba(191,0,255,.75), transparent 68%); animation: dr1 18s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 380px; height: 380px; bottom: -160px; right: -130px; background: radial-gradient(circle, rgba(0,229,255,.6), transparent 68%); animation: dr2 22s ease-in-out infinite; }
  .grain { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.09) 1px, transparent 1px); background-size: 24px 24px;
    -webkit-mask: radial-gradient(ellipse 95% 55% at 50% 0, #000, transparent 78%); mask: radial-gradient(ellipse 95% 55% at 50% 0, #000, transparent 78%); }
  @keyframes dr1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,30px) scale(1.08); } }
  @keyframes dr2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-36px,-28px) scale(1.06); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.86); } 60% { transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes ang { to { --ang: 360deg; } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes sheen { to { background-position: 260% 0; } }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(30px + env(safe-area-inset-bottom, 0px)); }

  /* Шапка: иконка в стеклянном квадрате с градиентной рамкой */
  .hd { display: flex; align-items: center; gap: 13px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .hd-b { position: relative; width: 52px; height: 52px; flex-shrink: 0; border-radius: 17px; display: grid; place-items: center;
    background: linear-gradient(150deg, rgba(191,0,255,.28), rgba(0,229,255,.2)); box-shadow: 0 10px 30px -10px rgba(191,0,255,.8); }
  .hd-b::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 17px; padding: 1px;
    background: linear-gradient(150deg, rgba(191,0,255,.9), rgba(0,229,255,.7)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }
  .hd-ic { width: 27px; height: 27px; }
  .hd-w { font-size: 25px; font-weight: 900; letter-spacing: .02em; line-height: 1.05;
    background: linear-gradient(95deg, #fff 10%, #e0b6ff 40%, #9ef0ff 75%, #fff 100%) 0 0 / 260% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: sheen 7s linear infinite; }
  .hd-s { margin-top: 5px; font-size: 12px; color: var(--ink2); line-height: 1.4; }

  /* Стеклянная карточка с тонкой градиентной обводкой — основной приём нового оформления */
  .glass { position: relative; border-radius: 26px; background: rgba(255,255,255,.045);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 26px 60px -34px rgba(0,0,0,.9); }
  .glass::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 26px; padding: 1px; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,.05) 45%, rgba(191,0,255,.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  .now { margin-top: 18px; padding: 26px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 15px;
    animation: rise .5s .05s cubic-bezier(.2,.8,.2,1) both; }
  /* Кольцо вокруг аватарки: цвет статуса + мягкое свечение того же цвета под ней */
  .ring { position: relative; width: 156px; height: 156px; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
  .ring::before { content: ''; position: absolute; top: -7px; right: -7px; bottom: -7px; left: -7px; border-radius: 50%; z-index: -2;
    background: conic-gradient(from var(--ang), transparent 8%, var(--rc, #fff) 45%, transparent 82%); animation: ang 6s linear infinite; }
  .ring::after { content: ''; position: absolute; top: 4px; right: 4px; bottom: 4px; left: 4px; border-radius: 50%; z-index: -1;
    box-shadow: 0 0 46px 6px var(--rc, rgba(255,255,255,.5)); opacity: .5; }
  .ring img, .ring .ph { width: 142px; height: 142px; border-radius: 50%; object-fit: cover; display: block; background: #0c0c16; }
  .ring .ph { display: grid; place-items: center; font-size: 54px; }

  .st { display: inline-flex; align-items: center; gap: 9px; padding: 9px 17px; border-radius: 999px; font-size: 13px; font-weight: 800;
    border: 1px solid var(--line2); background: rgba(255,255,255,.06); }
  .st i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); }
  .st.ok { color: #a7fcdb; border-color: rgba(47,243,164,.5); background: rgba(47,243,164,.12); }
  .st.ok i { background: var(--ok); box-shadow: 0 0 14px var(--ok); }
  .st.wait { color: #ffe6ac; border-color: rgba(255,200,74,.5); background: rgba(255,200,74,.12); }
  .st.wait i { background: var(--wait); box-shadow: 0 0 14px var(--wait); animation: blink 1.4s ease-in-out infinite; }
  .st.no { color: #ffd0d8; border-color: rgba(255,77,109,.55); background: rgba(255,77,109,.12); }
  .st.no i { background: var(--no); box-shadow: 0 0 14px var(--no); }
  .st-d { font-size: 13px; line-height: 1.55; color: var(--ink2); text-align: center; max-width: 330px; }
  .st-d b { color: #fff; }

  /* Зона выбора файла: пунктир + подсветка под пальцем */
  .drop { position: relative; isolation: isolate; overflow: hidden; display: block; width: 100%; margin-top: 14px;
    padding: 28px 18px 24px; border-radius: 26px; text-align: center; border: 1.5px dashed rgba(255,255,255,.22);
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), rgba(191,0,255,.28), transparent 68%), rgba(255,255,255,.03);
    transition: transform .15s, border-color .2s, box-shadow .2s; }
  .drop:active { transform: scale(.985); }
  .drop.over { border-color: rgba(0,229,255,.8); box-shadow: 0 0 44px -12px rgba(0,229,255,.9); }
  .drop .ic { width: 54px; height: 54px; margin: 0 auto 12px; display: block; opacity: .95; }
  .drop .t1 { font-size: 17px; font-weight: 900; }
  .drop .t2 { margin-top: 7px; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .prev { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pop .35s both; }
  .prev img { width: 172px; height: 172px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 0 56px -12px rgba(191,0,255,.9); }
  .prev .meta { font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

  .btn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
    min-height: 56px; padding: 15px 18px; border-radius: 19px; font-size: 15px; font-weight: 900; letter-spacing: .03em;
    transition: transform .12s ease, box-shadow .2s, background .2s; }
  .btn:active { transform: scale(.975); }
  .btn.pri { color: #fff; background: linear-gradient(100deg, var(--vio), #7b3cff 55%, var(--cy));
    box-shadow: 0 12px 38px -12px rgba(191,0,255,.95), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.ghost { color: #fff; background: rgba(255,255,255,.06); border: 1px solid var(--line2); }
  .btn.ghost:active { background: rgba(255,255,255,.13); }
  .btn.dgr { color: #ffd0d8; background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.45); }
  .btn[disabled] { opacity: .45; }
  .btn + .btn { margin-top: 10px; }

  .err { margin-top: 14px; padding: 14px 16px; border-radius: 18px; font-size: 13.5px; line-height: 1.5; color: #ffd0d8;
    background: rgba(255,77,109,.12); border: 1px solid rgba(255,77,109,.5); animation: pop .35s both; }

  .rules { margin-top: 16px; padding: 6px 4px; list-style: none; }
  .rules li { display: flex; gap: 11px; align-items: flex-start; padding: 9px 2px; font-size: 12.5px; line-height: 1.45; color: var(--ink2);
    border-bottom: 1px solid rgba(255,255,255,.055); }
  .rules li:last-child { border-bottom: 0; }
  .rules li svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; stroke: var(--cy); }
  .rules li.warn svg { stroke: var(--wait); } .rules li.warn { color: #ded4bd; }
  .foot { margin-top: 18px; text-align: center; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); }
  .sk { border-radius: 26px; background: linear-gradient(100deg, rgba(255,255,255,.04) 30%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.04) 70%) 0 0 / 300% 100%; animation: sheen 1.6s linear infinite; }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    max-width: 88%; padding: 13px 20px; border-radius: 15px; font-size: 13px; font-weight: 700; text-align: center;
    background: linear-gradient(100deg, var(--vio), var(--cy)); color: #fff; box-shadow: 0 14px 40px -14px rgba(191,0,255,.9);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fatal { display: none; padding: 40px 22px; text-align: center; }
  .fatal .t1 { font-size: 19px; font-weight: 900; }
  .fatal .t2 { margin-top: 10px; font-size: 13px; color: var(--ink2); line-height: 1.5; }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i></div><div class="grain"></div>

<div class="fatal" id="fatal">
  <div class="t1">Что-то пошло не так</div>
  <div class="t2" id="fatal-d"></div>
</div>

<main class="app" id="app">
  <header class="hd">
    <div class="hd-b">
      <svg class="hd-ic" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="9" r="3.6"/><path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/>
      </svg>
    </div>
    <div>
      <div class="hd-w" id="ttl">Моя аватарка</div>
      <div class="hd-s" id="sub">Видна всем игрокам в топе «Рангов»</div>
    </div>
  </header>

  <section id="v-load"><div class="sk" style="height:260px;margin-top:18px"></div></section>

  <section id="v-main" hidden>
    <div class="now glass">
      <div class="ring" id="ring"><div class="ph" id="ph">🎮</div></div>
      <div class="st" id="st"><i></i><span id="st-t"></span></div>
      <div class="st-d" id="st-d"></div>
    </div>

    <div class="err" id="err" hidden></div>

    <label class="drop" id="drop" for="file">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="url(#avg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <defs><linearGradient id="avg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bf00ff"/><stop offset="1" stop-color="#00e5ff"/></linearGradient></defs>
        <rect x="3" y="6" width="18" height="14" rx="4"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 6l1.2-2h4.6l1.2 2"/>
      </svg>
      <div class="t1" id="drop-t">Выбрать картинку</div>
      <div class="t2" id="drop-d">Квадратная — лучше всего. Из любой сделаем круг.</div>
    </label>
    <input type="file" id="file" accept="image/*" class="vh">

    <div class="prev" id="prev" hidden>
      <img id="prev-img" alt="">
      <span class="meta" id="prev-meta"></span>
    </div>

    <div style="margin-top:14px" id="acts" hidden>
      <button class="btn pri" type="button" id="btn-send"></button>
      <button class="btn ghost" type="button" id="btn-swap"></button>
    </div>

    <div style="margin-top:14px" id="rm-wrap" hidden>
      <button class="btn dgr" type="button" id="btn-rm"></button>
    </div>

    <ul class="rules" id="rules"></ul>
    <div class="foot" id="foot"></div>
  </section>

  <section id="v-none" hidden>
    <div class="now glass" style="margin-top:24px">
      <div class="st no"><i></i><span id="none-t"></span></div>
      <div class="st-d" id="none-d"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
window.addEventListener('error', function (e) {
  try {
    document.getElementById('app').style.display = 'none';
    var f = document.getElementById('fatal'); f.style.display = 'block';
    document.getElementById('fatal-d').textContent = 'Закрой и открой приложение заново. Причина: ' + String((e && e.message) || 'ошибка') + ' · v322';
  } catch (_) {}
}, true);
</script>
<script>
/* SDK Telegram грузим НЕ блокируя страницу (урок v295): если telegram.org медленный, страница всё равно стартует. */
(function () {
  var s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js'; s.async = true;
  s.onload = function () { try { if (window.__avTg) window.__avTg(); } catch (e) {} };
  (document.head || document.documentElement).appendChild(s);
})();
</script>

  function showErr(h) { var e = $('err'); if (!h) { e.hidden = true; e.innerHTML = ''; return; } e.innerHTML = h; e.hidden = false; }

  function texts() {
    $('ttl').textContent = L.ttl; $('sub').textContent = L.sub;
    $('drop-t').textContent = L.drop_t; $('drop-d').textContent = L.drop_d + ' ' + L.drop_alt;
    $('btn-send').textContent = L.send; $('btn-swap').textContent = L.swap; $('btn-rm').textContent = L.rm;
    $('none-t').textContent = L.none_t; $('none-d').textContent = L.none_d;
    $('foot').textContent = L.foot;
    var ic = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16v.5"/><circle cx="12" cy="12" r="9"/></svg>';
    $('rules').innerHTML = '<li class="warn">' + ic + '<span>' + esc(L.r1) + '</span></li>'
      + '<li>' + ic + '<span>' + esc(L.r4) + '</span></li>'
      + '<li>' + ic + '<span>' + esc(L.r2) + '</span></li>'
      + '<li>' + ic + '<span>' + esc(L.r3) + '</span></li>';

  // ── Запросы ─────────────────────────────────────────────────────────
  function jfetch(url, opts, limit) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, limit || 15000);
    opts = opts || {}; opts.cache = 'no-store'; if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).then(function (r) {
      clearTimeout(timer);
      return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; });
    }, function (e) { clearTimeout(timer); throw e; });
  }
  function getState() {
    var url = API + '/casino/avatar/state?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET) +
      (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');
    return jfetch(url, {}, 12000).then(function (res) {
      if (res.status === 401 && !useInit && INIT) { useInit = true; return getState(); }
      return res;
    });
  }

  // ── Отрисовка состояния ─────────────────────────────────────────────
  function render() {
    var st = S.status, ring = $('ring'), stEl = $('st');
    var img = ring.querySelector('img'), ph = $('ph');
    if (S.url) {
      if (!img) { img = document.createElement('img'); img.alt = ''; ring.appendChild(img); }
      img.src = S.url; if (ph) ph.hidden = true;
    } else {
      if (img) img.remove();
      if (ph) ph.hidden = false;
    }
    var map = {
      none: ['', L.s_none, L.s_none_d, 'rgba(255,255,255,.7)'],
      pending: ['wait', L.s_wait, L.s_wait_d, '#ffcf5c'],
      ok: ['ok', L.s_ok, L.s_ok_d, '#34f5a4'],
      blocked: ['no', L.s_no, L.s_no_d, '#ff4d6d']
    };
    var m = map[st] || map.none;
    stEl.className = 'st' + (m[0] ? ' ' + m[0] : '');
    $('st-t').textContent = m[1];
    $('st-d').innerHTML = m[2];
    ring.style.setProperty('--rc', m[3]);
    $('rm-wrap').hidden = (st === 'none');
  }


  // ── Проверка на 18+ прямо в браузере ────────────────────────────────
  /* v321: модель (MobileNetV2 из nsfwjs, 2.7 МБ) и tfjs лежат рядом со страницей и грузятся
     ТОЛЬКО когда игрок выбрал картинку — иначе открытие мини-аппа платило бы 4 МБ впустую.
     Считает телефон игрока: сервер бота с 889 МБ памяти такую модель не выдержит.
     Обойти проверку в браузере можно, поэтому она не отменяет ручное одобрение — она лишь
     не даёт очевидному 18+ дойти до администратора. Любой сбой = 'unknown' = пропускаем
     дальше: необязательный слой не имеет права мешать человеку поставить аватарку. */
  var NSFW_BASE = 'nsfw/';
  var NSFW_LIMIT = 40000;          // столько ждём модель, дальше считаем, что проверки нет
  var NSFW_SIDE = 224;
  // Пороги высокие намеренно. Аватарки здесь — арты и скриншоты из игры, а модель склонна
  // видеть в рисунке «hentai». Лучше лишний раз показать картинку человеку, чем отклонить нормальную.
  var NSFW_PORN = 0.85, NSFW_HENTAI = 0.90, NSFW_BOTH = 0.92;
  var NSFW = { ready: null };

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('script ' + src)); };
      (document.head || document.documentElement).appendChild(s);
    });
  }

  function nsfwModel() {
    if (NSFW.ready) return NSFW.ready;
    NSFW.ready = Promise.resolve()
      .then(function () { return window.tf ? null : loadScript(NSFW_BASE + 'tf.min.js'); })
      .then(function () {
        if (!window.tf) throw new Error('tf');
        return window.tf.loadLayersModel(NSFW_BASE + 'model.json');
      });
    return NSFW.ready;
  }

  function nsfwRun(canvas) {
    return nsfwModel().then(function (model) {
      var tf = window.tf;
      // ровно тот препроцессинг, на котором модель обучалась: пиксели /255 и билинейный ресайз до 224
      var out = tf.tidy(function () {
        var img = tf.browser.fromPixels(canvas).toFloat().div(tf.scalar(255));
        if (img.shape[0] !== NSFW_SIDE || img.shape[1] !== NSFW_SIDE) {
          img = tf.image.resizeBilinear(img, [NSFW_SIDE, NSFW_SIDE], true);
        }
        return model.predict(img.reshape([1, NSFW_SIDE, NSFW_SIDE, 3]));
      });
      return out.data().then(function (v) {
        out.dispose();
        return Array.prototype.slice.call(v);   // [Drawing, Hentai, Neutral, Porn, Sexy]
      });
    });
  }

  function nsfwCheck(canvas) {
    var t0 = Date.now();
    var timer;
    var guard = new Promise(function (_, rej) { timer = setTimeout(function () { rej(new Error('timeout')); }, NSFW_LIMIT); });
    return Promise.race([nsfwRun(canvas), guard]).then(function (p) {
      clearTimeout(timer);
      var hentai = p[1], porn = p[3];
      var bad = (porn >= NSFW_PORN) || (hentai >= NSFW_HENTAI) || (porn + hentai >= NSFW_BOTH);
      return { v: bad ? 'block' : 'ok', p: p.map(function (x) { return Math.round(x * 1000) / 1000; }), ms: Date.now() - t0 };
    }, function (e) {
      clearTimeout(timer);
      // молча: игрок не виноват, что модель не доехала, и пугать его нечем — решит человек
      return { v: 'unknown', why: String((e && e.message) || e).slice(0, 60), ms: Date.now() - t0 };
    });
  }

  function setSend(mode) {
    var b = $('btn-send');
    if (mode === 'check') { b.disabled = true; b.textContent = L.chk_run; }
    else if (mode === 'block') { b.disabled = true; b.textContent = L.chk_no; }
    else { b.disabled = false; b.textContent = L.send; }
  }

  // ── Картинка: сжимаем в браузере ────────────────────────────────────
  var MAXSIDE = 512, MAXBYTES = 400 * 1024;
  function readImage(file) {
    return new Promise(function (res, rej) {
      if (!file || !/^image\//.test(file.type || '')) return rej(new Error('type'));
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('read')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error('decode')); };
        im.onload = function () {
          // центральный квадрат — сервер сделает так же, но игрок должен видеть ровно то, что отправляет
          var side = Math.min(im.width, im.height);
          var sx = (im.width - side) / 2, sy = (im.height - side) / 2;
          var out = Math.min(MAXSIDE, side);
          var c = document.createElement('canvas'); c.width = out; c.height = out;
          c.getContext('2d').drawImage(im, sx, sy, side, side, 0, 0, out, out);
          var q = 0.9, url = c.toDataURL('image/jpeg', q);
          while (url.length * 0.75 > MAXBYTES && q > 0.4) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
          // canvas отдаём наружу: проверка на 18+ возьмёт готовые пиксели, а не станет декодировать заново
          res({ dataUrl: url, bytes: Math.round(url.length * 0.75), side: out, canvas: c });
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function handleFile(file) {
    showErr('');
    return readImage(file).then(function (shot) {
      if (shot.bytes > MAXBYTES * 1.3) { showErr(esc(L.e_big)); return; }
      S.shot = shot;
      $('prev-img').src = shot.dataUrl;
      $('prev-meta').textContent = shot.side + '×' + shot.side + ' · ' + Math.round(shot.bytes / 1024) + ' KB';
      $('prev').hidden = false; $('acts').hidden = false; $('drop').hidden = true;
      haptic();
      // Проверку запускаем сразу, пока игрок смотрит на превью: к моменту, когда он потянется
      // к кнопке, вердикт обычно уже есть, и ждать ему нечего.
      S.check = null;
      setSend('check');
      nsfwCheck(shot.canvas).then(function (r) {
        if (S.shot !== shot) return;        // игрок успел выбрать другую картинку — этот вердикт уже не про неё
        S.check = r;
        if (r.v === 'block') { setSend('block'); showErr(esc(L.e_nsfw_dev)); haptic('error'); return; }
        setSend('ok');
      });
    }).catch(function () { showErr(esc(L.e_img)); });
  }

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
    e.target.value = '';
  });
  $('drop').addEventListener('pointermove', function (e) {
    var r = this.getBoundingClientRect();
    this.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    this.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); this.classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  document.addEventListener('paste', function (e) {
    var it = e.clipboardData && e.clipboardData.items;
    if (!it) return;
    for (var i = 0; i < it.length; i++) {
      if (it[i].type && it[i].type.indexOf('image') === 0) { var f = it[i].getAsFile(); if (f) handleFile(f); return; }
    }
  });
  $('btn-swap').addEventListener('click', backToPick);
  function backToPick() {
    S.shot = null; S.check = null;
    $('prev').hidden = true; $('acts').hidden = true; $('drop').hidden = false; showErr('');
    setSend('ok');
  }

  // ── Отправка ────────────────────────────────────────────────────────
  $('btn-send').addEventListener('click', function () {
    if (S.busy || !S.shot) return;
    if (S.check && S.check.v === 'block') return;   // страховка: кнопка и так заблокирована
    S.busy = true; $('btn-send').disabled = true;
    // check — ПОДСКАЗКА администратору, а не решение: с устройства её можно подделать,
    // поэтому сервер по ней ничего не блокирует и не одобряет.
    var body = JSON.stringify({ uid: UID, secret: SECRET, init_data: INIT || undefined, image: S.shot.dataUrl,
                                check: S.check || { v: 'unknown' } });
    jfetch(API + '/casino/avatar/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }, 30000)
      .then(function (res) {
        S.busy = false; setSend('ok');
        var j = res.j || {};
        if (j.ok) {
          S.status = j.status || 'ok';
          S.url = S.shot.dataUrl;      // показываем сразу: сервер уже принял решение
          backToPick(); render();
          toast(L.sent); haptic('success');
          return;
        }
        var e = j.error;
        // v322: сервер не заменяет уже принятую аватарку, если новая не прошла, — значит и
        // здесь ничего не стираем и не рисуем «Отклонена»: у игрока всё осталось как было.
        if (e === 'nsfw') { showErr(esc(L.e_nsfw)); haptic('error'); return; }
        if (e === 'check_unavailable') { showErr(esc(L.e_check)); haptic('error'); return; }
        if (e === 'rate_limited') return showErr(esc(L.e_rate));
        if (e === 'too_large') return showErr(esc(L.e_big));
        if (e === 'bad_image') return showErr(esc(L.e_img));
        if (e === 'unauthorized') return showErr(esc(L.e_auth));
        showErr(esc(L.e_srv)); haptic('error');
      })
      .catch(function () { S.busy = false; setSend('ok'); showErr(esc(L.e_net)); haptic('error'); });
  });

  $('btn-rm').addEventListener('click', function () {
    if (S.busy) return;
    if (!confirm(L.rm_ask)) return;
    S.busy = true; $('btn-rm').disabled = true;
    var body = JSON.stringify({ uid: UID, secret: SECRET, init_data: INIT || undefined });
    jfetch(API + '/casino/avatar/remove', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body }, 20000)
      .then(function (res) {
        S.busy = false; $('btn-rm').disabled = false;
        if (res.j && res.j.ok) { S.status = 'none'; S.url = null; render(); toast(L.rm_done); haptic('success'); return; }
        showErr(esc(L.e_srv));
      })
      .catch(function () { S.busy = false; $('btn-rm').disabled = false; showErr(esc(L.e_net)); });
  });

  // ── Старт ───────────────────────────────────────────────────────────
  function show(v) { $('v-load').hidden = v !== 'load'; $('v-main').hidden = v !== 'main'; $('v-none').hidden = v !== 'none'; }
  function boot() {
    texts();
    if (!API || !UID) { show('none'); return; }
    getState().then(function (res) {
      if (res.status === 401) { show('none'); $('none-d').textContent = L.e_auth; return; }
      var j = res.j;
      if (!j || j.ok !== true) { show('main'); render(); showErr(esc(L.e_load)); return; }
      S.status = j.status || 'none';
      S.url = j.url || null;
      show('main'); render();
    }).catch(function () { show('main'); render(); showErr(esc(L.e_load)); });
  }
  show('load');
  boot();

  window.AV = { state: function () { return S; }, handleFile: handleFile, render: render, ver: VER,
                nsfwCheck: nsfwCheck, nsfwModel: nsfwModel };
})();
