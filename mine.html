(function () {
  var TK = '';
  try { TK = new URLSearchParams(location.search).get('tk') || ''; } catch (e) {}
  window.__TK = TK;
  var of = window.fetch;
  if (!of) return;
  window.fetch = function (u, o) {
    try {
      if (TK && typeof u === 'string' && u.indexOf('/casino/') >= 0 && String((o && o.method) || 'GET').toUpperCase() === 'GET') {
        u += (u.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK);
      }
    } catch (e) {}
    return of.call(this, u, o);
  };
})();
</script>

  .sl { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 1px solid var(--ln);
        background: radial-gradient(circle at 50% 46%, var(--rc, rgba(139,92,246,.35)), rgba(255,255,255,.03) 70%); }
  .sl.em { display: grid; place-items: center; border-style: dashed; color: var(--tx3); font-size: 18px; background: transparent; }

  .sl .fan { position: absolute; border-radius: 50%; animation: spin .8s linear infinite; animation-delay: var(--d, 0s);
             background: radial-gradient(circle, #2a2342 0 17%, transparent 18%),
               conic-gradient(rgba(221,214,254,.9) 0 8%, transparent 0 20%, rgba(221,214,254,.9) 0 28%, transparent 0 40%, rgba(221,214,254,.9) 0 48%,
                              transparent 0 60%, rgba(221,214,254,.9) 0 68%, transparent 0 80%, rgba(221,214,254,.9) 0 88%, transparent 0); }

  .sl .scan b { position: absolute; left: 0; right: 0; top: 0; height: 32%; background: linear-gradient(180deg, transparent, rgba(255,255,255,.5), transparent);

  /* ── ручной майнинг ── */

  function noTap(t) {                               // энергии нет / нажатия выключены: ядро вздрагивает, строка мигает; всплывашка — не чаще раза в 4 с
    var c = $('core'), en = document.querySelector('.enl');
    c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    en.classList.add('flash'); clearTimeout(S.flashT); S.flashT = setTimeout(function () { en.classList.remove('flash'); }, 900);
    hap('warning');
    if (Date.now() - (S.hintT || 0) > 4000) { S.hintT = Date.now(); toast(t); }
  }

  // v386: «Собрать» — из хранилища вылетают настоящие токены SLX, медленно летят дугой и крутятся; каждый, долетев, «щёлкает»
  // кошелёк, а цифра в нём набирается по монетке (accLoop) — эффект накопления. В конце над кошельком — «+0,0012 SLX».
  function tokSvg() {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0" stop-color="#e8d9ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>'
      + '<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf7ff"/><stop offset=".5" stop-color="#d8b4fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>'
      + '<circle cx="50" cy="50" r="46" fill="#0d0817" stroke="url(#r)" stroke-width="6"/><circle cx="50" cy="50" r="36" fill="none" stroke="url(#r)" stroke-width="2" opacity=".5"/>'
      + '<path d="M50 14 L63 29 L50 25 L37 29 Z" fill="url(#r)"/><text x="50" y="63" font-family="Arial,sans-serif" font-size="27" font-weight="900" fill="url(#t)" text-anchor="middle">SLX</text></svg>';
  }
  try { document.documentElement.style.setProperty('--tokimg', 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(tokSvg()) + '")'); } catch (e) {}
  function tokenFly(from, amt) {
    var L = live(), n = Math.max(5, Math.min(10, Math.round(4 + Math.log(Math.max(1, amt * price())) / Math.LN10 * 1.3)));
    var start = S.acc ? S.acc.shown : (L ? L.wallet : 0);
    S.acc = { from: start, to: start + amt, n: n, got: 0, shown: start, plus: amt };
    var fast = document.documentElement.classList.contains('calm') || !document.body.animate;
    if (fast) { S.acc.got = n; requestAnimationFrame(accLoop); return; }
    var a = from.getBoundingClientRect(), b = $('wal-logo').getBoundingClientRect();
    var tx = b.left + b.width / 2, ty = b.top + b.height / 2;
    for (var i = 0; i < n; i++) (function (i) {
      setTimeout(function () {
        var el = document.createElement('i'); el.className = 'tok'; el.innerHTML = '<b></b>';
        var sx = a.left + a.width * (0.15 + Math.random() * 0.7), sy = a.top + a.height / 2;
        el.style.left = sx + 'px'; el.style.top = sy + 'px';
        $('fx').appendChild(el);
        var dx = tx - sx, dy = ty - sy, bend = Math.random() * 70 - 35, lift = -50 - Math.random() * 45, done = false;
        var fin = function () { if (done) return; done = true; el.remove(); tokArrive(); };
        var an = el.animate([
          { transform: 'translate(0,0) scale(.25)', opacity: 0 },
          { transform: 'translate(' + (dx * .12 + bend) + 'px,' + lift + 'px) scale(1.15)', opacity: 1, offset: .32 },
          { transform: 'translate(' + (dx * .62 + bend * .4) + 'px,' + (dy * .55 + lift * .55) + 'px) scale(.95)', opacity: 1, offset: .68 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.5)', opacity: .85 }
        ], { duration: 1300 + Math.random() * 300, easing: 'cubic-bezier(.42,0,.3,1)', fill: 'forwards' });
        an.onfinish = fin;
        setTimeout(fin, 2400);                              // свёрнутое окно и т.п. — монетка всё равно «долетит»
      }, 140 * i);
    })(i);
    requestAnimationFrame(accLoop);
    setTimeout(function () { if (S.acc) S.acc.got = S.acc.n; }, 140 * n + 3200);
  }
  function tokArrive() {
    var A = S.acc; if (!A) return;
    A.got = Math.min(A.n, A.got + 1);
    var step = A.from + (A.to - A.from) * (A.got - 1) / A.n;          // цифра растёт с каждой монеткой, даже если кадров мало
    if (A.shown < step) A.shown = step;
    setTxt('w-slx', tkShort(A.shown));
    hap('sel');
    var g = $('wal-glw'), c = $('wal-chip');
    if (g.animate) g.animate([{ opacity: .95 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' });
    if (c.animate) c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
    if (A.got >= A.n) {
      var r = c.getBoundingClientRect(), p = document.createElement('div');
      p.className = 'wplus'; p.textContent = '+' + tkS(A.to - A.from) + ' ' + T.tokU;
      p.style.left = Math.max(8, r.left + r.width / 2 - 50) + 'px'; p.style.top = (r.bottom + 6) + 'px';
      $('fx').appendChild(p);
      setTimeout(function () { p.remove(); }, 1550);
    }
  }
  // цифра кошелька догоняет «сколько долетело» — плавно, по монетке. Ведут и кадры (accLoop), и обычный таймер (tick, раз в 150 мс):
  // кадры телефон может придержать (экономия батареи, свёрнутое окно) — цифра всё равно дойдёт. Конец — когда долетели все монетки
  // И пришёл ответ сервера (A.ok): иначе при медленной связи цифра на миг падала бы обратно к старой.
  function accStep(k) {
    var A = S.acc; if (!A) return true;
    var target = A.from + (A.to - A.from) * (A.got / A.n);
    A.shown += (target - A.shown) * k;
    if (Math.abs(target - A.shown) < 1e-10 || document.hidden) A.shown = target;
    setTxt('w-slx', tkShort(A.shown));
    if (S.tab === 'wallet') setTxt('wb-v', slxShort(A.shown));
    if (A.got >= A.n && A.shown === target && A.ok) { S.acc = null; return true; }
    return false;
  }
  function accLoop() {
    if (!accStep(0.18)) requestAnimationFrame(accLoop);
    else tick();
  }

  // v386: «майнинг идёт» — искры добычи вылетают из устройств и летят в хранилище (не больше 4 сразу; ферма стоит / не видно — нет)
  var spkN = 0;
  function spark() {                                // v387: на «⚡ Разгоне» искр втрое больше
    var hot = $('slots').classList.contains('hot');
    sparkOne(hot); if (hot) { sparkOne(hot); setTimeout(function () { sparkOne(hot); }, 320); }
  }
  function sparkOne(hot) {
    if (document.hidden || S.tab !== 'farm' || S.ovOpen || spkN >= (hot ? 10 : 4) || !document.body.animate) return;
    if (document.documentElement.classList.contains('calm')) return;
    var d = S.d, L = live(), box = $('slots');
    if (!d || !L || d.on === false || L.full || S.drain || box.classList.contains('idle')) return;
    var rigs = box.querySelectorAll('.sl[data-rig]'); if (!rigs.length) return;
    var t = $('tank').getBoundingClientRect(); if (t.bottom < 0 || t.top > window.innerHeight) return;
    var r = rigs[(Math.random() * rigs.length) | 0].getBoundingClientRect(); if (r.bottom < 0 || r.top > window.innerHeight) return;
    var sx = r.left + r.width / 2, sy = r.top + r.height * 0.35;
    var tx = t.left + t.width * Math.max(0.04, Math.min(1, L.st / (L.cap || 1))), ty = t.top + t.height / 2;
    var el = document.createElement('i'); el.className = 'spk'; el.style.left = sx + 'px'; el.style.top = sy + 'px';
    if (hot) el.style.background = 'radial-gradient(circle, #fff 0 24%, #fdba74 50%, rgba(239,68,68,0) 76%)';   // на разгоне искры огненные
    $('fx').appendChild(el); spkN++;
    var dx = tx - sx, dy = ty - sy, side = Math.random() * 50 - 25, done = false;
    var fin = function () { if (done) return; done = true; el.remove(); spkN--; };
    el.animate([
      { transform: 'translate(0,0) scale(.3)', opacity: 0 },
      { transform: 'translate(' + side + 'px,-16px) scale(1)', opacity: 1, offset: .2 },
      { transform: 'translate(' + (dx * .55 + side) + 'px,' + (dy * .5) + 'px) scale(.9)', opacity: .95, offset: .6 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.4)', opacity: 0 }
    ], { duration: 1150, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' }).onfinish = fin;
    setTimeout(fin, 1800);
  }
  setInterval(spark, 650);
  if ('IntersectionObserver' in window) {           // комната ушла за край экрана — её анимации на паузе
    try { new IntersectionObserver(function (es) { es.forEach(function (e) { $('slots').classList.toggle('idle', !e.isIntersecting); }); }).observe($('room')); } catch (e) {}
  }
  function bigEvent(e, title, sub) {
    var w = document.createElement('div'); w.className = 'big-ev';
    w.innerHTML = '<div class="bx"><span class="be">' + e + '</span><b>' + esc(title) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';
    document.body.appendChild(w);
    setTimeout(function () { w.remove(); }, 2500);
  }
  var toastT = 0;
  function toast(t, err) {
    var el = $('toast'); el.textContent = t; el.classList.toggle('bad', !!err); el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2400);
  }
  function coach(L) {                               // подсказки новичку в подвале — по одной
    var d = S.d, t = '', el = null, old = document.querySelector('.coach');
    if (d.ch === 1 && !S.ovOpen && d.on !== false) {
      if (!d.taps && d.taps_on !== false && L.en >= 1 && !S.pend && !S.fly) { t = T.coachTap; el = $('core'); }
      else if (!d.col && L.st > 0 && L.st * price() >= 1) { t = T.coachCol; el = $('b-col'); }
      else if (usedN() < 2 && L.wallet >= (d.prices.phone || 1)) { t = T.coachShop; el = document.querySelector('.nav button[data-tab="shop"]'); }
    }
    if (S.coach === t && (old || !t)) return;
    if (old) old.remove();
    S.coach = t;
    if (!t || !el) return;
    var r = el.getBoundingClientRect(), c = document.createElement('div'), fixed = !!el.closest('.nav');
    c.className = 'coach'; c.textContent = t; document.body.appendChild(c);
    var x = Math.max(8, Math.min(window.innerWidth - c.offsetWidth - 8, r.left + r.width / 2 - c.offsetWidth / 2));
    c.style.position = fixed ? 'fixed' : 'absolute';                    // над нижним меню — не уезжает при прокрутке
    c.style.left = x + 'px'; c.style.top = (r.top + (fixed ? 0 : window.scrollY) - c.offsetHeight - 10) + 'px';
  }

  // ── сюжет поверх всего ──
  function storyLines(n, outroBefore) {
    var out = [];
    if (outroBefore && STORY[(n - 1) + 'o']) out = out.concat(STORY[(n - 1) + 'o']);
    return out.concat(STORY[n] || []);
  }
  var OV = { lines: [], i: 0, opts: null };
  function storyShow(lines, opts) {
    OV.lines = lines; OV.i = 0; OV.opts = opts || {};
    S.ovOpen = true;
    var n = OV.opts.ch;
    $('ov-e').innerHTML = chIco(n === 0 ? 0 : Math.max(1, Math.min(8, n || 1)));      // v388: пролог, главы 1–7 и финал — SVG
    $('ov-st').textContent = n === 0 ? T.startS : n === 8 ? T.finaleT : T.chT(n) + ' · ' + T.locs[(n || 1) - 1];
    if (n >= 1 && n <= 7) document.body.setAttribute('data-ch', String(n));
    $('ov-lines').innerHTML = '';
    $('ov-skip').textContent = T.skip; $('ov-skip').hidden = !!OV.opts.noSkip;
    $('ov').classList.add('on');
    var c = document.querySelector('.coach'); if (c) c.remove(); S.coach = '';
    stepLine();
  }
  function lineHtml(l) {
    if (l[0] === 'rw') return '<div class="ln rw2"><span class="av">🎁</span><div class="bu">' + esc(l[1]) + '</div></div>';
    if (l[0] === 'n') return '<div class="ln n"><span class="av"></span><div class="bu">' + esc(l[1]) + '</div></div>';
    var s = SPK[l[0]] || SPK.me;
    return '<div class="ln"><span class="av">' + s.e + '</span><div class="bu"><span class="who" style="color:' + s.c + '">' + esc(SPK_N[l[0]] || '') + '</span>' + esc(l[1]) + '</div></div>';
  }
  function stepLine() {
    if (OV.i < OV.lines.length) {
      $('ov-lines').insertAdjacentHTML('beforeend', lineHtml(OV.lines[OV.i]));
      OV.i++;
      var box = $('ov-lines'); box.scrollTop = box.scrollHeight;
    }
    $('ov-next').textContent = OV.i < OV.lines.length ? T.next : (OV.opts.cta || T.go);
  }
  function storyEnd() {
    $('ov').classList.remove('on'); S.ovOpen = false;
    if (S.d) document.body.setAttribute('data-ch', String(S.d.ch || 1));
    var cb = OV.opts.done; OV.opts = {};
    if (cb) cb();
  }
  $('ov-next').addEventListener('click', function () {
    hap('sel');
    if (OV.i < OV.lines.length) stepLine(); else storyEnd();
  });
  $('ov-skip').addEventListener('click', function () {
    while (OV.i < OV.lines.length) stepLine();
    storyEnd();
  });
  function seen(n) { S.seenLocal = Math.max(S.seenLocal || 0, n); send('seen', { ch: n }, null, true); }
  function storyCheck(prevCh, prevDone, first) {    // новая глава / финал / первая глава — показать один раз
    var d = S.d; if (!d || S.ovOpen) return;
    if (!d.started) {
      if (d.on === false) return;                    // пауза у админа — ферму не построить, пролог не крутим по кругу
      storyShow(STORY[0], { ch: 0, cta: T.start, done: function () {
        send('start', {}).then(function (j) { if (!j && S.d) { S.d.started = false; } });
      } });
      return;
    }
    var st = Math.max(d.story || 0, S.seenLocal || 0), res = S.lastRes || {};
    if (d.done && st < 8) {
      var rw = (S.lastOp === 'finish' && res.reward) || S.cfg.rewards['7'] || null, ls = STORY[8].slice();
      if (rw) ls.push(['rw', T.reward + ': ' + (rw[0] === 'rig' ? T.rwd.rig(rw[1]) : T.rwd.slx(rw[1])) + ' · 👑 ' + T.titles[7]]);
      storyShow(ls, { ch: 8, done: function () { seen(8); } });
      return;
    }
    if (st < d.ch) {
      var moved = !!prevCh && prevCh < d.ch, lines = storyLines(d.ch, moved);
      if (moved && S.lastOp === 'move' && res.reward) {
        var r = res.reward, rt = r[0] === 'rig' ? T.rwd.rig(r[1]) : T.rwd.slx(r[1]);
        lines.splice((STORY[(d.ch - 1) + 'o'] || []).length, 0, ['rw', T.reward + ': ' + rt]);
      }
      var ch = d.ch;
      storyShow(lines, { ch: ch, done: function () { seen(ch); } });
    }
  }

  // ── загрузка, опрос, кэш ──
  var CK = 'mine_v2_' + UID;                      // v388: v2 — суммы в настоящих SLX (старую память v1 не берём: там SLX фермы)
  function cachePut() { try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), d: S.d, cfg: S.cfg, ex: S.ex, shop: S.shop, order: S.order, cid: S.cid, packs: S.packs })); } catch (e) {} }
  function cacheGet() {
    try { var o = JSON.parse(localStorage.getItem(CK) || 'null'); if (!o || !o.d || !o.cfg || Date.now() - o.t > 7 * 86400000) return null; return o; } catch (e) { return null; }
  }
  function fail(kind) {
    S.failKind = kind;
    var m = kind === 'params' ? T.errParams : kind === 'auth' ? T.errAuth : kind === 'reg' ? T.errReg : T.errNet;
    $('err-ic').textContent = kind === 'reg' ? '📝' : kind === 'auth' || kind === 'params' ? '🔑' : '📡';
    $('err-h').textContent = m[0]; $('err-p').textContent = m[1]; $('err-retry').textContent = T.retry;
    $('err-retry').hidden = kind === 'params';
    $('err').hidden = false;
  }
  function staleOn() { if (!S.stale) { S.stale = true; $('stale').textContent = T.stale; $('stale').hidden = false; } }
  var POLL = 25000, pollT = 0;
  function schedule() { clearTimeout(pollT); if (!document.hidden && S.loaded) pollT = setTimeout(function () { load(true); }, POLL); }
  function load(silent) {
    if (S.busy) return;
    if (!canLoad()) { if (!S.loaded) fail('params'); return; }
    S.busy = true;
    var again = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var tm = setTimeout(function () { if (ctrl) ctrl.abort(); }, S.loaded ? 10000 : [9000, 9000, 12000, 15000][Math.min(S.tries, 3)]);
    var url = API + '/casino/mine/state?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET) + (S.cfg && !S.needCfg ? '' : '&full=1')
      + (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');
    fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (res) {
        if (res.status === 401) {
          if (!useInit && INIT) { useInit = true; again = true; return; }
          if (S.loaded) staleOn(); else fail('auth');
          return;
        }
        if (res.status === 403 && res.j && res.j.error === 'unregistered') { fail('reg'); return; }
        if (res.status !== 200 || !res.j || !res.j.ok) throw new Error('HTTP ' + res.status);
        S.tries = 0; S.needCfg = false;
        apply(res.j, !silent);
      })
      .catch(function () {
        if (S.loaded) { staleOn(); return; }
        S.tries++;
        if (S.tries < 4) setTimeout(function () { load(false); }, [1200, 2500, 4500][S.tries - 1]);
        else fail('net');
      })
      .then(function () { clearTimeout(tm); S.busy = false; if (again) load(silent); else schedule(); });
  }
  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('paused', document.hidden);
    if (document.hidden) { clearTimeout(pollT); if (S.pend && !flushBeacon()) flush(); }
    else if (S.loaded && !S.busy) load(true);
  });
  setInterval(function () { if (!document.hidden && S.loaded) tick(); }, 150);
  setInterval(function () { if (!document.hidden && S.loaded) renderEv(); }, 30000);
  setInterval(function () { if (!S.loaded && !S.busy && S.failKind === 'net') { S.tries = 0; load(false); } }, 15000);
  $('err-retry').addEventListener('click', function () { $('err').hidden = true; S.tries = 0; S.failKind = ''; load(false); });

  // звёзды для орбиты
  (function () {
    var h = '';
    for (var i = 0; i < 40; i++) h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 100).toFixed(1) + '%;animation-delay:-' + (Math.random() * 3).toFixed(1) + 's;opacity:' + (0.3 + Math.random() * 0.7).toFixed(2) + '"></i>';
    $('stars').innerHTML = h;
  })();

  // старт: сначала — последние данные из памяти телефона (мгновенно), потом — свежие с сервера
  var c0 = cacheGet();
  if (c0 && c0.d && c0.d.started) {
    S.cfg = c0.cfg; S.ex = c0.ex || ''; S.d = c0.d; S.at = performance.now(); S.d.stored = c0.d.stored; S.loaded = true; S.needCfg = true;
    S.shop = c0.shop; S.order = c0.order; S.cid = c0.cid; S.packs = c0.packs;          // v388: донат из памяти телефона
    document.body.setAttribute('data-state', 'ready');
    render();
  }
  load(false);
})();
