<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* v385: личный ключ игрока (tk) — в каждый GET-запрос к боту, как в «Рангах» и «🔴 LIVE» (бот вписывает его только в ссылку самого игрока). */
(function () {
  var TK = '';
  try { TK = new URLSearchParams(location.search).get('tk') || ''; } catch (e) {}
  window.__TK = TK;
  var of = window.fetch;
  if (!of) return;
  window.fetch = function (u, o) {
    try {
      if (TK && typeof u === 'string' && u.indexOf('/casino/') >= 0 && String((o && o.method) || 'GET').toUpperCase() === 'GET') {
        u += (u.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK);
      }
    } catch (e) {}
    return of.call(this, u, o);
  };
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060c">
<title>Майнинг SLX</title>
<style>
  /* v385: «⛏ Майнинг SLX». Чёрный, фиолетовый, белый; у каждой главы свой свет. Двигаются только transform и opacity —
     на телефоне не тормозит; за экраном и в свёрнутом окне всё стоит. */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { color-scheme: dark;
          --bg: #07060c; --card: rgba(255,255,255,.04); --card2: rgba(255,255,255,.075); --ln: rgba(255,255,255,.085); --ln2: rgba(255,255,255,.16);
          --tx: #fff; --tx2: rgba(255,255,255,.72); --tx3: rgba(255,255,255,.45);
          --p1: #8b5cf6; --p2: #a78bfa; --p3: #c4b5fd; --p4: #4c1d95; --p5: #2e1065;
          --cy: #22d3ee; --gr: #34d399; --gold: #fbbf24; --red: #f87171;
          --a1: #f5c451; --a2: #8b5cf6;
          --ease: cubic-bezier(.22,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
  body[data-ch="2"] { --a1: #fb923c; --a2: #8b5cf6; }
  body[data-ch="3"] { --a1: #2dd4bf; --a2: #6366f1; }
  body[data-ch="4"] { --a1: #7dd3fc; --a2: #818cf8; }
  body[data-ch="5"] { --a1: #60a5fa; --a2: #a855f7; }
  body[data-ch="6"] { --a1: #f97316; --a2: #e11d48; }
  body[data-ch="7"] { --a1: #c084fc; --a2: #22d3ee; }
  html { background: var(--bg); overflow-x: hidden; }
  body { min-height: 100vh; background: var(--bg); color: var(--tx);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
         -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; padding-bottom: 86px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

  /* ── фон: свет главы плывёт, сетка, звёзды на орбите ── */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg .gl { position: absolute; border-radius: 50%; will-change: transform; transition: opacity 1.2s var(--ease); }
  .bg .g1 { width: 560px; height: 560px; top: -300px; right: -240px; opacity: .55;
            background: radial-gradient(closest-side, var(--a2), transparent); animation: dr1 16s ease-in-out infinite alternate; }
  .bg .g2 { width: 480px; height: 480px; bottom: -280px; left: -240px; opacity: .32;
            background: radial-gradient(closest-side, var(--a1), transparent); animation: dr2 19s ease-in-out infinite alternate; }
  @keyframes dr1 { to { transform: translate3d(-60px, 70px, 0) scale(1.12); } }
  @keyframes dr2 { to { transform: translate3d(70px, -60px, 0) scale(1.1); } }
  .bg .grid { position: absolute; inset: 0; opacity: .7;
              background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
              background-size: 28px 28px;
              -webkit-mask-image: radial-gradient(ellipse 90% 40% at 50% 0%, #000 15%, transparent 70%);
              mask-image: radial-gradient(ellipse 90% 40% at 50% 0%, #000 15%, transparent 70%); }
  .bg .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; }
  body[data-ch="7"] .bg .stars { opacity: 1; }
  .bg .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .2; } }
  html.paused *, html.paused *::before, html.paused *::after { animation-play-state: paused !important; }
  html.calm *, html.calm *::before, html.calm *::after { animation: none !important; transition: none !important; }

  main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 12px 14px 0; }

  /* ── шапка ── */
  .top { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
  .loc { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .loc .le { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; flex: 0 0 auto;
             background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); border: 1px solid var(--ln2); }
  .loc b { display: block; font-size: 16.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc small { display: block; font-size: 12px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wal { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 7px 11px 7px 7px; border-radius: 999px;
         background: rgba(139,92,246,.14); border: 1px solid rgba(167,139,250,.34); font-size: 13.5px; }
  .wal svg { flex: 0 0 auto; }
  .wal b { font-weight: 800; }
  .ev { margin: 0 0 10px; padding: 9px 12px; border-radius: 13px; font-size: 13.5px; text-align: center; font-weight: 600;
        background: linear-gradient(90deg, rgba(251,191,36,.18), rgba(139,92,246,.2)); border: 1px solid rgba(251,191,36,.38); }
  .pause { margin: 0 0 10px; padding: 11px 12px; border-radius: 13px; font-size: 13.5px; text-align: center;
           background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); }

  /* ── хранилище ── */
  .card { position: relative; border-radius: 20px; background: var(--card); border: 1px solid var(--ln); padding: 14px; margin-bottom: 12px; }
  .hero { overflow: hidden; background: linear-gradient(160deg, rgba(139,92,246,.16), rgba(255,255,255,.025) 55%); border-color: rgba(167,139,250,.26); }
  .hero .hl { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--tx3); }
  .hero .hl b { color: var(--tx2); font-weight: 600; }
  .hero .big { margin-top: 6px; font-size: 31px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
  .hero .big small { font-size: 15px; font-weight: 700; color: var(--p3); margin-left: 4px; }
  .hero .eq { font-size: 13px; color: var(--tx3); margin-top: 2px; }
  .tank { position: relative; height: 12px; margin: 12px 0 8px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .tank i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); border-radius: 99px;
            background: linear-gradient(90deg, var(--p4), var(--p1) 55%, var(--cy)); transition: transform .5s var(--ease); }
  .tank.full i { background: linear-gradient(90deg, #b45309, var(--gold)); }
  .tank em { position: absolute; top: 0; bottom: 0; width: 40%; left: 0; transform: translateX(-120%);
             background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: sh 2.6s linear infinite; }
  @keyframes sh { to { transform: translateX(320%); } }
  .rate { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--tx2); }
  .rate .fl { color: var(--tx3); text-align: right; }
  .rate .fl.full { color: var(--gold); font-weight: 600; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 15px;
         font-weight: 750; font-size: 16px; letter-spacing: .01em; transition: transform .15s var(--ease), opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn.pri { background: linear-gradient(135deg, #9f7aea, #6d28d9); box-shadow: 0 8px 24px -10px rgba(139,92,246,.9); }
  .btn.gold { background: linear-gradient(135deg, #fcd34d, #f59e0b); color: #1c1203; box-shadow: 0 8px 24px -10px rgba(251,191,36,.9); }
  .btn.sec { background: var(--card2); border: 1px solid var(--ln2); }
  .btn.sm { height: 40px; font-size: 14px; border-radius: 12px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .hero .btn { margin-top: 12px; }
  .pulse { animation: pu 1.6s ease-in-out infinite; }
  @keyframes pu { 50% { transform: scale(1.025); } }

  /* ── комната с устройствами ── */
  .room { padding: 12px; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012)); overflow: hidden; }
  .room::before { content: ''; position: absolute; left: 50%; top: -60px; width: 240px; height: 140px; margin-left: -120px; pointer-events: none;
                  background: radial-gradient(closest-side, var(--a1), transparent); opacity: .22; animation: bulb 5s ease-in-out infinite; }
  @keyframes bulb { 50% { opacity: .1; } 53% { opacity: .26; } 56% { opacity: .14; } }
  .rh { position: relative; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 13px; color: var(--tx3); }
  .rh b { color: var(--tx); font-size: 15px; }
  .rh .hs { color: var(--cy); font-weight: 700; font-size: 14px; }
  .slots { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px; }
  .sl { position: relative; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; font-size: 25px;
        background: rgba(255,255,255,.05); border: 1px solid var(--ln); }
  .sl.em { border-style: dashed; color: var(--tx3); font-size: 18px; background: transparent; }
  .sl .gw { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(closest-side, var(--rc, var(--p1)), transparent);
            opacity: .38; animation: hum 2.4s ease-in-out infinite; }
  .sl .ic { position: relative; line-height: 1; }
  .sl .led { position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--gr);
             box-shadow: 0 0 6px var(--gr); animation: led 1.3s steps(2, jump-none) infinite; }
  .sl.off .led { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }
  .sl.off .gw { opacity: .08; animation: none; }
  @keyframes hum { 50% { opacity: .62; transform: scale(1.12); } }
  @keyframes led { 50% { opacity: .25; } }
  .sl.new { animation: pop .6s var(--spring); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .sl:active { transform: scale(.94); }

  /* ── ручной майнинг ── */
  .tapw { display: flex; align-items: center; gap: 14px; }
  .core { position: relative; flex: 0 0 auto; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center;
          background: radial-gradient(circle at 35% 30%, #2a1650, #0d0817 70%); border: 1px solid rgba(167,139,250,.45);
          box-shadow: 0 0 0 6px rgba(139,92,246,.08), 0 10px 30px -12px rgba(139,92,246,.9); transition: transform .12s var(--ease); touch-action: manipulation; }
  .core:active { transform: scale(.93); }
  .core .ring { position: absolute; inset: -7px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--p2); border-right-color: rgba(167,139,250,.25);
                animation: spin 3.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core.dry { filter: grayscale(.6); opacity: .6; }
  .tapi { flex: 1; min-width: 0; }
  .tapi b { display: block; font-size: 15px; }
  .tapi small { display: block; color: var(--tx3); font-size: 12.5px; margin-top: 2px; }
  .enb { position: relative; height: 9px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; margin: 9px 0 5px; }
  .enb i { position: absolute; inset: 0; transform-origin: 0 50%; border-radius: 99px; background: linear-gradient(90deg, #ca8a04, var(--gold)); transition: transform .3s var(--ease); }
  .enl { display: flex; justify-content: space-between; font-size: 12px; color: var(--tx3); }

  /* ── цели (коротко) и сеть ── */
  .gm { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .gm .ge { font-size: 26px; }
  .gm .gt { flex: 1; min-width: 0; }
  .gm .gt b { display: block; font-size: 14.5px; }
  .gm .gt small { display: block; color: var(--tx3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm .ga { color: var(--p3); font-size: 20px; }
  .netc { font-size: 12.5px; color: var(--tx3); line-height: 1.55; }
  .netc b { color: var(--tx2); font-weight: 600; }

  /* ── магазин ── */
  .sh { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tx3); margin: 16px 2px 8px; }
  .it { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 17px; background: var(--card); border: 1px solid var(--ln); margin-bottom: 8px; }
  .it .ie { width: 50px; height: 50px; flex: 0 0 auto; border-radius: 14px; display: grid; place-items: center; font-size: 27px;
            background: radial-gradient(circle at 50% 40%, var(--rc, rgba(139,92,246,.4)), rgba(255,255,255,.03) 72%); border: 1px solid var(--ln2); }
  .it .im { flex: 1; min-width: 0; }
  .it .im b { display: block; font-size: 15px; }
  .it .im small { display: block; font-size: 12.3px; color: var(--tx3); line-height: 1.35; }
  .it .im .hs { color: var(--cy); font-weight: 650; }
  .it .ib { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .it .ib .pr { font-size: 13px; font-weight: 750; white-space: nowrap; }
  .it .ib .pr small { display: block; text-align: right; font-weight: 500; font-size: 11.5px; color: var(--tx3); }
  .bb { height: 34px; padding: 0 14px; border-radius: 11px; font-weight: 700; font-size: 13.5px; background: linear-gradient(135deg, #9f7aea, #6d28d9); white-space: nowrap; }
  .bb.ghost { background: var(--card2); border: 1px solid var(--ln2); color: var(--tx2); }
  .bb:active { transform: scale(.95); }
  .it.lock { opacity: .55; }
  .it.lock .ie { filter: grayscale(1); }
  .own { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: rgba(139,92,246,.22); color: var(--p3); vertical-align: 1px; }

  /* ── сюжет ── */
  .chap { overflow: hidden; padding: 0; }
  .chap .cv { position: relative; height: 128px; display: grid; place-items: center; font-size: 58px;
              background: radial-gradient(ellipse at 50% 120%, var(--a1), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.25)); }
  .chap .cv .cn { position: absolute; left: 14px; bottom: 10px; font-size: 12px; color: var(--tx2); letter-spacing: .08em; text-transform: uppercase; }
  .chap .cb { padding: 14px; }
  .chap h2 { font-size: 21px; letter-spacing: -.01em; }
  .chap .tl { margin-top: 3px; font-size: 13px; color: var(--tx3); }
  .goal { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-top: 1px solid var(--ln); }
  .goal:first-of-type { border-top: 0; }
  .goal .gk { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 14px;
              border: 1.5px solid var(--ln2); color: transparent; }
  .goal.ok .gk { background: var(--gr); border-color: var(--gr); color: #062e1f; font-weight: 900; }
  .goal .gx { flex: 1; min-width: 0; }
  .goal .gx b { display: block; font-size: 14px; font-weight: 600; }
  .goal .gb { height: 5px; margin-top: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .goal .gb i { display: block; height: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, var(--p1), var(--cy)); border-radius: 99px; }
  .goal.ok .gb i { background: var(--gr); }
  .goal .gn { font-size: 12px; color: var(--tx3); white-space: nowrap; }
  .rw { margin-top: 10px; padding: 10px 12px; border-radius: 13px; font-size: 13.5px; background: rgba(251,191,36,.09); border: 1px solid rgba(251,191,36,.28); }
  .past { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  .past::-webkit-scrollbar { display: none; }
  .pc { flex: 0 0 auto; width: 92px; padding: 10px 8px; border-radius: 15px; text-align: center; background: var(--card); border: 1px solid var(--ln); font-size: 12px; color: var(--tx2); }
  .pc .pe { font-size: 26px; display: block; margin-bottom: 3px; }
  .pc.cur { border-color: rgba(167,139,250,.55); background: rgba(139,92,246,.12); }
  .pc.lk { opacity: .4; }

  /* ── кошелёк ── */
  .wb { text-align: center; padding: 18px 14px; background: linear-gradient(160deg, rgba(139,92,246,.2), rgba(255,255,255,.02) 60%); border-color: rgba(167,139,250,.3); }
  .wb .wv { font-size: 34px; font-weight: 850; letter-spacing: -.02em; margin-top: 8px; }
  .wb .wv small { font-size: 16px; color: var(--p3); margin-left: 4px; }
  .wb .wt { color: var(--tx3); font-size: 13.5px; margin-top: 2px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0; }
  .chip { height: 34px; padding: 0 13px; border-radius: 11px; font-size: 13.5px; font-weight: 650; background: var(--card2); border: 1px solid var(--ln2); }
  .chip.on { background: rgba(139,92,246,.3); border-color: rgba(167,139,250,.6); }
  .inp { width: 100%; height: 46px; padding: 0 14px; border-radius: 13px; background: rgba(255,255,255,.06); border: 1px solid var(--ln2); outline: none; font-size: 16px; }
  .inp:focus { border-color: rgba(167,139,250,.7); }
  .note { font-size: 12.5px; color: var(--tx3); line-height: 1.45; margin-top: 8px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kv div { padding: 10px 11px; border-radius: 13px; background: rgba(255,255,255,.035); border: 1px solid var(--ln); }
  .kv i { display: block; font-style: normal; font-size: 11.5px; color: var(--tx3); }
  .kv b { display: block; font-size: 14.5px; margin-top: 2px; word-break: break-word; }
  .tg { display: flex; align-items: center; gap: 12px; }
  .tg .tx { flex: 1; font-size: 14px; }
  .tg .tx small { display: block; font-size: 12px; color: var(--tx3); }
  .sw { position: relative; width: 50px; height: 30px; flex: 0 0 auto; border-radius: 99px; background: rgba(255,255,255,.14); transition: background .25s; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .25s var(--spring); }
  .sw.on { background: var(--p1); }
  .sw.on i { transform: translateX(20px); }

  /* ── топ ── */
  .tr { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 15px; margin-bottom: 7px; background: var(--card); border: 1px solid var(--ln); }
  .tr .tp { width: 28px; text-align: center; font-weight: 800; color: var(--tx3); flex: 0 0 auto; }
  .tr .tn { flex: 1; min-width: 0; }
  .tr .tn b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr .tn small { display: block; font-size: 12px; color: var(--tx3); }
  .tr .th { color: var(--cy); font-weight: 750; font-size: 13.5px; white-space: nowrap; }
  .tr.me { border-color: rgba(167,139,250,.6); background: rgba(139,92,246,.14); }
  .tr.g1 .tp { color: var(--gold); } .tr.g2 .tp { color: #e5e7eb; } .tr.g3 .tp { color: #fb923c; }

  /* ── нижнее меню ── */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
         padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(7,6,12,0), rgba(7,6,12,.94) 32%); }
  .nav .in { display: flex; gap: 4px; width: 100%; max-width: 520px; padding: 5px; border-radius: 20px; background: rgba(22,18,34,.88);
             border: 1px solid var(--ln2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .nav button { position: relative; flex: 1; height: 50px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
                font-size: 10.5px; color: var(--tx3); gap: 1px; transition: color .2s; }
  .nav button .ni { font-size: 19px; line-height: 1.1; transition: transform .3s var(--spring); }
  .nav button.on { color: #fff; background: rgba(139,92,246,.24); }
  .nav button.on .ni { transform: translateY(-1px) scale(1.08); }
  .nav button .dot { position: absolute; top: 6px; right: calc(50% - 17px); width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

  /* ── выдвижная карточка ── */

          return new Promise(function (ok) { setTimeout(ok, w); }).then(function () { return post(op, body, tries + 1); });
        }

      }
      var ch = d.ch;
      storyShow(lines, { ch: ch, done: function () { seen(ch); } });
    }
  }

  // ── загрузка, опрос, кэш ──
  var CK = 'mine_v1_' + UID;
  function cachePut() { try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), d: S.d, cfg: S.cfg, ex: S.ex })); } catch (e) {} }
  function cacheGet() {
    try { var o = JSON.parse(localStorage.getItem(CK) || 'null'); if (!o || !o.d || !o.cfg || Date.now() - o.t > 7 * 86400000) return null; return o; } catch (e) { return null; }
  }
  function fail(kind) {
    S.failKind = kind;
    var m = kind === 'params' ? T.errParams : kind === 'auth' ? T.errAuth : kind === 'reg' ? T.errReg : T.errNet;
    $('err-ic').textContent = kind === 'reg' ? '📝' : kind === 'auth' || kind === 'params' ? '🔑' : '📡';
    $('err-h').textContent = m[0]; $('err-p').textContent = m[1]; $('err-retry').textContent = T.retry;
    $('err-retry').hidden = kind === 'params';
    $('err').hidden = false;
  }
  function staleOn() { if (!S.stale) { S.stale = true; $('stale').textContent = T.stale; $('stale').hidden = false; } }
  var POLL = 25000, pollT = 0;
  function schedule() { clearTimeout(pollT); if (!document.hidden && S.loaded) pollT = setTimeout(function () { load(true); }, POLL); }
  function load(silent) {
    if (S.busy) return;
    if (!canLoad()) { if (!S.loaded) fail('params'); return; }
    S.busy = true;
    var again = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var tm = setTimeout(function () { if (ctrl) ctrl.abort(); }, S.loaded ? 10000 : [9000, 9000, 12000, 15000][Math.min(S.tries, 3)]);
    var url = API + '/casino/mine/state?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET) + (S.cfg && !S.needCfg ? '' : '&full=1')
      + (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');
    fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (res) {
        if (res.status === 401) {
          if (!useInit && INIT) { useInit = true; again = true; return; }
          if (S.loaded) staleOn(); else fail('auth');
          return;
        }
        if (res.status === 403 && res.j && res.j.error === 'unregistered') { fail('reg'); return; }
        if (res.status !== 200 || !res.j || !res.j.ok) throw new Error('HTTP ' + res.status);
        S.tries = 0; S.needCfg = false;
        apply(res.j, !silent);
      })
      .catch(function () {
        if (S.loaded) { staleOn(); return; }
        S.tries++;
        if (S.tries < 4) setTimeout(function () { load(false); }, [1200, 2500, 4500][S.tries - 1]);
        else fail('net');
      })
      .then(function () { clearTimeout(tm); S.busy = false; if (again) load(silent); else schedule(); });
  }
  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('paused', document.hidden);
    if (document.hidden) { clearTimeout(pollT); if (S.pend) flush(); }
    else if (S.loaded && !S.busy) load(true);
  });
  setInterval(function () { if (!document.hidden && S.loaded) tick(); }, 150);
  setInterval(function () { if (!document.hidden && S.loaded) renderEv(); }, 30000);
  setInterval(function () { if (!S.loaded && !S.busy && S.failKind === 'net') { S.tries = 0; load(false); } }, 15000);
  $('err-retry').addEventListener('click', function () { $('err').hidden = true; S.tries = 0; S.failKind = ''; load(false); });

  // звёзды для орбиты
  (function () {
    var h = '';
    for (var i = 0; i < 40; i++) h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 100).toFixed(1) + '%;animation-delay:-' + (Math.random() * 3).toFixed(1) + 's;opacity:' + (0.3 + Math.random() * 0.7).toFixed(2) + '"></i>';
    $('stars').innerHTML = h;
  })();

  // старт: сначала — последние данные из памяти телефона (мгновенно), потом — свежие с сервера
  var c0 = cacheGet();
  if (c0 && c0.d && c0.d.started) {
    S.cfg = c0.cfg; S.ex = c0.ex || ''; S.d = c0.d; S.at = performance.now(); S.d.stored = c0.d.stored; S.loaded = true; S.needCfg = true;
    document.body.setAttribute('data-state', 'ready');
    render();
  }
  load(false);
})();
</script>
</body>
</html>
