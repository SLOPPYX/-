  // ── числа: как в боте (_tok_short): 987 654 · 1,2 млн · 3,4 млрд · 5,2 квдрлн ──
  function num(n) {

  function short(n) { var p = parts(n); return p.u ? p.n + ' ' + p.u : p.n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });

  // ── «бегущие» числа: от старого значения к новому ──

    if (!delta) return;
    var p = document.createElement('i');
    p.className = 'plus' + (delta < 0 ? ' neg' : '');
    p.textContent = (delta > 0 ? '+' : '−') + short(Math.abs(delta));
    el.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 1600);
  }
  function updRow(el, r, o) {
    el.classList.toggle('me', isMe(r));
    var pl = el.querySelector('.pl');
    if (o && o.p !== r.p) {
      pl.innerHTML = '<b>' + r.p + '</b><i class="mv ' + (r.p < o.p ? 'up' : 'dn') + '">' + (r.p < o.p ? '▲' : '▼') + Math.abs(o.p - r.p) + '</i>';
    } else if (!o) pl.innerHTML = '<b>' + r.p + '</b>';
    if (!o || o.n !== r.n || o.adm !== r.adm) el.querySelector('.nm').innerHTML = nmHtml(r);      // трогаем только то, что поменялось
    if (!o || o.d !== r.d || o.id !== r.id) el.querySelector('.sb').innerHTML = subHtml(r);
    if (!o || o.v !== r.v || o.id !== r.id) el.querySelector('.ex').innerHTML = exHtml(r);
    if (avUrl(r) !== el._av) { var av = el.querySelector('.av'); av.innerHTML = avInner(r); el._av = avUrl(r); }
    var ol = el.querySelector('.ol');
    if (ol) ol.hidden = !r.on;
    var nv = Number(r.v);
    if (o && o.v !== r.v) { countTo(el.querySelector('.vl'), el._v, nv, 900, paintShort); hit(el, nv - el._v); }
    el._v = nv; el._r = r;
  }
  function updateList(orows, nrows) {
    var box = $('list'), first = {}, k, om = {}, next = {}, order = [];
    for (k in rowEls) first[k] = rowEls[k].getBoundingClientRect().top;
    orows.forEach(function (r) { om[r.k] = r; });
    nrows.forEach(function (r) {
      var el = rowEls[r.k];
      if (el) updRow(el, r, om[r.k]);
      else { el = mkRow(r); el.classList.add('rin'); }
      next[r.k] = el; order.push(el);
    });
    for (k in rowEls) {
      rowEls[k].classList.remove('rin');                          // появление давно закончилось; иначе при переезде проиграется снова
      if (!next[k] && rowEls[k].parentNode) rowEls[k].parentNode.removeChild(rowEls[k]);
    }
    Array.prototype.slice.call(box.querySelectorAll('.row.free, .row.skr')).forEach(function (x) { x.parentNode.removeChild(x); });
    var ref = box.firstChild;                                      // двигаем только те строки, что сменили место
    order.forEach(function (el) { if (el === ref) { ref = el.nextSibling; return; } box.insertBefore(el, ref); });
    addFree(box, 3 + nrows.length, false);
    rowEls = next;
    order.forEach(function (el) {                                 // FLIP: строки плавно переезжают на новые места
      var key = el.getAttribute('data-k');
      if (first[key] == null || !el.animate) return;
      var dy = first[key] - el.getBoundingClientRect().top;
      if (Math.abs(dy) > 1) el.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.22,.8,.2,1)' });
    });
  }

  // ── таблица целиком (открытие, вкладка) и живое обновление ──
  function foot() {
    var d = S.tabs && S.tabs[TAB], adm = !!(d && (d.rows || []).some(function (r) { return r.adm; }));
    $('foot').textContent = T.foot + (adm ? ' · ' + T.adm : '');
  }
  function renderTab(anim) {
    var d = S.tabs && S.tabs[TAB];
    if (!d) return;
    setTitle(anim);
    if (anim) { countTo($('st-n'), 0, d.total, 900, paintInt); countTo($('st-sum'), 0, Number(d.sum), 1100, paintShort); }
    else { paintInt($('st-n'), d.total); paintShort($('st-sum'), Number(d.sum)); }
    var rows = d.rows || [];
    renderPodium(rows.slice(0, 3), anim);
    renderList(rows.slice(3), anim);
    foot();
  }
  function applyLive(nt) {
    var ot = S.tabs, o = ot && ot[TAB], n = nt[TAB];
    S.tabs = nt;
    if (!o || !n) { renderTab(false); return; }
    var orows = o.rows || [], nrows = n.rows || [];
    var key = function (r) { return r.k; };
    $('pod').classList.remove('rise');
    if (orows.slice(0, 3).map(key).join() !== nrows.slice(0, 3).map(key).join()) {
      var was = {}, pop = {};
      orows.slice(0, 3).forEach(function (r, i) { was[r.k] = i; });
      nrows.slice(0, 3).forEach(function (r, i) { if (was[r.k] !== i) pop[r.k] = 1; });
      renderPodium(nrows.slice(0, 3), false, pop);
      hap('soft');
    } else {
      nrows.slice(0, 3).forEach(function (r, i) {
        var or = orows[i], c = $('pod').querySelector('.pd[data-k="' + r.k + '"]');
        if (!c || !or) return;
        if (or.n !== r.n || or.av !== r.av || or.adm !== r.adm || !or.on !== !r.on) { c.outerHTML = pdHtml(r, i + 1); return; }
        if (or.v !== r.v) { countTo(c, Number(or.v), Number(r.v), 900, paintPd); pulse(c.querySelector('.pv')); }
      });
    }
    updateList(orows.slice(3), nrows.slice(3));
    if (o.total !== n.total) countTo($('st-n'), o.total, n.total, 800, paintInt);
    if (o.sum !== n.sum) countTo($('st-sum'), Number(o.sum), Number(n.sum), 900, paintShort);
    foot();
  }

  // ── бегущая строка ──
  function multTxt(m) { var s = String(Math.round(m * 100) / 100); return EN ? s : s.replace('.', ','); }
  function setFeed(f) {
    var sig = JSON.stringify(f || []);
    if (sig === S.feedSig) return;
    S.feedSig = sig; S.feed = f || [];
    renderFeed();
  }
  function renderFeed() {
    var f = S.feed || [], box = $('tick'), run = $('tk-run');
    if (!f.length) { box.hidden = true; run.innerHTML = ''; return; }
    var one = f.map(function (x) {
      var g = T.games[x.g] || '';
      var what = x.p ? ((x.m > 0 ? '×' + esc(multTxt(x.m)) + ' ' : '') + esc(g) + ' <em>+' + esc(short(x.p)) + '</em>')
        : (esc(g) + ': <em>' + esc(x.l || '🎁') + '</em>');
      return '<span class="ti"><b>' + esc(x.n) + '</b> ' + what + '</span><i class="sep">◆</i>';
    }).join('');
    box.hidden = false;
    run.innerHTML = '<div class="tp">' + one + '</div>';
    var w = run.firstChild.offsetWidth || 1, win = box.querySelector('.tw').offsetWidth || 320;
    var k = Math.min(8, Math.max(1, Math.ceil(win / w))), part = new Array(k + 1).join(one);
    run.innerHTML = '<div class="tp">' + part + '</div><div class="tp">' + part + '</div>';
    run.style.setProperty('--dur', Math.max(16, Math.round(w * k / 38)) + 's');     // ~38 точек в секунду — успеваешь прочитать
    run.style.animation = 'none'; void run.offsetWidth; run.style.animation = '';
  }

  // ── «ты» внизу, онлайн, события ──
  function renderMe() {
    var bar = $('mebar');
    if (!S.me || !S.tabs) { bar.hidden = true; return; }
    var m = S.me[TAB] || { p: 0 }, d = S.tabs[TAB] || {}, h;
    if (m.p) {
      h = '<div class="mp">#' + m.p + '</div><div class="mm"><b>' + esc(T.youAre(m.p, d.total || m.p)) + '</b><span>'
        + esc(m.p > 1 ? T.toPlace(m.p - 1, short(m.gap)) : T.first) + '</span></div><div class="mvv">' + esc(short(m.v)) + '</div>';
    } else {
      h = '<div class="mp off">—</div><div class="mm"><b>' + esc(T.notIn) + '</b><span>' + esc(TAB === 'bal' ? T.hintBal : T.hintCas) + '</span></div>';
    }
    $('me-in').innerHTML = h;
    bar.hidden = false;
  }
  function renderOnline() { $('onl').textContent = S.online ? '· ' + num(S.online) + ' ' + T.online : ''; }
  var toastT = 0;
  function toast(t) {
    var el = $('toast');
    el.textContent = t; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2800);
  }
  function meEvents(prev) {
    if (!prev || !S.me) return;
    var a = (prev[TAB] || {}).p || 0, b = (S.me[TAB] || {}).p || 0;
    if (a && b && b < a) { toast(T.up(b)); hap('success'); }
    else if (a && b && b > a) { toast(T.down(b)); hap('warning'); }
    else if (!a && b) { toast(T.enter(b)); hap('success'); }
  }
  function stale(on) { $('live').classList.toggle('off', !!on); }
  function fail(kind) {
    var t = kind === 'auth' ? T.errAuth : kind === 'params' ? T.errParams : T.errNet;
    S.failKind = kind;
    $('err-h').textContent = t[0]; $('err-p').textContent = t[1];
    $('err-retry').hidden = kind === 'params';
    $('err').hidden = false;
    document.body.setAttribute('data-state', 'error');
  }

  // ── вкладки и жест ──
  function markTabs() {
    $('tabs').setAttribute('data-on', TAB);
    Array.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) {
      var on = b.getAttribute('data-tab') === TAB;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  function setTab(t) {
    if (t !== 'bal' && t !== 'cas') return;
    if (t === TAB) return;
    TAB = t; markTabs(); hap('sel');
    if (S.tabs) { renderTab(true); renderMe(); }
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) setTab(b.getAttribute('data-tab')); });
  var sx = 0, sy = 0, st0 = 0;
  document.addEventListener('touchstart', function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st0 = Date.now(); }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st0 < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 45) setTab(dx < 0 ? 'cas' : 'bal');
  }, { passive: true });
  $('list').addEventListener('click', function (e) {
    var r = e.target.closest('.row');
    if (!r || r.classList.contains('free') || r.classList.contains('skr')) return;
    r.classList.toggle('open'); hap('sel');
  });
  $('mebar').addEventListener('click', function () {
    var el = document.querySelector('.row.me') || document.querySelector('.pd.me');
    if (!el) return;
    hap('soft');
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { el.scrollIntoView(); }
    if (el.animate) el.animate([{ boxShadow: '0 0 0 0 rgba(255,42,61,.9)' }, { boxShadow: '0 0 0 14px rgba(255,42,61,0)' }], { duration: 900, delay: 300, easing: 'ease-out' });
  });

  // ── загрузка и опрос раз в 4 с ──
  var CK = 'top_live_1_' + UID;
  function cachePut() {
    try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), tabs: S.tabs, feed: S.feed, me: S.me, online: S.online, sig: S.sig })); } catch (e) {}
  }
  function cacheGet() {
    try {
      var o = JSON.parse(localStorage.getItem(CK) || 'null');
      if (!o || !o.tabs || !o.t || Date.now() - o.t > 3 * 86400000) return null;
      return o;
    } catch (e) { return null; }
  }
  function canLoad() { return !!UID && /^https?:\/\//i.test(API) && !!(SECRET || INIT); }
  var POLL = 4000, pollT = 0;
  function schedule() { clearTimeout(pollT); if (!document.hidden && S.loaded) pollT = setTimeout(function () { load(true); }, POLL); }
  function onData(j) {
    S.tries = 0; S.failKind = ''; stale(false);
    var prev = S.me, first = !S.loaded;
    S.online = j.online || 0;
    if (j.me) S.me = j.me;
    if (j.tabs) {
      S.sig = j.sig || '';
      if (first || S.cacheOld) {
        S.tabs = j.tabs; S.cacheOld = false; S.loaded = true;
        document.body.setAttribute('data-state', 'ready'); $('err').hidden = true;
        renderTab(first);
      } else applyLive(j.tabs);
      setFeed(j.feed || []);
      cachePut();
    }
    renderOnline(); renderMe();
    if (!first) meEvents(prev);
    var lv = $('live');
    if (lv.animate) lv.animate([{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
  }
  function load(silent) {
    if (S.busy) return;
    if (!canLoad()) { if (!S.loaded) fail('params'); return; }
    S.busy = true;
    var again = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var limit = S.loaded ? 10000 : [9000, 9000, 12000, 15000][Math.min(S.tries, 3)];
    var tm = setTimeout(function () { if (ctrl) ctrl.abort(); }, limit);
    var url = API + '/casino/top/live?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET)
      + (S.tabs && S.sig ? '&sig=' + encodeURIComponent(S.sig) : '') + (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');
    fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.status === 401) {
          if (!useInit && INIT) { useInit = true; again = true; return; }   // ключ в ссылке устарел — пробуем подписью Telegram
          if (S.loaded) stale(true); else fail('auth');
          return;
        }
        if (!res.ok || !res.j || res.j.ok !== true) throw new Error('HTTP ' + res.status);
        onData(res.j);
      })
      .catch(function () {
        if (S.loaded) { stale(true); return; }
        S.tries++;
        if (S.tries < 4) setTimeout(function () { load(false); }, [1200, 2500, 4500][S.tries - 1]);
        else fail('net');
      })
      .then(function () { clearTimeout(tm); S.busy = false; if (again) load(silent); else schedule(); });
  }
  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('paused', document.hidden);     // свернул — эффекты стоят, опрос тоже
    if (document.hidden) clearTimeout(pollT);
    else if (S.loaded && !S.busy) load(true);
  });
  setInterval(function () { if (!S.loaded && !S.busy && S.failKind === 'net') { S.tries = 0; load(false); } }, 15000);   // связь вернулась — оживём сами
  $('err-retry').addEventListener('click', function () {
    $('err').hidden = true; S.tries = 0; S.failKind = ''; document.body.setAttribute('data-state', 'loading'); load(false);
  });

  // ── искры фона ──
  (function () {
    var box = $('embers'), h = '';
    for (var i = 0; i < 16; i++) {
      var s = (2 + Math.random() * 2.6).toFixed(1), d = 7 + Math.random() * 8;
      h += '<i class="em" style="left:' + (Math.random() * 100).toFixed(1) + '%;width:' + s + 'px;height:' + s + 'px;animation-duration:' + d.toFixed(1)
        + 's;animation-delay:-' + (Math.random() * d).toFixed(1) + 's;--dx:' + Math.round(Math.random() * 80 - 40) + 'px"></i>';
    }
    box.innerHTML = h;
  })();

  // ── тексты на языке игрока ──
  if (EN) { document.documentElement.lang = 'en'; document.title = 'Top · LIVE'; }
  $('kick').textContent = T.kick;
  $('st-l1').textContent = T.stN;
  $('tick-l').textContent = T.tick;
  $('err-retry').textContent = T.retry;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs [data-tab]'), function (b) {
    b.textContent = (b.getAttribute('data-tab') === 'bal' ? '💰 ' + T.bal : '🎰 ' + T.cas);
  });
  markTabs();
  if (TAB === 'cas') setTitle(false);

  // есть сохранённый ответ — показываем сразу, свежий подтянется следом (и места «переедут», если что-то поменялось)
  (function () {
    if (!canLoad()) return;
    var c = cacheGet();
    if (!c) return;
    S.tabs = c.tabs; S.me = c.me || null; S.online = c.online || 0; S.sig = c.sig || '';
    S.cacheOld = Date.now() - c.t > 60000;
    S.loaded = true;
    document.body.setAttribute('data-state', 'ready');
    renderTab(true);
    setFeed(c.feed || []);
    renderOnline(); renderMe(); stale(true);
  })();
  window.__top = { S: S, setTab: setTab, load: load, short: short, parts: parts };
  load(false);
})();
</script>
