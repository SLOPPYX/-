<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ранги 1vs1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #000;
    --border: rgba(139,92,246,.18);
    --accent: #8b5cf6;
    --accent-light: #c4b5fd;
    --accent-dark: #6d28d9;
    --up: #00e6a0;
    --down: #ff3b5c;
    --text: #f5f1ff;
    --text2: #a79dbd;
    --text3: #6b6280;
    --tier-rgb: 139,92,246;
  }
  html, body { background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ─── Живой фон ─── */
  .aurora { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; will-change: transform; }
  .aurora i:nth-child(1) { width: 460px; height: 340px; top: -150px; left: 50%; margin-left: -230px; background: radial-gradient(ellipse, rgba(139,92,246,.30), transparent 70%); animation: drift1 16s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 380px; height: 380px; bottom: -160px; left: -110px; background: radial-gradient(circle, rgba(109,40,217,.26), transparent 70%); animation: drift2 20s ease-in-out infinite; }
  .aurora i:nth-child(3) { width: 320px; height: 320px; top: 34%; right: -140px; background: radial-gradient(circle, rgba(var(--tier-rgb),.16), transparent 70%); animation: drift3 24s ease-in-out infinite; transition: background 1s; }
  .grain { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 26px 26px;
    -webkit-mask: linear-gradient(180deg, #000, transparent 55%); mask: linear-gradient(180deg, #000, transparent 55%); }

  .app {
    position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(104px + env(safe-area-inset-bottom, 0px));
  }

  /* ─── Шапка ─── */
  /* v296: шапка в стиле SVG — эмблема со скрещёнными мечами, табличка «1VS1» и шестигранный бейдж сезона.
     Цвет подсветки берётся у текущего ранга (--tier-rgb), поэтому у Бронзы шапка тёплая, у Грандмастера — розовая. */
  .hd-brand { display: flex; align-items: center; gap: 12px; }
  .hd-ic { width: 50px; height: 50px; flex-shrink: 0; overflow: visible; -webkit-filter: drop-shadow(0 0 10px rgba(var(--tier-rgb), .6)); filter: drop-shadow(0 0 10px rgba(var(--tier-rgb), .6)); animation: float 4s ease-in-out infinite; }
  .hd-ring { stroke: rgba(var(--tier-rgb), .6); transform-origin: 24px 24px; animation: spin 18s linear infinite; }
  .hd-sw { animation: pulse 3.2s ease-in-out infinite; }
  .hd-tx { min-width: 0; }
  .hd-h1 { display: flex; align-items: center; gap: 9px; line-height: 1; font-weight: 900; }
  .hd-w { font-size: 29px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; line-height: 1.08;
    background: linear-gradient(100deg, #ffffff 0%, #efe7ff 28%, #b79cff 50%, #ffffff 70%, #d7c8ff 100%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    -webkit-filter: drop-shadow(0 0 12px rgba(var(--tier-rgb), .5)); filter: drop-shadow(0 0 12px rgba(var(--tier-rgb), .5)); animation: sheen 6s linear infinite; }
  .hd-v { width: 68px; height: 27px; flex-shrink: 0; overflow: visible; -webkit-filter: drop-shadow(0 0 9px rgba(var(--tier-rgb), .65)); filter: drop-shadow(0 0 9px rgba(var(--tier-rgb), .65)); }
  .hd-sh { animation: hdSweep 4.2s ease-in-out infinite; }
  .hd-line { display: block; width: 230px; max-width: 100%; height: 10px; margin-top: 7px; overflow: visible; }
  .hd-dia { fill: rgb(var(--tier-rgb)); }
  .hd-spark { fill: #fff; -webkit-filter: drop-shadow(0 0 4px rgba(var(--tier-rgb), 1)); filter: drop-shadow(0 0 4px rgba(var(--tier-rgb), 1)); animation: hdSpark 3.6s ease-in-out infinite; }
  .hd-sea-w { display: inline-block; max-width: 100%; vertical-align: top; margin-top: 10px; -webkit-filter: drop-shadow(0 0 9px rgba(var(--tier-rgb), .42)); filter: drop-shadow(0 0 9px rgba(var(--tier-rgb), .42)); }
  .hd-sea { position: relative; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; box-sizing: border-box; min-height: 30px; padding: 6px 20px 6px 15px; font-size: 12.5px; font-weight: 700; color: var(--text2);
    -webkit-clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%);
            clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%);
    background: linear-gradient(100deg, rgba(var(--tier-rgb), .95), #c4b5fd 34%, rgba(var(--tier-rgb), .8) 66%, #c4b5fd) 0 0 / 220% 100%; animation: sheen 7s linear infinite; }
  .hd-sea::before { content: ''; position: absolute; left: 1.5px; right: 1.5px; top: 1.5px; bottom: 1.5px; z-index: 0; background: linear-gradient(180deg, #1a0e33, #0a0616);
    -webkit-clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
  .hd-sea > * { position: relative; z-index: 1; }
  .hd-si { width: 15px; height: 15px; flex-shrink: 0; fill: rgb(var(--tier-rgb)); -webkit-filter: drop-shadow(0 0 5px rgba(var(--tier-rgb), .95)); filter: drop-shadow(0 0 5px rgba(var(--tier-rgb), .95)); animation: pulse 2.2s ease-in-out infinite; }
  .hd-sea #season-text { display: inline-flex; align-items: baseline; gap: 7px; min-width: 0; white-space: nowrap; }
  #season-text b, #season-text em { flex-shrink: 0; }
  .hd-sea .sk { height: 14px; }
  #season-text b { color: #fff; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; }
  #season-text em { font-style: normal; color: var(--text3); }
  #season-text i { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-style: normal; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-light); }

  /* ─── Скелетоны ─── */
  .sk {
    display: inline-block; min-height: 1em; vertical-align: middle; border-radius: 8px;
    color: transparent !important; border-color: transparent !important;
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.13), rgba(255,255,255,.05)) 0 0 / 220% 100% !important;
    animation: skmove 1.4s linear infinite;
  }
  .sub .sk { height: 14px; }

  /* ─── Страницы (вкладки) ─── */
  .page { display: none; }
  .page.on { display: block; animation: pageIn .5s cubic-bezier(.2,.8,.2,1); }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 2px 14px; }
  .page-head h3 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .pill { padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
    color: var(--accent-light); background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.35); }
  .pill.soon { color: #ffd76a; background: rgba(255,201,74,.1); border-color: rgba(255,201,74,.35); }

  /* ─── Эмблемы рангов (SVG) ─── */
  .rk { display: block; flex-shrink: 0; overflow: visible; filter: drop-shadow(0 2px 5px rgba(0,0,0,.55)); }
  .rk.in { display: inline-block; vertical-align: -6px; }

  /* ─── Герой ─── */
  .hero { text-align: center; padding: calc(22px + var(--fire, 0) * 62px) 0 22px; }   /* v295: место под языки пламени */
  .stage { position: relative; width: 150px; height: 150px; margin: 0 auto 26px; perspective: 700px; }
  .emblem { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; transform-style: preserve-3d; transition: transform .25s ease-out; }
  .emblem .halo { position: absolute; top: -30px; right: -30px; bottom: -30px; left: -30px; border-radius: 50%; opacity: .55; background: radial-gradient(circle, rgba(var(--tier-rgb), .6) 0%, transparent 66%); animation: breathe 3.6s ease-in-out infinite; }
  .emblem .disc {
    position: absolute; top: 6px; right: 6px; bottom: 6px; left: 6px; border-radius: 50%;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.16), transparent 46%), linear-gradient(160deg, #1b1032, #07040e);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 0 0 1px rgba(var(--tier-rgb), .3), 0 20px 40px -14px rgba(0,0,0,.9), 0 0 var(--dg, 50px) -6px rgba(var(--tier-rgb), var(--dga, .6));
  }
  .emblem .spin {
    position: absolute; top: -2px; right: -2px; bottom: -2px; left: -2px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 60%, rgb(var(--tier-rgb)) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    animation: spin 5s linear infinite; opacity: .95;
  }
  .emblem .glare { position: absolute; top: 6px; right: 6px; bottom: 6px; left: 6px; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .emblem .glare::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-130%);
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.30) 50%, transparent 62%); animation: glare 5.5s ease-in-out infinite; }
  .medal { position: relative; width: 96px; height: 96px; display: grid; place-items: center; transform: translateZ(40px); animation: float 4s ease-in-out infinite; }
  .medal .rk { filter: drop-shadow(0 10px 18px rgba(0,0,0,.7)) drop-shadow(0 0 16px rgba(var(--tier-rgb), .55)); }
  .medal.ph svg { width: 56px; height: 56px; stroke: var(--text3); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .medal.pop { animation: pop .8s cubic-bezier(.3,1.5,.5,1) both, float 4s ease-in-out .8s infinite; }
  .sparks { position: absolute; left: 50%; bottom: 14px; width: 0; height: 0; pointer-events: none; }
  .sparks i {
    position: absolute; left: var(--x); bottom: 0; width: var(--s); height: var(--s); border-radius: 50%; opacity: 0;
    background: rgb(var(--tier-rgb)); box-shadow: 0 0 8px 1px rgba(var(--tier-rgb), .9);
    animation: spark var(--d) linear var(--dl) infinite;
  }
  .tier { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; min-height: 37px; text-shadow: 0 0 30px rgba(var(--tier-rgb), .6); animation: tglow 2.6s ease-in-out infinite; }
  .tier.sk { height: 34px; }
  .tier.muted { font-size: 18px; color: var(--text3); text-shadow: none; animation: none; }
  .rp { margin-top: 8px; display: flex; align-items: baseline; justify-content: center; gap: 7px; }
  .rp #rp-val { font-size: 46px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .rp #rp-val.empty { color: var(--text3); }
  .rp small { font-size: 15px; font-weight: 800; letter-spacing: .06em; color: var(--accent-light); }

  /* ─── Карточки ─── */
  .card {
    position: relative; margin-bottom: 14px; padding: 18px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, rgba(26,15,48,.72), rgba(9,6,16,.8));
    border: 1px solid var(--border); box-shadow: 0 20px 40px -22px rgba(0,0,0,.8);
  }
  .card::before { content: ''; position: absolute; top: 0; right: 0; bottom: auto; left: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(196,181,253,.55), transparent); }
  .card.glow::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--ang), transparent 0 70%, rgba(var(--tier-rgb), .95) 86%, #fff 92%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: ang 6s linear infinite;
  }

  /* прогресс */
  .pg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  .chip.cur { background: rgba(var(--tier-rgb), .14); border-color: rgba(var(--tier-rgb), .4); }
  .chip.max { background: rgba(139,92,246,.16); border-color: rgba(139,92,246,.45); color: var(--accent-light); }
  .arr { color: var(--text3); font-weight: 800; }
  .bar { position: relative; height: 12px; border-radius: 999px; background: rgba(255,255,255,.07); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
  .bar.loading::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent) 0 0 / 220% 100%; animation: skmove 1.4s linear infinite; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; display: block;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent) 55%, var(--accent-light));
    box-shadow: 0 0 16px rgba(139,92,246,.75); transition: width 1.7s cubic-bezier(.22,.9,.24,1); }
  .bar i::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%) 0 0 / 220% 100%; animation: sheen 2.4s linear infinite; }
  .bar i::after { content: ''; position: absolute; right: 0; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(35%, -50%); background: #fff;
    box-shadow: 0 0 0 4px rgba(139,92,246,.3), 0 0 14px rgba(196,181,253,.9); animation: headpulse 1.8s ease-in-out infinite; }
  .pg-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .pg-foot #pg-pct { color: var(--accent-light); }
  .pg-note { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.06); font-size: 14px; color: var(--text2); line-height: 1.5; min-height: 20px; }
  .pg-note b { color: var(--text); font-weight: 800; }
  .pg-note.sk { display: block; height: 16px; }

  /* статистика */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { position: relative; padding: 14px 10px 13px; border-radius: 18px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, rgba(26,15,48,.6), rgba(9,6,16,.7)); border: 1px solid var(--border); transition: transform .2s, box-shadow .2s; }
  .stat:active { transform: scale(.97); }
  .stat::before { content: ''; position: absolute; left: 24%; right: 24%; top: 0; height: 2px; border-radius: 2px; background: var(--c, var(--accent)); box-shadow: 0 0 12px var(--c, var(--accent)); }
  .stat::after { content: ''; position: absolute; left: 50%; top: -30px; width: 90px; height: 60px; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(ellipse, var(--c, var(--accent)), transparent 70%); opacity: .13; }
  .stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--c, var(--text)); min-height: 30px; line-height: 1.15; }
  .stat b.sk { height: 26px; }
  .stat span { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); }
  .stat.w { --c: var(--up); } .stat.l { --c: var(--down); } .stat.r { --c: var(--accent-light); }
  .stats-note { margin: 10px 4px 24px; font-size: 11.5px; line-height: 1.4; color: var(--text3); text-align: center; }

  /* лестница */
  .sec-title { margin: 0 2px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }
  .ladder { list-style: none; }
  .rung { position: relative; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; padding: 11px 14px 11px 11px; border-radius: 18px; border: 1px solid transparent;
    background: rgba(255,255,255,.025); opacity: 0; transform: translateY(8px);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .rung:last-child { margin-bottom: 0; }
  .rung:not(:last-child)::after { content: ''; position: absolute; left: 32px; top: 100%; width: 2px; height: 10px; background: rgba(255,255,255,.07); }
  .rung.passed::after, .rung.current::after { background: linear-gradient(180deg, var(--accent), rgba(139,92,246,.35)) !important; }
  .rung .badge { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  .rung .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rung .nm { font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
  .rung .th { font-size: 12px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; }
  .rung .st { margin-left: auto; display: flex; align-items: center; flex-shrink: 0; }
  .rung .st svg { width: 18px; height: 18px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .rung.passed { --o: .65; } .rung.passed .st svg { stroke: var(--up); }
  .rung.locked { --o: .55; } .rung.locked .badge .rk { filter: grayscale(1) brightness(.8) drop-shadow(0 2px 5px rgba(0,0,0,.55)); } .rung.locked .st svg { stroke: var(--text3); }
  .rung.current { --o: 1; background: linear-gradient(90deg, rgba(var(--tier-rgb), .18), rgba(139,92,246,.06)); border-color: rgba(var(--tier-rgb), .5); box-shadow: 0 0 34px -10px rgba(var(--tier-rgb), .7); }
  .rung.current .badge { background: rgba(var(--tier-rgb), .18); border-color: rgba(var(--tier-rgb), .5); box-shadow: 0 0 18px -4px rgba(var(--tier-rgb), .8); }
  .here { padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; white-space: nowrap; background: rgb(var(--tier-rgb)); color: #12081f; animation: pulse 2s ease-in-out infinite; }
  .rung.ghost { --o: 1; }
  .rung.ghost .badge.sk { border: 0; }
  .rung.ghost .nm.sk, .rung.ghost .th.sk { display: block; height: 14px; }

  /* ─── Топ ─── */
  .youbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 11px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 700;
    background: linear-gradient(90deg, rgba(139,92,246,.22), rgba(139,92,246,.05)); border: 1px solid rgba(139,92,246,.5); box-shadow: 0 0 30px -12px rgba(139,92,246,.9); }
  .youbar b { color: var(--accent-light); }
  .podium { display: grid; grid-template-columns: 1fr 1.18fr 1fr; gap: 10px; align-items: end; margin: 4px 0 18px; }
  .pod { --c: 196,204,220; --h: 64px; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; opacity: 0; transform: translateY(14px); animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--dl, 0s); }
  .pod.p1 { --c: 255,201,74; --h: 92px; --dl: .05s; } .pod.p2 { --c: 196,204,220; --h: 68px; --dl: .18s; } .pod.p3 { --c: 205,127,79; --h: 54px; --dl: .3s; }
  .pod .crown { width: 26px; height: 20px; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(255,201,74,.8)); animation: float 3.4s ease-in-out infinite; }
  .pod .av { position: relative; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 8px;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.14), transparent 50%), linear-gradient(160deg, #1b1032, #07040e);
    border: 1.5px solid rgba(var(--c), .75); box-shadow: 0 0 26px -4px rgba(var(--c), .7); }
  .pod.p1 .av { width: 78px; height: 78px; }
  .pod .av::after { content: ''; position: absolute; top: -6px; right: -6px; bottom: -6px; left: -6px; border-radius: 50%; border: 1px solid rgba(var(--c), .5); animation: ringpulse 2.6s ease-out infinite; }
  .pod .pn { max-width: 100%; padding: 0 2px; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pp { margin: 2px 0 8px; font-size: 12px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .pod .base { position: relative; width: 100%; height: var(--h); border-radius: 16px 16px 6px 6px; display: grid; place-items: center; overflow: hidden;
    font-size: 26px; font-weight: 900; color: rgba(var(--c), 1);

  .err button { margin-left: auto; flex-shrink: 0; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; color: #170b2e; background: linear-gradient(135deg, var(--accent), var(--accent-light)); box-shadow: 0 0 18px rgba(139,92,246,.35); }
  .err button:active { transform: scale(.96); }

  /* ─── Нижняя панель вкладок ─── */
  .tabbar { position: fixed; z-index: 50; left: 12px; right: 12px; max-width: 456px; margin: 0 auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; padding: 6px; border-radius: 24px; background: rgba(12,7,22,.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid rgba(139,92,246,.28); box-shadow: 0 18px 40px -10px rgba(0,0,0,.9), 0 0 40px -14px rgba(139,92,246,.6), inset 0 1px 0 rgba(255,255,255,.06); }
  .tabpill { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 18px; pointer-events: none;
    background: linear-gradient(180deg, rgba(139,92,246,.34), rgba(139,92,246,.12)); border: 1px solid rgba(196,181,253,.4); box-shadow: 0 0 22px -4px rgba(139,92,246,.9);
    transition: transform .4s cubic-bezier(.3,1.2,.4,1), width .4s cubic-bezier(.3,1.2,.4,1); }

  @keyframes zap { 0%,86%,100% { opacity: 0; } 88% { opacity: 1; } 90% { opacity: .15; } 93% { opacity: .95; } 96% { opacity: 0; } }

  /* ─── v295: пламя вокруг эмблемы — чем выше ранг, тем больше языков, жарче и быстрее огонь ─── */
  .hero { position: relative; }

            clip-path: polygon(50% 0%, 58% 16%, 68% 30%, 82% 46%, 94% 64%, 92% 82%, 78% 96%, 50% 100%, 22% 96%, 8% 82%, 6% 64%, 18% 46%, 32% 30%, 42% 16%); }
  .fl .fb { left: 0; right: 0; top: 0; background: linear-gradient(to top, rgba(var(--tier-rgb), 1) 0%, rgba(var(--tier-rgb), .8) 42%, rgba(var(--tier-rgb), 0) 100%); }
  .fl .fm { left: 16%; right: 16%; top: 24%; background: linear-gradient(to top, rgba(var(--core), .95) 0%, rgba(var(--core), .45) 55%, rgba(var(--core), 0) 100%); }

  .fl.soft .fx { -webkit-filter: blur(var(--bs, 3.4px)); filter: blur(var(--bs, 3.4px)); }
  .fx-ring2 { position: absolute; left: -13px; right: -13px; top: -13px; bottom: -13px; border-radius: 50%; border: 1.5px dashed rgba(var(--tier-rgb), .65); animation: spin 16s linear infinite reverse; }
  .fx-orbit { position: absolute; left: -22px; right: -22px; top: -22px; bottom: -22px; animation: spin var(--os, 7s) linear infinite; }
  .fx-orbit b { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .fx-orbit i { position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px 3px rgba(var(--tier-rgb), .95); }
  .fx-shock { position: absolute; left: 6px; right: 6px; top: 6px; bottom: 6px; border-radius: 50%; border: 2px solid rgba(var(--tier-rgb), .8); opacity: 0; animation: shock 2.9s ease-out var(--dl, 0s) infinite; }
  .fx-zap { position: absolute; left: 50%; top: 50%; width: 16px; height: 44px; margin: -44px 0 0 -8px; transform-origin: 50% 100%; }
  .fx-zap svg { display: block; opacity: 0; -webkit-filter: drop-shadow(0 0 5px rgba(var(--tier-rgb), 1)); filter: drop-shadow(0 0 5px rgba(var(--tier-rgb), 1)); animation: zap 3.4s linear var(--dl, 0s) infinite; }
  .sparks i.w { background: #fff; }

  /* ─── v295: сообщения о связи и старых данных ─── */
  .conn { display: none; margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text3); }
  .conn.on { display: block; }
  .stale { display: none; align-items: center; gap: 8px; margin: 12px 0 0; padding: 9px 12px; border-radius: 14px; font-size: 12px; font-weight: 700;
    color: #ffd76a; background: rgba(255,201,74,.08); border: 1px solid rgba(255,201,74,.28); }
  .stale.on { display: flex; }
  .stale button { margin-left: auto; flex-shrink: 0; padding: 5px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; color: #ffd76a; border: 1px solid rgba(255,201,74,.4); }

  /* v296: полный таймер — дни, часы, минуты и секунды отдельными плитками (раньше «00:48:59» показывал только время внутри
     последних суток, и при 59 днях до конца сезона это выглядело как «осталось 48 минут») */
  .tinfo .dbig { margin: 6px 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
  .tinfo .dbig span { font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--text3); }
  .tinfo .fin { margin-top: 5px; font-size: 12px; font-weight: 600; line-height: 1.35; color: var(--text3); }
  .tmg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .tmc { position: relative; padding: 12px 2px 10px; border-radius: 14px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, rgba(139,92,246,.22), rgba(139,92,246,.05)); border: 1px solid rgba(139,92,246,.34); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  .tmc b { display: block; font-size: 27px; font-weight: 900; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tmc span { display: block; margin-top: 7px; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); }
  .tmc.s { border-color: rgba(196,181,253,.62); background: linear-gradient(180deg, rgba(139,92,246,.4), rgba(139,92,246,.1)); }
  .tmc.s b { color: #efe7ff; text-shadow: 0 0 14px rgba(167,139,250,.95); }
  .tmc.done { opacity: .6; }
  .tinfo .dbig { white-space: nowrap; }
  /* узкие телефоны (≈340–390 px): кольцо и цифры чуть меньше, чтобы «День 24 из 60» не переносилось */
  @media (max-width: 390px) {
    .timer { gap: 12px; }
    .ringbox { width: 106px; height: 106px; }
    .ringbox .mid b { font-size: 30px; }
    .tinfo .dbig { font-size: 20px; }
    .tinfo .dbig span { font-size: 12px; }
    .tmc b { font-size: 23px; }
    .tmc span { font-size: 9px; letter-spacing: .04em; }
    .hd-w { font-size: 26px; }
  }

  /* v296: пламя на подиуме топа — у каждого игрока свой цвет и сила по его рангу */
  .pod .avw { position: relative; margin-bottom: 8px; }
  .pod .av { margin-bottom: 0; }
  .pod .crown { position: relative; z-index: 3; }
  .pod.p1 { z-index: 2; }

  /* v297: «Администратор проекта». Золото + фиолетовый: не спутать с цветами рангов (те идут по ступеням),
     а выглядит как знак должности. Признак приходит от бота (is_admin), ник тут ни при чём — подделать нельзя. */
  .adm-w { display: inline-block; max-width: 100%; vertical-align: top; -webkit-filter: drop-shadow(0 0 7px rgba(255,201,74,.5)); filter: drop-shadow(0 0 7px rgba(255,201,74,.5)); animation: admGlow 2.8s ease-in-out infinite; }
  .adm-pl { position: relative; display: block; box-sizing: border-box; padding: 4px 12px; text-align: center; line-height: 1.08; overflow: hidden;
    font-size: 8.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: #fff1c2;
    -webkit-clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
            clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
    background: linear-gradient(100deg, #ffd76a, #ffffff 26%, #c4b5fd 50%, #ffc94a 74%, #ffd76a) 0 0 / 260% 100%; animation: sheen 5s linear infinite; }
  .adm-pl::before { content: ''; position: absolute; left: 1.5px; right: 1.5px; top: 1.5px; bottom: 1.5px; z-index: 0; background: linear-gradient(180deg, #2b1652, #120a26);
    -webkit-clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%);
            clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0 50%); }
  .adm-pl::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; z-index: 2; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent); transform: translateX(-160%) skewX(-20deg); animation: admSweep 3.8s ease-in-out infinite; }

  .adm-pl.row { padding: 3px 12px 3px 8px; font-size: 9px; }
  .adm-pl.big { padding: 6px 20px 6px 12px; font-size: 11px; letter-spacing: .09em; }
  .adm-pl.row .l1, .adm-pl.big .l1 { display: inline; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .adm-ic { width: 13px; height: 13px; flex-shrink: 0; overflow: visible; -webkit-filter: drop-shadow(0 0 4px rgba(255,201,74,.9)); filter: drop-shadow(0 0 4px rgba(255,201,74,.9)); }
  .adm-pl.big .adm-ic { width: 17px; height: 17px; }
  .pod .adm-w { margin: 2px 0 3px; }
  .adm-hero { display: flex; justify-content: center; margin: 12px 0 2px; }
  /* аватар админа на подиуме: золотая рамка, вращающееся кольцо, значок должности и мерцающие звёздочки */
  .pod.adm .av, .pod.adm.me .av { border-color: rgba(255,201,74,.92); box-shadow: 0 0 28px -3px rgba(255,201,74,.6); }
  .adm-ring { position: absolute; left: -11px; top: -11px; width: calc(100% + 22px); height: calc(100% + 22px); overflow: visible; pointer-events: none; z-index: 1; transform-origin: 50% 50%; animation: spin 16s linear infinite; }
  .adm-ring circle { fill: none; stroke: rgba(255,201,74,.75); stroke-width: 1.4; stroke-dasharray: 2.5 5; }
  .adm-ring path { fill: #ffe9a8; }
  .adm-badge { position: absolute; left: -9px; bottom: -6px; width: 26px; height: 26px; z-index: 3; overflow: visible; -webkit-filter: drop-shadow(0 0 6px rgba(255,201,74,.95)); filter: drop-shadow(0 0 6px rgba(255,201,74,.95)); animation: float 3.2s ease-in-out infinite; }

  .adm-st { position: absolute; z-index: 3; width: 9px; height: 9px; background: #fff1c2; pointer-events: none; animation: admTw 2.4s ease-in-out infinite;
    -webkit-clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .adm-st.s1 { left: -14px; top: 2px; } .adm-st.s2 { right: -14px; top: 22%; width: 7px; height: 7px; animation-delay: -.8s; } .adm-st.s3 { right: -8px; bottom: -8px; width: 6px; height: 6px; animation-delay: -1.6s; }
  .trow.adm, .trow.adm.me { border-color: rgba(255,201,74,.5); background: linear-gradient(90deg, rgba(255,201,74,.13), rgba(139,92,246,.07)); box-shadow: 0 0 26px -12px rgba(255,201,74,.85); }
  .trow.adm .pl { color: #ffc94a; }
  .trow .who .adm-w { margin: 3px 0 1px; }
  @media (max-width: 390px) { .adm-pl { font-size: 7.3px; padding: 4px 7px; letter-spacing: .015em; } .adm-pl .l2 { letter-spacing: .1em; } .adm-pl.row { font-size: 8.5px; letter-spacing: .04em; padding: 3px 11px 3px 8px; } .adm-pl.big { font-size: 10px; letter-spacing: .06em; padding: 6px 18px 6px 11px; } }

  /* v295: раньше здесь стоял @media (prefers-reduced-motion) — если в Windows выключено «Показывать анимацию»
     (на ПК так часто), вся страница становилась статичной и выглядела «без эффектов», а на телефоне всё горело.
     Теперь эффекты одинаковы везде. Спокойный режим — только по явной просьбе: ссылка с ?motion=reduce. */
  html.calm *, html.calm *::before, html.calm *::after { animation: none !important; transition: none !important; }
  html.calm .rung, html.calm .rw, html.calm .trow, html.calm .pod, html.calm .hrow, html.calm .rv-item { opacity: var(--o, 1); transform: none; }
  html.calm .cf, html.calm .fire { display: none; }
  /* @property (анимация угла у рамки карточки) есть не во всех движках — там угол крутит JS */
  html.noprop .card.glow::after { animation: none; }

    var meta = el('div', 'meta'); meta.appendChild(el('div', 'nm', x.name)); meta.appendChild(prizeChips(x.reward));
    main.appendChild(meta); card.appendChild(main);
    var bar = el('div', 'nxt-bar'), fill = el('i'); bar.appendChild(fill); card.appendChild(bar);
    var txt;
    if (x.state === 'pending') txt = claimOn ? 'Награда готова — забери её!' : 'Ранг достигнут — награда придёт после ближайшего матча';
    else if (num(x.matches_needed) > 0) txt = 'Сыграй матч 1vs1 — и награда станет доступна';
    else txt = 'Ещё ' + fmt(x.rp_needed) + ' RP до ранга «' + x.name + '»';
    card.appendChild(el('div', 'nxt-txt', txt));
    if (x.state === 'pending' && claimOn) {
      var many = pendingN > 1;
      var cb = el('button', 'claim big', many ? 'Забрать все награды (' + pendingN + ')' : 'Забрать награду');
      cb.type = 'button';
      cb.addEventListener('click', function () { haptic(); claimRewards(many ? null : x.name, cb); });
      card.appendChild(cb);
    }
    requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = pct + '%'; }); });
    return card;
  }

  function renderRankRewards(d, tiers, list) {
    var box = $('rewards-body'), pill = $('rw-pill'), dot = $('dot-rewards');
    box.textContent = '';
    var rp = num(d.rp);
    var got = list.filter(function (x) { return x.state === 'claimed'; }).length;
    var pendingN = list.filter(function (x) { return x.state === 'pending'; }).length;
    var claimOn = !!d.claim_enabled;     // бот старше v294 кнопку «Забрать» не умеет — тогда прежний текст
    pill.textContent = 'Получено ' + got + '/' + list.length; pill.className = 'pill';
    dot.style.display = pendingN ? '' : 'none';

    var ni = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].state !== 'claimed') { ni = i; break; } }
    if (ni < 0) {
      box.appendChild(soon('Все награды получены', 'Ты собрал все награды за ранги. Новые призы появятся здесь.', '<circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16.5 9"/>'));
      box.lastChild.style.marginBottom = '16px';
    } else {
      box.appendChild(nextRewardCard(list, ni, rp, tiers, claimOn, pendingN));
    }

    var tot = { tokens: 0, slx: 0, nft: 0 };
    list.forEach(function (x) { var r = x.reward || {}; tot.tokens += num(r.tokens); tot.slx += num(r.slx); tot.nft += Array.isArray(r.nft) ? r.nft.length : 0; });
    var sum = el('div', 'sum'); sum.appendChild(el('small', '', 'Всего за все ранги'));
    var sb = el('div', 'pzs');
    if (tot.tokens) sb.appendChild(chip('tk', fmtTok(tot.tokens) + ' токенов'));
    if (tot.slx) sb.appendChild(chip('slx', fmt(tot.slx) + ' SLX'));
    if (tot.nft) sb.appendChild(chip('nft', tot.nft + ' NFT', '110,231,255'));
    sum.appendChild(sb); box.appendChild(sum);

    box.appendChild(el('div', 'sec-title', 'Награды за ранги'));
    list.forEach(function (x, j) {
      var ei = embIndex(x.name, tiers);
      var cls = x.name === d.tier_name ? 'cur' : (x.state === 'claimed' ? 'reached' : (x.state === 'locked' ? 'later' : ''));
      if (x.state === 'pending' && claimOn) cls += ' pend';
      var row = el('div', 'rw ' + cls); row.style.setProperty('--i', String(j));
      var badge = el('div', 'badge'); badge.appendChild(emb(ei, 36));
      var meta = el('div', 'meta'); meta.appendChild(el('div', 'nm', x.name)); meta.appendChild(prizeChips(x.reward));
      if (x.state === 'locked') meta.appendChild(el('div', 'hint', num(x.matches_needed) > 0 ? 'Сыграй матч 1vs1, чтобы забрать' : 'Нужно ещё ' + fmt(x.rp_needed) + ' RP'));
      else if (x.state === 'pending' && !claimOn) meta.appendChild(el('div', 'hint', 'Придёт после ближайшего матча'));
      row.appendChild(badge); row.appendChild(meta);
      if (x.state === 'pending' && claimOn) {
        var cbtn = el('button', 'claim', 'Забрать'); cbtn.type = 'button';
        cbtn.addEventListener('click', function () { haptic(); claimRewards(x.name, cbtn); });
        row.appendChild(cbtn);
      } else {
        var st = el('div', x.state === 'claimed' ? 'got' : (x.state === 'pending' ? 'wait' : 'lock'));
        st.appendChild(svgIcon(x.state === 'claimed' ? '<polyline points="4 12.5 9.5 18 20 6.5"/>' : (x.state === 'pending' ? WAIT_SVG : LOCK_SVG)));
        row.appendChild(st);
      }
      box.appendChild(row);
    });

    var note = el('p', 'note', (claimOn
        ? 'Нажми «Забрать»: токены сразу зачислятся на баланс, SLX попадут в портфель на бирже (Аккаунт → Инвестиции), а NFT — в твою коллекцию. Бот пришлёт уведомление, когда награда станет доступна. '
        : 'Награда приходит автоматически после матча, в котором достигнут ранг, — бот пришлёт уведомление. ')
      + (d.rank_rewards_per_season ? 'Награды выдаются заново в каждом новом сезоне. ' : 'Каждая награда выдаётся один раз. ')
      + 'NFT достаются случайно из доступных карт нужной редкости.');
    note.style.marginTop = '4px'; box.appendChild(note);
    topPlaces(box, (d.rewards && d.rewards.top) || {}, true);
  }

  function renderRewards(d, tiers, cur) {
    if (d && Array.isArray(d.rank_rewards) && d.rank_rewards.length) renderRankRewards(d, tiers || [], d.rank_rewards);
    else renderRewardsLegacy(d, tiers, cur);
  }
  renderRewards(null, null, -1);
  $('dot-rewards').style.display = 'none';   // v295: пока данных нет, золотая точка на вкладке — лишний шум (она нужна, когда есть что забрать)

  // ───────────────────────────────────────────────
  //  «Забрать»: запрос к боту + эффект получения награды
  // ───────────────────────────────────────────────
  var claiming = false, toastTimer = 0;
  function tiersOf(d) { return d && Array.isArray(d.all_tiers) ? d.all_tiers : []; }
  function rerenderRewards() { if (!DATA) return; var t = tiersOf(DATA); safe(renderRewards, DATA, t, tierIdx(t, DATA.tier_name)); }

  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg; t.className = 'toast on' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  function confetti(box) {
    box.textContent = '';
    if (reduce) return;
    var cols = ['rgb(255,201,74)', 'rgb(167,139,250)', 'rgb(110,231,255)', 'rgb(232,121,249)', 'rgb(0,230,160)'];
    for (var i = 0; i < 44; i++) {
      var c = el('i', 'cf');
      c.style.setProperty('--x', (Math.random() * 100).toFixed(1) + '%');
      c.style.setProperty('--c', cols[i % cols.length]);
      c.style.setProperty('--r', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      c.style.setProperty('--d', (2.2 + Math.random() * 2).toFixed(2) + 's');
      c.style.setProperty('--dl', (Math.random() * 0.7).toFixed(2) + 's');
      box.appendChild(c);
    }
  }

  function revealItem(it, i) {
    var row = el('div', 'rv-item'); row.style.setProperty('--i', String(i));
    var ic = el('span', 'ic'), txt = el('div'), b = el('b'), sm = el('small');
    if (it.kind === 'tokens') {
      row.style.setProperty('--c', '255,201,74'); ic.textContent = '💰';
      b.textContent = '+' + fmt(it.amount) + ' токенов'; sm.textContent = 'зачислены на баланс';
    } else if (it.kind === 'slx') {
      row.style.setProperty('--c', '167,139,250'); ic.textContent = '📈';
      b.textContent = '+' + fmt(it.amount) + ' SLX'; sm.textContent = 'в твоём портфеле на бирже (Аккаунт → Инвестиции)';
    } else {
      row.style.setProperty('--c', NFT_COL[it.rarity] || '196,204,220'); ic.textContent = '🎴';
      if (it.given) {
        b.textContent = (it.name || 'NFT') + (it.serial ? ' #' + it.serial + (it.max_supply ? '/' + it.max_supply : '') : '');
        sm.textContent = 'NFT ' + (it.label || '') + (it.test ? ' · тестовая, не выдана' : ' · уже в твоей коллекции');
      } else {
        b.textContent = 'NFT ' + (it.label || ''); sm.textContent = 'выдаст администратор — тираж этой редкости закончился';
      }
    }
    txt.appendChild(b); txt.appendChild(sm); row.appendChild(ic); row.appendChild(txt);
    return row;
  }

  function closeReveal() { $('reveal').classList.remove('on'); document.body.style.overflow = ''; }

  function showReveal(detail) {
    var ov = $('reveal'), box = $('reveal-box'), tiers = tiersOf(DATA);
    box.textContent = '';
    var ei = embIndex(detail[0].name, tiers);
    ov.style.setProperty('--tier-rgb', tierRgb(ei));
    var hero = el('div', 'rv-emb'); hero.appendChild(emb(ei, 84)); box.appendChild(hero);
    box.appendChild(el('div', 'rv-title', 'Награда получена!'));
    box.appendChild(el('div', 'rv-sub', detail.map(function (t) { return t.name; }).join(' · ')));
    var list = el('div', 'rv-list'), n = 0;
    detail.forEach(function (t) {
      if (detail.length > 1) list.appendChild(el('div', 'rv-tier', (t.emoji || '') + ' ' + t.name));
      (t.items || []).forEach(function (it) { list.appendChild(revealItem(it, n++)); });
    });
    box.appendChild(list);
    var ok = el('button', 'claim big rv-ok', 'Отлично!'); ok.type = 'button';
    ok.addEventListener('click', closeReveal);
    box.appendChild(ok);
    confetti($('reveal-cf'));
    document.body.style.overflow = 'hidden';
    ov.classList.add('on');
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }
  $('reveal').addEventListener('click', function (e) { if (e.target === $('reveal')) closeReveal(); });

  // tier — название ранга; null — забрать всё, что доступно. Нажимать повторно безопасно:
  // сервер выдаёт награду один раз, а при потерянном ответе следующий запрос просто вернёт «уже получено».
  function claimRewards(tier, btn) {
    if (claiming) return;
    if (!canLoad()) { toast('Открой ранги через кнопку в боте — в ссылке не хватает данных', true); return; }
    claiming = true; app.classList.add('claiming');
    var label = btn ? btn.textContent : ''; if (btn) { btn.classList.add('busy'); btn.textContent = 'Забираю…'; }
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    function resync() { setTimeout(function () { load(true); }, 700); }
    fetch(API + '/casino/ranks/claim', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
      body: JSON.stringify({ uid: UID, secret: SECRET, init_data: INIT || undefined, tier: tier || null }), signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) { return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.status === 401) { toast('Доступ не подтверждён — открой ранги заново из бота', true); return; }
        if (res.status === 429) { toast('Не так быстро — попробуй через секунду', true); return; }
        if (res.status === 404) { toast('Бот ещё не обновлён — награду пока нельзя забрать', true); return; }
        if (!res.ok || !res.j || res.j.ok !== true) { toast('Не удалось забрать награду. Попробуй ещё раз', true); resync(); return; }
        var j = res.j;
        if (DATA && Array.isArray(j.rank_rewards)) { DATA.rank_rewards = j.rank_rewards; lastSig = ''; rerenderRewards(); }
        if (Array.isArray(j.detail) && j.detail.length) showReveal(j.detail);
        else if (j.blocked === 'matches') toast('Сначала сыграй матч 1vs1 — после него награда откроется');
        else toast('Эти награды уже получены');
      })
      .catch(function () { toast('Нет связи с сервером — проверь интернет и нажми ещё раз', true); resync(); })
      .then(function () {
        clearTimeout(timer); claiming = false; app.classList.remove('claiming');
        if (btn && btn.parentNode) { btn.classList.remove('busy'); btn.textContent = label; }
      });
  }

  // Один сломанный экран не должен валить остальные (и не должен выглядеть как «сервер не отвечает»)
  function safe(fn, a, b, c) { try { fn(a, b, c); } catch (e) { try { console.error(e); } catch (_) {} } }

  function render(d) {
    var tiers = Array.isArray(d.all_tiers) ? d.all_tiers : [];
    var cur = tierIdx(tiers, d.tier_name);
    app.style.setProperty('--tier-rgb', tierRgb(cur));
    TIME.srv = num(d.server_time) || Date.now() / 1000; TIME.perf = performance.now();
    DATA = d;
    safe(applyFire, cur);
    safe(renderRank, d, tiers, cur);
    safe(renderTop, d, tiers, cur);
    safe(renderSeason, d);
    safe(renderHistory, d);
    safe(renderRewards, d, tiers, cur);
  }

  // v295: причина последнего сбоя показывается мелким шрифтом на экране ошибки — по скриншоту видно, что именно сломалось
  var VER = 'v297', lastErr = '', failKind = '', staleKind = '';

  function setConn(text) { var c = $('conn'); c.textContent = text || ''; c.classList.toggle('on', !!text); }
  function showStale(kind) {
    staleKind = kind || '';
    var st = $('stale');
    if (!kind) { st.classList.remove('on'); return; }
    $('stale-text').textContent = kind === 'cache' ? 'Показаны сохранённые данные · обновляю…' : 'Нет связи с сервером — данные могут быть устаревшими';
    st.classList.add('on');
  }

  function fail(kind) {
    setConn('');
    if (loaded) { showStale('offline'); return; }   // уже есть что показать — экран ошибки не нужен
    var title = 'Не удалось загрузить данные', text;
    if (kind === 'params') { title = 'Нет данных для подключения'; text = 'Открой рейтинг через кнопку в боте — в ссылке не хватает параметров.'; }
    else if (kind === 'unauthorized') { title = 'Доступ не подтверждён'; text = 'Открой рейтинг заново из бота, чтобы обновить ссылку.'; }
    else { text = 'Сервер не отвечает. Проверь соединение — я продолжу пробовать сам.'; }
    $('err-title').textContent = title;
    $('err-text').textContent = text;
    $('err-detail').textContent = (lastErr ? 'Причина: ' + lastErr + ' · ' : '') + VER;
    var season = $('season-text'); unsk(season); season.textContent = 'Ранговый сезон';
    var tn = $('tier-name'); unsk(tn); tn.classList.add('muted'); tn.textContent = 'Ранг недоступен';
    failKind = kind;
    app.dataset.state = 'error';
  }

  // Последний удачный ответ храним в браузере: если сервер моргнул, рейтинг откроется сразу, а не пустым скелетоном
  var CKEY = 'rk_cache_1_' + UID;
  function cacheGet() {
    try {
      var o = JSON.parse(localStorage.getItem(CKEY) || 'null');
      if (!o || !o.d || !o.t || Date.now() - o.t > 7 * 86400000) return null;
      return o;
    } catch (e) { return null; }
  }
  function cachePut(d) { try { localStorage.setItem(CKEY, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
  function canLoad() { return !!UID && /^https?:\/\//i.test(API) && !!(SECRET || INIT); }

  // silent = фоновое обновление уже показанных данных: не мигает загрузкой, а при сбое молча
  // оставляет прежние данные (экран ошибки — только если показать вообще нечего).
  // Первая загрузка: до 4 попыток с растущей паузой (сервер мог просто перезапускаться), с пояснением на экране.
  var lastSig = '', lastLoadAt = 0, tries = 0;
  var TRY_MAX = 4, TRY_TO = [9000, 9000, 12000, 15000], TRY_GAP = [1200, 2500, 4500];
  function sigOf(j) { try { return JSON.stringify(j, function (k, v) { return k === 'server_time' ? undefined : v; }); } catch (e) { return ''; } }

  function load(silent) {
    if (busy) return;
    if (!canLoad()) { if (!silent && !loaded) fail('params'); return; }
    busy = true;
    var quiet = !!silent || loaded, myTry = 0, connTimer = 0, again = false;
    if (!quiet) {
      tries++; myTry = tries;
      app.dataset.state = 'loading';
      var tn = $('tier-name'); tn.classList.remove('muted'); tn.classList.add('sk'); tn.textContent = ''; tn.style.width = '170px';
      if (myTry > 1) setConn('Сервер отвечает медленно… попытка ' + myTry + ' из ' + TRY_MAX);
      else connTimer = setTimeout(function () { if (busy && !loaded) setConn('Подключаюсь к серверу…'); }, 3500);
    }
    var limit = quiet ? 12000 : TRY_TO[Math.min(myTry - 1, TRY_TO.length - 1)];
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, limit);
    var url = API + '/casino/ranks?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET) +
      (useInit && INIT ? '&init_data=' + encodeURIComponent(INIT) : '');

    function netFail(why) {
      if (why) lastErr = why;
      if (quiet) { if (loaded) showStale('offline'); return; }
      if (myTry < TRY_MAX) { setTimeout(function () { load(false); }, TRY_GAP[myTry - 1] || 4500); return; }
      fail('network');
    }

    fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (res.status === 401) {
          if (!useInit && INIT) { useInit = true; again = true; return; }   // секрет в ссылке устарел — пробуем подписью Telegram
          lastErr = 'HTTP 401 (ссылка устарела)';
          if (!quiet) fail('unauthorized'); else if (loaded) showStale('offline');
          return;
        }
        if (!res.ok || !res.j || res.j.ok !== true) { netFail('HTTP ' + res.status); return; }
        var sig = sigOf(res.j);
        lastLoadAt = Date.now(); tries = 0; lastErr = ''; failKind = '';
        setConn(''); showStale(''); cachePut(res.j);
        if (quiet && loaded && sig === lastSig) {   // ничего не изменилось — не перерисовываем (иначе строки заново «выезжают»)
          TIME.srv = num(res.j.server_time) || TIME.srv; TIME.perf = performance.now();
          return;
        }
        lastSig = sig;
        loaded = true; window.__rkLoaded = true;
        app.dataset.state = 'ready';
        try { render(res.j); } catch (e) { try { console.error(e); } catch (_) {} }
        requestAnimationFrame(movePill);
      })
      .catch(function (e) { netFail(e && e.name === 'AbortError' ? 'нет ответа за ' + Math.round(limit / 1000) + ' с' : String((e && e.message) || e || 'сеть')); })
      .then(function () {
        clearTimeout(timer); clearTimeout(connTimer); busy = false;
        if (again) { if (!quiet) tries--; load(silent); }
      });
  }

  // вернулся в приложение (после матча, из другого чата) — данные могли измениться
  function refreshSoon() { if (!loaded || busy || document.hidden) return; if (Date.now() - lastLoadAt < 15000) return; load(true); }
  document.addEventListener('visibilitychange', refreshSoon);
  window.addEventListener('focus', refreshSoon);
  setInterval(refreshSoon, 60000);
  // связи не было — пробуем сами каждые 15 с, экран оживёт без нажатия «Повторить»
  setInterval(function () { if (!busy && ((!loaded && failKind === 'network') || staleKind === 'offline')) load(true); }, 15000);

  $('retry').addEventListener('click', function () { tries = 0; load(false); });
  $('stale-retry').addEventListener('click', function () { load(true); });

  // есть сохранённый ответ — показываем его сразу, свежий подтянется следом
  (function fromCache() {
    if (!canLoad()) return;
    var c = cacheGet();
    if (!c) return;
    var d = c.d;
    d.server_time = num(d.server_time) + (Date.now() - c.t) / 1000;   // таймер сезона идёт от момента сохранения
    loaded = true; window.__rkLoaded = true; lastSig = sigOf(d);
    app.dataset.state = 'ready';
    try { render(d); } catch (e) { try { console.error(e); } catch (_) {} }
    showStale('cache');
  })();

  load(false);
  window.__rkInit = true;
})();
</script>
