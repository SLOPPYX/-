<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ранги 1vs1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --bg: #000;
    --border: rgba(139,92,246,.18);
    --accent: #8b5cf6;
    --accent-light: #c4b5fd;
    --accent-dark: #6d28d9;
    --up: #00e6a0;
    --down: #ff3b5c;
    --text: #f5f1ff;
    --text2: #a79dbd;
    --text3: #6b6280;
    --tier-rgb: 139,92,246;
  }
  html, body { background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ─── Живой фон ─── */
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; will-change: transform; }
  .aurora i:nth-child(1) { width: 460px; height: 340px; top: -150px; left: 50%; margin-left: -230px; background: radial-gradient(ellipse, rgba(139,92,246,.30), transparent 70%); animation: drift1 16s ease-in-out infinite; }
  .aurora i:nth-child(2) { width: 380px; height: 380px; bottom: -160px; left: -110px; background: radial-gradient(circle, rgba(109,40,217,.26), transparent 70%); animation: drift2 20s ease-in-out infinite; }
  .aurora i:nth-child(3) { width: 320px; height: 320px; top: 34%; right: -140px; background: radial-gradient(circle, rgba(var(--tier-rgb),.16), transparent 70%); animation: drift3 24s ease-in-out infinite; transition: background 1s; }
  .grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 26px 26px;
    -webkit-mask: linear-gradient(180deg, #000, transparent 55%); mask: linear-gradient(180deg, #000, transparent 55%); }

  .app {
    position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(104px + env(safe-area-inset-bottom, 0px));
  }

  /* ─── Шапка ─── */
  .top h1 {
    font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; display: inline-block;
    background: linear-gradient(135deg, #fff 20%, var(--accent-light) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .top h1 span { color: var(--accent-light); -webkit-text-fill-color: var(--accent-light); }
  .sub { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text3); min-height: 16px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px rgba(139,92,246,.9); flex-shrink: 0; animation: pulse 1.8s ease-in-out infinite; }

  /* ─── Скелетоны ─── */
  .sk {
    display: inline-block; min-height: 1em; vertical-align: middle; border-radius: 8px;
    color: transparent !important; border-color: transparent !important;
    background: linear-gradient(90deg, rgba(255,255,255,.05), rgba(255,255,255,.13), rgba(255,255,255,.05)) 0 0 / 220% 100% !important;
    animation: skmove 1.4s linear infinite;
  }
  .sub .sk { height: 14px; }

  /* ─── Страницы (вкладки) ─── */
  .page { display: none; }
  .page.on { display: block; animation: pageIn .5s cubic-bezier(.2,.8,.2,1); }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 2px 14px; }
  .page-head h3 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .pill { padding: 6px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap;
    color: var(--accent-light); background: rgba(139,92,246,.14); border: 1px solid rgba(139,92,246,.35); }
  .pill.soon { color: #ffd76a; background: rgba(255,201,74,.1); border-color: rgba(255,201,74,.35); }

  /* ─── Эмблемы рангов (SVG) ─── */
  .rk { display: block; flex-shrink: 0; overflow: visible; filter: drop-shadow(0 2px 5px rgba(0,0,0,.55)); }
  .rk.in { display: inline-block; vertical-align: -6px; }

  /* ─── Герой ─── */
  .hero { text-align: center; padding: 22px 0 22px; }
  .stage { position: relative; width: 150px; height: 150px; margin: 0 auto 26px; perspective: 700px; }
  .emblem { position: absolute; inset: 0; display: grid; place-items: center; transform-style: preserve-3d; transition: transform .25s ease-out; }
  .emblem .halo { position: absolute; inset: -30px; border-radius: 50%; opacity: .55; background: radial-gradient(circle, rgba(var(--tier-rgb), .6) 0%, transparent 66%); animation: breathe 3.6s ease-in-out infinite; }
  .emblem .disc {
    position: absolute; inset: 6px; border-radius: 50%;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.16), transparent 46%), linear-gradient(160deg, #1b1032, #07040e);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 0 0 1px rgba(var(--tier-rgb), .3), 0 20px 40px -14px rgba(0,0,0,.9), 0 0 50px -6px rgba(var(--tier-rgb), .6);
  }
  .emblem .spin {
    position: absolute; inset: -2px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 60%, rgb(var(--tier-rgb)) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    animation: spin 5s linear infinite; opacity: .95;
  }
  .emblem .glare { position: absolute; inset: 6px; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .emblem .glare::after { content: ''; position: absolute; inset: 0; transform: translateX(-130%);
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.30) 50%, transparent 62%); animation: glare 5.5s ease-in-out infinite; }
  .medal { position: relative; width: 96px; height: 96px; display: grid; place-items: center; transform: translateZ(40px); animation: float 4s ease-in-out infinite; }
  .medal .rk { filter: drop-shadow(0 10px 18px rgba(0,0,0,.7)) drop-shadow(0 0 16px rgba(var(--tier-rgb), .55)); }
  .medal.ph svg { width: 56px; height: 56px; stroke: var(--text3); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .medal.pop { animation: pop .8s cubic-bezier(.3,1.5,.5,1) both, float 4s ease-in-out .8s infinite; }
  .sparks { position: absolute; left: 50%; bottom: 14px; width: 0; height: 0; pointer-events: none; }
  .sparks i {
    position: absolute; left: var(--x); bottom: 0; width: var(--s); height: var(--s); border-radius: 50%; opacity: 0;
    background: rgb(var(--tier-rgb)); box-shadow: 0 0 8px 1px rgba(var(--tier-rgb), .9);
    animation: spark var(--d) linear var(--dl) infinite;
  }
  .tier { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; min-height: 37px; text-shadow: 0 0 30px rgba(var(--tier-rgb), .6); }
  .tier.sk { height: 34px; }
  .tier.muted { font-size: 18px; color: var(--text3); text-shadow: none; }
  .rp { margin-top: 8px; display: flex; align-items: baseline; justify-content: center; gap: 7px; }
  .rp #rp-val { font-size: 46px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .rp #rp-val.empty { color: var(--text3); }
  .rp small { font-size: 15px; font-weight: 800; letter-spacing: .06em; color: var(--accent-light); }

  /* ─── Карточки ─── */
  .card {
    position: relative; margin-bottom: 14px; padding: 18px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, rgba(26,15,48,.72), rgba(9,6,16,.8));
    border: 1px solid var(--border); box-shadow: 0 20px 40px -22px rgba(0,0,0,.8);
  }
  .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(196,181,253,.55), transparent); }
  .card.glow::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--ang), transparent 0 70%, rgba(var(--tier-rgb), .95) 86%, #fff 92%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    animation: ang 6s linear infinite;
  }

  /* прогресс */
  .pg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  .chip.cur { background: rgba(var(--tier-rgb), .14); border-color: rgba(var(--tier-rgb), .4); }
  .chip.max { background: rgba(139,92,246,.16); border-color: rgba(139,92,246,.45); color: var(--accent-light); }
  .arr { color: var(--text3); font-weight: 800; }
  .bar { position: relative; height: 12px; border-radius: 999px; background: rgba(255,255,255,.07); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
  .bar.loading::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent) 0 0 / 220% 100%; animation: skmove 1.4s linear infinite; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; display: block;
    background: linear-gradient(90deg, var(--accent-dark), var(--accent) 55%, var(--accent-light));
    box-shadow: 0 0 16px rgba(139,92,246,.75); transition: width 1.7s cubic-bezier(.22,.9,.24,1); }
  .bar i::before { content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%) 0 0 / 220% 100%; animation: sheen 2.4s linear infinite; }
  .bar i::after { content: ''; position: absolute; right: 0; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(35%, -50%); background: #fff;
    box-shadow: 0 0 0 4px rgba(139,92,246,.3), 0 0 14px rgba(196,181,253,.9); animation: headpulse 1.8s ease-in-out infinite; }
  .pg-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .pg-foot #pg-pct { color: var(--accent-light); }
  .pg-note { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.06); font-size: 14px; color: var(--text2); line-height: 1.5; min-height: 20px; }
  .pg-note b { color: var(--text); font-weight: 800; }
  .pg-note.sk { display: block; height: 16px; }

  /* статистика */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { position: relative; padding: 14px 10px 13px; border-radius: 18px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, rgba(26,15,48,.6), rgba(9,6,16,.7)); border: 1px solid var(--border); transition: transform .2s, box-shadow .2s; }
  .stat:active { transform: scale(.97); }
  .stat::before { content: ''; position: absolute; left: 24%; right: 24%; top: 0; height: 2px; border-radius: 2px; background: var(--c, var(--accent)); box-shadow: 0 0 12px var(--c, var(--accent)); }
  .stat::after { content: ''; position: absolute; left: 50%; top: -30px; width: 90px; height: 60px; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(ellipse, var(--c, var(--accent)), transparent 70%); opacity: .13; }
  .stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--c, var(--text)); min-height: 30px; line-height: 1.15; }
  .stat b.sk { height: 26px; }
  .stat span { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); }
  .stat.w { --c: var(--up); } .stat.l { --c: var(--down); } .stat.r { --c: var(--accent-light); }
  .stats-note { margin: 10px 4px 24px; font-size: 11.5px; line-height: 1.4; color: var(--text3); text-align: center; }

  /* лестница */
  .sec-title { margin: 0 2px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }
  .ladder { list-style: none; }
  .rung { position: relative; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; padding: 11px 14px 11px 11px; border-radius: 18px; border: 1px solid transparent;
    background: rgba(255,255,255,.025); opacity: 0; transform: translateY(8px);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .rung:last-child { margin-bottom: 0; }
  .rung:not(:last-child)::after { content: ''; position: absolute; left: 32px; top: 100%; width: 2px; height: 10px; background: rgba(255,255,255,.07); }
  .rung.passed::after, .rung.current::after { background: linear-gradient(180deg, var(--accent), rgba(139,92,246,.35)) !important; }
  .rung .badge { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  .rung .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rung .nm { font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
  .rung .th { font-size: 12px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; }
  .rung .st { margin-left: auto; display: flex; align-items: center; flex-shrink: 0; }
  .rung .st svg { width: 18px; height: 18px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .rung.passed { --o: .65; } .rung.passed .st svg { stroke: var(--up); }
  .rung.locked { --o: .55; } .rung.locked .badge .rk { filter: grayscale(1) brightness(.8) drop-shadow(0 2px 5px rgba(0,0,0,.55)); } .rung.locked .st svg { stroke: var(--text3); }
  .rung.current { --o: 1; background: linear-gradient(90deg, rgba(var(--tier-rgb), .18), rgba(139,92,246,.06)); border-color: rgba(var(--tier-rgb), .5); box-shadow: 0 0 34px -10px rgba(var(--tier-rgb), .7); }
  .rung.current .badge { background: rgba(var(--tier-rgb), .18); border-color: rgba(var(--tier-rgb), .5); box-shadow: 0 0 18px -4px rgba(var(--tier-rgb), .8); }
  .here { padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; white-space: nowrap; background: rgb(var(--tier-rgb)); color: #12081f; animation: pulse 2s ease-in-out infinite; }
  .rung.ghost { --o: 1; }
  .rung.ghost .badge.sk { border: 0; }
  .rung.ghost .nm.sk, .rung.ghost .th.sk { display: block; height: 14px; }

  /* ─── Топ ─── */
  .youbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 11px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 700;
    background: linear-gradient(90deg, rgba(139,92,246,.22), rgba(139,92,246,.05)); border: 1px solid rgba(139,92,246,.5); box-shadow: 0 0 30px -12px rgba(139,92,246,.9); }
  .youbar b { color: var(--accent-light); }
  .podium { display: grid; grid-template-columns: 1fr 1.18fr 1fr; gap: 10px; align-items: end; margin: 4px 0 18px; }
  .pod { --c: 196,204,220; --h: 64px; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; opacity: 0; transform: translateY(14px); animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--dl, 0s); }
  .pod.p1 { --c: 255,201,74; --h: 92px; --dl: .05s; } .pod.p2 { --c: 196,204,220; --h: 68px; --dl: .18s; } .pod.p3 { --c: 205,127,79; --h: 54px; --dl: .3s; }
  .pod .crown { width: 26px; height: 20px; margin-bottom: 4px; filter: drop-shadow(0 0 8px rgba(255,201,74,.8)); animation: float 3.4s ease-in-out infinite; }
  .pod .av { position: relative; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 8px;
    background: radial-gradient(circle at 32% 24%, rgba(255,255,255,.14), transparent 50%), linear-gradient(160deg, #1b1032, #07040e);
    border: 1.5px solid rgba(var(--c), .75); box-shadow: 0 0 26px -4px rgba(var(--c), .7); }
  .pod.p1 .av { width: 78px; height: 78px; }
  .pod .av::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(var(--c), .5); animation: ringpulse 2.6s ease-out infinite; }
  .pod .pn { max-width: 100%; padding: 0 2px; font-size: 13.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pp { margin: 2px 0 8px; font-size: 12px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }
  .pod .base { position: relative; width: 100%; height: var(--h); border-radius: 16px 16px 6px 6px; display: grid; place-items: center; overflow: hidden;
    font-size: 26px; font-weight: 900; color: rgba(var(--c), 1);
    background: linear-gradient(180deg, rgba(var(--c), .34), rgba(var(--c), .04)); border: 1px solid rgba(var(--c), .4); border-bottom: 0; text-shadow: 0 0 18px rgba(var(--c), .8); }
  .pod .base::after { content: ''; position: absolute; inset: 0; transform: translateX(-130%); background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.22) 50%, transparent 62%); animation: glare 5s ease-in-out infinite; }
  .pod.p2 .base::after { animation-delay: .6s; } .pod.p3 .base::after { animation-delay: 1.2s; }
  .pod.me .av { border-color: var(--accent-light); box-shadow: 0 0 30px -2px rgba(139,92,246,.95); }
  .pod .you { position: absolute; top: -8px; right: -10px; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; background: var(--accent); color: #fff; z-index: 2; }
  .pod.empty .av { border-style: dashed; border-color: rgba(255,255,255,.16); box-shadow: none; background: rgba(255,255,255,.03); }
  .pod.empty .av::after { display: none; }
  .pod.empty .av svg { width: 22px; height: 22px; fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2; stroke-linecap: round; }
  .pod.empty .pn { color: var(--text3); }
  .pod.empty .base { color: var(--text3); background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); text-shadow: none; }
  .trow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 10px 14px 10px 10px; border-radius: 16px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
    opacity: 0; transform: translateY(8px); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 60ms + .35s); }
  .trow .pl { width: 28px; text-align: center; font-size: 15px; font-weight: 800; color: var(--text3); font-variant-numeric: tabular-nums; }
  .trow .who { flex: 1; min-width: 0; }
  .trow .who b { display: block; font-size: 14.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .who small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--text3); }
  .trow .pt { text-align: right; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .trow .pt small { display: block; font-size: 10.5px; letter-spacing: .06em; color: var(--accent-light); }
  .trow.me { border-color: rgba(139,92,246,.6); background: linear-gradient(90deg, rgba(139,92,246,.22), rgba(139,92,246,.05)); box-shadow: 0 0 30px -10px rgba(139,92,246,.9); }
  .trow.me .pl { color: var(--accent-light); }
  .mycard { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .mycard .big { font-size: 34px; font-weight: 900; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .mycard .of { margin-top: 5px; font-size: 12.5px; font-weight: 600; color: var(--text2); }
  .mycard .rt { margin-left: auto; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--text2); }
  .mycard .rt b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .mynote { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.06); font-size: 13px; line-height: 1.45; color: var(--text2); }
  .mynote b { color: var(--text); }

  /* ─── Сезон ─── */
  .timer { display: flex; align-items: center; gap: 18px; }
  .ringbox { position: relative; width: 124px; height: 124px; flex-shrink: 0; }
  .ringbox svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ringbox .trk { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 9; }
  .ringbox .prg { fill: none; stroke: url(#ringGrad); stroke-width: 9; stroke-linecap: round; filter: drop-shadow(0 0 7px rgba(139,92,246,.85)); transition: stroke-dashoffset 1.8s cubic-bezier(.22,.9,.24,1); }
  .ringbox .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ringbox .mid b { font-size: 34px; font-weight: 900; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ringbox .mid span { margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); }
  .tinfo { min-width: 0; }

  .rule svg { width: 20px; height: 20px; margin-bottom: 6px; fill: none; stroke: var(--c); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--c)); }
  .rule b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -.02em; color: var(--c); font-variant-numeric: tabular-nums; }

  .hs { margin-bottom: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }

  /* ─── Заглушки «в разработке» ─── */

  .rw .badge { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }

  .rw .badge.num { font-size: 22px; font-weight: 900; color: rgb(var(--c)); background: rgba(var(--c), .12); border-color: rgba(var(--c), .4); text-shadow: 0 0 14px rgba(var(--c), .7); }

  /* история боёв */

    opacity: 0; transform: translateY(8px); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i, 0) * 45ms); }
  .hrow.win { --c: var(--up); } .hrow.loss { --c: var(--down); }
  .hres { width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0; display: grid; place-items: center; }

  /* ─── Нижняя панель вкладок ─── */
  .tabbar { position: fixed; z-index: 50; left: 12px; right: 12px; max-width: 456px; margin: 0 auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; padding: 6px; border-radius: 24px; background: rgba(12,7,22,.82); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid rgba(139,92,246,.28); box-shadow: 0 18px 40px -10px rgba(0,0,0,.9), 0 0 40px -14px rgba(139,92,246,.6), inset 0 1px 0 rgba(255,255,255,.06); }
  .tabpill { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 18px; pointer-events: none;
    background: linear-gradient(180deg, rgba(139,92,246,.34), rgba(139,92,246,.12)); border: 1px solid rgba(196,181,253,.4); box-shadow: 0 0 22px -4px rgba(139,92,246,.9);
    transition: transform .4s cubic-bezier(.3,1.2,.4,1), width .4s cubic-bezier(.3,1.2,.4,1); }
  .tab { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 18px; font-size: 10.5px; font-weight: 700; color: var(--text3); transition: color .25s; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
  .tab.on { color: #fff; }
  .tab.on svg { transform: translateY(-1px) scale(1.12); filter: drop-shadow(0 0 6px rgba(196,181,253,.9)); }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

      <div class="ghostrow"><i class="a"></i><span class="b"><i></i><i></i></span><i class="c"></i></div>

</main>

      var line = el('div', 'mycard');
      line.appendChild(emb(cur >= 0 ? cur : 0, 38));
      var left = el('div');
      if (mp) { left.appendChild(el('div', 'big', '#' + fmt(mp))); left.appendChild(el('div', 'of', 'твоё место из ' + fmt(total))); }
      else { left.appendChild(el('div', 'big', '—')); left.appendChild(el('div', 'of', 'ты пока вне рейтинга')); }
      line.appendChild(left);
      var rt = el('div', 'rt'); rt.appendChild(el('b', '', fmt(num(d.rp)))); rt.appendChild(document.createTextNode('RP'));
      line.appendChild(rt);
      card.appendChild(line);
      var mn = el('div', 'mynote');
      if (mp && top.length >= 10) {
        var gap = Math.max(1, num(top[9].rp) - num(d.rp) + 1);
        mn.appendChild(document.createTextNode('До топ-10 нужно набрать ещё ')); mn.appendChild(el('b', '', fmt(gap) + ' RP')); mn.appendChild(document.createTextNode('.'));
      } else if (mp) mn.textContent = 'В списке показаны только первые десять игроков — остальные видят своё место, как ты.';
      else mn.textContent = 'Сыграй матч 1vs1 и заработай первые очки — тогда ты попадёшь в рейтинг сезона.';
      card.appendChild(mn);
      body.appendChild(card);
    }
  }

  var TIMER = null;
  function tickTimer() {
    if (!TIMER) return;
    var left = Math.max(0, TIMER.end - nowSrv());
    var dd = Math.floor(left / 86400), hh = Math.floor(left % 86400 / 3600), mm = Math.floor(left % 3600 / 60), ss = Math.floor(left % 60);
    var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    var a = $('tm-d'), b = $('tm-hms');
    if (a) a.textContent = String(dd);
    if (b) b.textContent = p2(hh) + ':' + p2(mm) + ':' + p2(ss);
  }
  setInterval(tickTimer, 1000);

  function renderSeason(d) {
    var body = $('season-body'); body.textContent = '';
    $('season-pill').textContent = '№ ' + d.season_number;
    var start = num(d.season_start_time), end = num(d.season_end_time);

    var card = el('div', 'card glow');
    card.appendChild(el('div', 'sec-title', d.season_name));
    if (start && end && end > start) {
      var total = end - start, now = nowSrv();
      var prog = Math.max(0, Math.min(1, (now - start) / total));
      var C = 2 * Math.PI * 52;
      var wrap = el('div', 'timer');
      var rb = el('div', 'ringbox');
      rb.innerHTML = '<svg viewBox="0 0 124 124"><circle class="trk" cx="62" cy="62" r="52"/><circle class="prg" id="tm-ring" cx="62" cy="62" r="52" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/></svg>';
      var mid = el('div', 'mid'); mid.appendChild(el('b', '', '0')); mid.firstChild.id = 'tm-d'; mid.appendChild(el('span', '', 'дн. осталось'));
      rb.appendChild(mid); wrap.appendChild(rb);
      var info = el('div', 'tinfo');
      info.appendChild(el('div', 'k', 'До конца сезона'));
      var hms = el('div', 'hms', '00:00:00'); hms.id = 'tm-hms'; info.appendChild(hms);
      info.appendChild(el('div', 'dt', fdate(start) + ' — ' + fdate(end) + ' · день ' + Math.min(Math.round(total / 86400), Math.floor((now - start) / 86400) + 1) + ' из ' + Math.round(total / 86400)));
      wrap.appendChild(info); card.appendChild(wrap);
      TIMER = { end: end };
      tickTimer();
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        var ring = $('tm-ring'); if (ring) ring.style.strokeDashoffset = (C * (1 - prog)).toFixed(1);
      }); });
      card.appendChild(el('div', 'note', 'Сезон длится около двух месяцев. Итоги подводятся в конце сезона, а рейтинг при этом не обнуляется — часть очков остаётся с тобой.'));
    } else {
      TIMER = null;
      card.appendChild(el('div', 'note', 'Сезон стартует с первого сыгранного матча — после этого здесь появится обратный отсчёт.'));
    }
    body.appendChild(card);

    var r = d.rules;
    if (r && typeof r === 'object') {
      var rules = el('div', 'rules');
      var mk = function (cls, icon, big, txt) { var x = el('div', 'rule ' + cls); x.appendChild(svgIcon(icon)); x.appendChild(el('b', '', big)); x.appendChild(el('span', '', txt)); return x; };
      rules.appendChild(mk('w', '<polyline points="4 15 10 9 14 13 20 7"/><polyline points="15 7 20 7 20 12"/>', '+' + num(r.win_rp), 'RP за победу'));
      rules.appendChild(mk('l', '<polyline points="4 9 10 15 14 11 20 17"/><polyline points="15 17 20 17 20 12"/>', '−' + num(r.loss_rp), 'RP за поражение, не ниже 0'));
      rules.appendChild(mk('d', '<path d="M12 4v10"/><polyline points="7 10 12 15 17 10"/><line x1="6" y1="20" x2="18" y2="20"/>', num(r.decay_percent) + '%', 'RP остаётся в новом сезоне'));
      body.appendChild(rules);
    }

    body.appendChild(el('div', 'sec-title', 'Прошлые сезоны'));
    var hist = Array.isArray(d.history) ? d.history : [];
    if (!hist.length) body.appendChild(el('div', 'note', 'Пока прошлых сезонов нет — ты в самом первом. Победители будут собраны здесь.'));
    hist.forEach(function (h) {
      var box = el('div', 'hs');
      var t = el('div', 't'); t.appendChild(document.createTextNode(h.name + ' (№ ' + h.number + ')'));
      t.appendChild(el('span', '', (h.start && h.end) ? fdate(h.start) + ' — ' + fdate(h.end) : ''));
      box.appendChild(t);
      var wn = el('div', 'w');
      (h.top3 || []).forEach(function (x, i) { wn.appendChild(el('i', '', (i + 1) + ' · ' + x.name + ' · ' + fmt(num(x.rp)))); });
      if (wn.childNodes.length) box.appendChild(wn);
      body.appendChild(box);
    });
  }

  // ───────────────────────────────────────────────
  //  История боёв
  // ───────────────────────────────────────────────
  var ICON_WIN = '<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3"/><path d="M16 6h3v1a3 3 0 0 1-3 3"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="8.5" y1="20" x2="15.5" y2="20"/>';
  var ICON_LOSS = '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>';
  var ICON_FLAME = '<path d="M12 3c1 3.5 4.5 5 4.5 9a4.5 4.5 0 0 1-9 0c0-1.7.7-2.8 1.6-3.8.2 1.2.9 1.8 1.6 1.8C10.4 7.6 11 5.5 12 3z"/>';

  function statTile(cls, value, label) {
    var t = el('div', 'stat ' + cls);
    t.appendChild(el('b', '', value)); t.appendChild(el('span', '', label));
    return t;
  }

  function renderHistory(d) {
    var body = $('hist-body'), pill = $('hist-pill'), dot = $('dot-history');
    body.textContent = '';
    if (!Array.isArray(d.matches)) {
      pill.textContent = 'Скоро'; pill.className = 'pill soon'; dot.style.display = '';
      body.appendChild(soon('История скоро', 'Список матчей появится после обновления бота.'));
      return;
    }
    dot.style.display = 'none';
    var ms = d.matches;
    if (!ms.length) {
      pill.className = 'pill'; pill.textContent = 'Пусто';
      body.appendChild(soon('Матчей пока не было', 'Сыграй первый бой 1vs1 — он сразу появится здесь.'));
      return;
    }
    pill.className = 'pill'; pill.textContent = 'Последние ' + ms.length;

    var wins = 0;
    ms.forEach(function (x) { if (x.result === 'win') wins++; });
    var tiles = el('div', 'stats'); tiles.style.marginBottom = '14px';
    tiles.appendChild(statTile('w', fmt(num(d.streak)), 'Серия побед'));
    tiles.appendChild(statTile('r', fmt(num(d.best_streak)), 'Лучшая серия'));
    tiles.appendChild(statTile('r', wins + '–' + (ms.length - wins), 'Побед / пор.'));
    body.appendChild(tiles);

    // форма: последние 10, слева старые → справа новые
    var form = el('div', 'form');
    ms.slice(0, 10).reverse().forEach(function (x) { form.appendChild(el('i', x.result === 'win' ? 'w' : 'l')); });
    form.appendChild(el('small', '', 'старые → новые'));
    body.appendChild(form);

    ms.forEach(function (x, i) {
      var win = x.result === 'win';
      var row = el('div', 'hrow ' + (win ? 'win' : 'loss')); row.style.setProperty('--i', String(Math.min(i, 12)));
      var res = el('div', 'hres'); res.appendChild(svgIcon(win ? ICON_WIN : ICON_LOSS));
      var meta = el('div', 'hmeta'); meta.appendChild(el('b', '', x.opponent || 'Игрок'));
      var when = x.time ? new Date(num(x.time) * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      var sm = el('small', '', when);
      if (x.reason_label) {
        var who = x.reason_by_loser === true ? (win ? 'Соперник: ' : 'Вы: ') : '';
        sm.appendChild(el('em', '', who + x.reason_label));
      }
      meta.appendChild(sm);
      var val = el('div', 'hval');
      var rp = (typeof x.rp === 'number') ? x.rp : null;
      val.appendChild(el('b', '', rp === null ? (win ? 'Победа' : 'Поражение') : (rp > 0 ? '+' : (rp < 0 ? '−' : '')) + fmt(Math.abs(rp)) + ' RP'));
      val.appendChild(el('small', '', 'ставка ' + fmt(num(x.stake))));
      row.appendChild(res); row.appendChild(meta); row.appendChild(val);
      body.appendChild(row);
    });
    if (ms.length >= 20) body.appendChild(el('p', 'note', 'Показаны последние 20 матчей.'));
  }

  // ───────────────────────────────────────────────
  //  Награды: витрина из ответа бота (d.rewards). Пусто — аккуратная заглушка.
  // ───────────────────────────────────────────────
  var LOCK_SVG = '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
  var DEFAULT_TIER_NAMES = ['Бронза', 'Серебро', 'Золото', 'Платина', 'Алмаз', 'Героик', 'Грандмастер'];

  function rewardRow(cls, i, badgeNode, name, prize) {
    var row = el('div', 'rw ' + cls); row.style.setProperty('--i', String(i));
    var badge = badgeNode;
    var meta = el('div', 'meta'); meta.appendChild(el('div', 'nm', name));
    meta.appendChild(prize ? el('div', 'prize', prize) : el('div', 'slot'));
    row.appendChild(badge); row.appendChild(meta);
    return row;
  }

  function renderRewards(d, tiers, cur) {
    var box = $('rewards-body'), pill = $('rw-pill'), dot = $('dot-rewards');
    box.textContent = '';
    var rw = (d && d.rewards) || {};
    var top = rw.top || {}, tr = rw.tiers || {};
    var placeKeys = Object.keys(top).map(Number).filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
    var hasAny = placeKeys.length > 0 || Object.keys(tr).length > 0;
    var names = (tiers && tiers.length) ? tiers.map(function (t) { return t.name; }) : DEFAULT_TIER_NAMES;

    if (!hasAny) {
      pill.textContent = 'Скоро'; pill.className = 'pill soon'; dot.style.display = '';
      box.appendChild(soon('Призы за ранги и места в топе', 'Награды за достижение рангов и за призовые места в конце сезона ещё не объявлены — слоты появятся здесь.',
        '<rect x="4" y="10" width="16" height="10" rx="1.5"/><rect x="3" y="7" width="18" height="3.5" rx="1"/><line x1="12" y1="7" x2="12" y2="20"/><path d="M12 7C9 7 7.5 5.8 7.5 4.6 7.5 3.3 9.3 3 10.5 4.2 11.4 5.1 12 7 12 7 12 7 12.6 5.1 13.5 4.2 14.7 3 16.5 3.3 16.5 4.6 16.5 5.8 15 7 12 7z"/>'));
      box.lastChild.style.marginBottom = '16px';
      names.forEach(function (n, i) {
        var badge = el('div', 'badge'); badge.appendChild(emb(i, 36));
        var row = rewardRow('', i, badge, n, null);
        var lock = el('div', 'lock'); lock.appendChild(svgIcon(LOCK_SVG)); row.appendChild(lock);
        box.appendChild(row);
      });
      return;
    }

    pill.textContent = d && d.season_number ? 'Сезон ' + d.season_number : 'Сезон'; pill.className = 'pill'; dot.style.display = 'none';

    if (placeKeys.length) {
      box.appendChild(el('div', 'sec-title', 'Призовые места'));
      placeKeys.forEach(function (pl, i) {
        var badge = el('div', 'badge num', String(pl));
        box.appendChild(rewardRow('pl' + (pl <= 3 ? ' pl' + pl : ''), i, badge, pl + '-е место', top[String(pl)]));
      });
    }

    var tierKeys = names.map(function (n, i) { return { n: n, i: i, prize: tr[n] }; }).filter(function (x) { return x.prize; });
    if (tierKeys.length) {
      var st = el('div', 'sec-title', 'Награды за ранги'); st.style.marginTop = '20px'; box.appendChild(st);
      tierKeys.reverse().forEach(function (x, j) {
        var reached = cur >= 0 && x.i <= cur;
        var badge = el('div', 'badge'); badge.appendChild(emb(x.i, 36));
        var row = rewardRow((x.i === cur ? 'cur' : (reached ? 'reached' : '')), j, badge, x.n, x.prize);
        var st2 = el('div', reached ? 'got' : 'lock');
        st2.appendChild(svgIcon(reached ? '<polyline points="4 12.5 9.5 18 20 6.5"/>' : LOCK_SVG));
        row.appendChild(st2);
        box.appendChild(row);
      });
    }
  }
  renderRewards(null, null, -1);

  function render(d) {
    var tiers = Array.isArray(d.all_tiers) ? d.all_tiers : [];
    var cur = tierIdx(tiers, d.tier_name);
    app.style.setProperty('--tier-rgb', tierRgb(cur));
    TIME.srv = num(d.server_time) || Date.now() / 1000; TIME.perf = performance.now();
    DATA = d;
    renderRank(d, tiers, cur);
    renderTop(d, tiers, cur);
    renderSeason(d);
    renderHistory(d);
    renderRewards(d, tiers, cur);
  }

  function fail(kind) {
    var title = 'Не удалось загрузить данные', text;
    if (kind === 'params') { title = 'Нет данных для подключения'; text = 'Открой рейтинг через кнопку в боте — в ссылке не хватает параметров.'; }
    else if (kind === 'unauthorized') { title = 'Доступ не подтверждён'; text = 'Открой рейтинг заново из бота, чтобы обновить ссылку.'; }
    else { text = 'Сервер не отвечает. Проверь соединение и попробуй ещё раз.'; }
    $('err-title').textContent = title;
    $('err-text').textContent = text;
    if (!loaded) {
      var season = $('season-text'); unsk(season); season.textContent = 'Ранговый сезон';
      var tn = $('tier-name'); unsk(tn); tn.classList.add('muted'); tn.textContent = 'Ранг недоступен';
    }
    app.dataset.state = 'error';
  }

  function load() {
    if (busy) return;
    if (!UID || !SECRET || !/^https?:\/\//i.test(API)) { fail('params'); return; }
    busy = true;
    app.dataset.state = 'loading';
    if (!loaded) {
      var tn = $('tier-name'); tn.classList.remove('muted'); tn.classList.add('sk'); tn.textContent = ''; tn.style.width = '170px';
    }
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    var url = API + '/casino/ranks?uid=' + encodeURIComponent(UID) + '&secret=' + encodeURIComponent(SECRET);

    fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (res.status === 401) { fail('unauthorized'); return; }
        if (!res.ok || !res.j || res.j.ok !== true) { fail('network'); return; }
        loaded = true;
        app.dataset.state = 'ready';
        render(res.j);
        requestAnimationFrame(movePill);
      })
      .catch(function () { fail('network'); })
      .then(function () { clearTimeout(timer); busy = false; });
  }

  $('retry').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
