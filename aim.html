   действовать от чужого имени нельзя. Страница открыта со старой кнопкой (без ключа) и бот отказал — подсказка «открой заново». */
(function () {

      var d = document.createElement('div'); d.id = '__tkStale';
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483647;'
        + 'padding:12px 14px;background:#151925;border:1px solid #ff8a00;color:#f6f6f7;'
        + 'font:600 14px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.6);text-align:center';
      d.textContent = 'Кнопка устарела после обновления бота. Закрой это окно и открой «🎯 Настройка оттяжки» заново из меню бота.';
      (document.body || document.documentElement).appendChild(d);
    } catch (e) {}
  }
  window.__tkStale = stale;
  var of = window.fetch;
  if (!of) return;
  window.fetch = function (u, o) {
    var act = false;
    try {
      if (typeof u === 'string' && u.indexOf('/casino/') >= 0) {
        o = o || {};
        act = String(o.method || 'GET').toUpperCase() !== 'GET';
        if (TK) {
          if (!act) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK);
          else if (typeof o.body === 'string' && o.body.charAt(0) === '{') {
            var b = JSON.parse(o.body);
            if (b && typeof b === 'object' && !Array.isArray(b) && !b.tk) { b.tk = TK; o.body = JSON.stringify(b); }
          }
        }
      }
    } catch (e) {}

    if (act && !TK) p.then(function (r) { if (r && r.status === 401) stale(); }, function () {});

})();

<style>
  /* v348: оформление в духе Free Fire: почти чёрный фон, оранжево-жёлтый, скошенные кнопки и углы панелей, прицел и мишени

     v351: «Настройка оттяжки» — инструмент, а не игра: свои настройки из игры, замер горизонтально с кнопки огня,
     проверка в тренировке; без рангов и очков. Отступы учитывают вырезы экрана и кнопки Telegram в полноэкранном режиме.
     v353: этап 1 — «Кнопка огня» (игрок ставит кнопку, как у себя в игре), этап 2 — свайпы от неё. Эффекты — искры, плавное
     появление, блик, волна от нажатия, конфетти — тоже только transform и opacity; при «уменьшить движение» их нет. */
  :root { color-scheme: dark;
          --bg: #06070a; --pan: #0f121a; --pan2: #151925; --ln: rgba(255,255,255,.07); --ln2: rgba(255,255,255,.13);

          --st: max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)); --ct: var(--tg-content-safe-area-inset-top, 0px);
          --sb: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
          --sl: max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px));
          --sr: max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; }
  body { margin: 0; min-height: 100vh; color: var(--tx); background: var(--bg); font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased;
         padding: calc(10px + var(--st) + var(--ct)) calc(14px + var(--sr)) calc(26px + var(--sb)) calc(14px + var(--sl)); }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: radial-gradient(130% 55% at 50% -12%, rgba(255,110,0,.24), transparent 62%),

  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  #app { max-width: 520px; margin: 0 auto; }

  /* шапка */

  /* герой */

  /* v351: свои настройки из игры */
  .og { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .oi { display: flex; flex-direction: column; min-width: 0; padding: 7px 10px 2px; background: #090b10; border: 1px solid var(--ln2);

  #hd-size::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff7a00 0 var(--p, 50%), #20263a var(--p, 50%)); }

  .hd-ctl .btn { padding: 11px 16px; font-size: 15px; }
  @media (orientation: portrait) {
    .hd-card { top: calc(44px + var(--st) + var(--ct)); width: calc(100% - 28px); }
    .hd-ctl.hi { top: calc(104px + var(--st) + var(--ct)); }
    .dc-map { top: calc(104px + var(--st) + var(--ct)); }
  }

  /* подсчёт */
  #calc { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center;
          background: rgba(6,7,10,.94); animation: vin .25s var(--ease) both; }
  #calc b { font: 18px var(--hud); letter-spacing: .08em; }
  #calc small { color: var(--tx2); }
  .spin { width: 64px; height: 72px; background: var(--grad); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
          animation: spn 1.1s linear infinite; }
  @keyframes spn { to { transform: rotate(360deg); } }
  /* v353: нет связи — замер не теряется */
  #calc.off .spin { display: none; }
  .calc-off { display: grid; gap: 4px; justify-items: center; margin-top: 8px; }
  .calc-off .btn { width: auto; padding: 13px 24px; }

  /* результат */
  .rk { padding: 16px 0 2px; text-align: center; }
  .rk-emb { position: relative; width: 92px; height: 102px; margin: 0 auto; background: var(--grad);
            clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); animation: emb .55s var(--ease) both; }
  .rk-emb i { position: absolute; inset: 5px; display: grid; place-items: center; font-style: normal; font-size: 40px;
              background: linear-gradient(180deg, #1b2030, #0d1017); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  @keyframes emb { from { opacity: 0; transform: scale(.6) rotate(-12deg); } to { opacity: 1; transform: none; } }
  .rk-n { margin-top: 10px; font: 22px var(--hud); letter-spacing: .06em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rk-s { margin-top: 2px; color: var(--tx2); font-size: 13.5px; }
  .rk-s b { font-family: var(--hud); font-weight: 400; color: var(--tx); }
  .rk-p { margin-top: 3px; color: var(--tx3); font-size: 12.5px; }
  .sl { margin-top: 13px; }
  .sl:first-child { margin-top: 2px; }
  .sl-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font: 600 13.5px var(--ui); color: var(--tx2); }
  .sl-h b { font: 19px var(--hud); color: var(--tx); }
  .sl-h small { margin-right: 6px; font: 700 11.5px var(--ui); }
  .sl-h .up { color: var(--grn); } .sl-h .dn { color: #ff9b6b; }
  .sl-h .was { color: var(--tx3); font: 600 12.5px var(--ui); }
  .sl-h .tagf { margin-left: 6px; padding: 1px 6px; font: 700 10px var(--ui); letter-spacing: .06em; color: var(--tx3); box-shadow: inset 0 0 0 1px var(--ln2);
                text-transform: uppercase; }
  .sl-t { position: relative; height: 8px; margin-top: 6px; overflow: hidden; background: #090b10;
          clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  .sl-t::before { content: ''; position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(6,7,10,.9) calc(10% - 2px) 10%); }
  .sl-t i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: var(--grad); transition: transform .9s var(--ease); }
  .sl-t u { position: absolute; z-index: 2; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; opacity: .8; }
  .fire { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 10px 12px; background: rgba(255,138,0,.07);
          border-left: 3px solid var(--or); font: 600 13.5px var(--ui); color: var(--tx2); }
  .fire b { font: 19px var(--hud); color: var(--tx); }
  .fire .was { margin-right: 6px; color: var(--tx3); font: 600 12.5px var(--ui); }
  .sent { margin-top: 10px; text-align: center; font-size: 12.5px; color: var(--grn); }
  .why { margin: 0; padding: 0; list-style: none; }
  .why li { position: relative; padding: 6px 0 6px 20px; color: var(--tx2); font-size: 13.5px; }
  .why li::before { content: ''; position: absolute; left: 3px; top: 12px; width: 8px; height: 8px; background: var(--or); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .why li.hl { color: var(--tx); }
  .why li.sum { color: var(--ye); font-weight: 600; }
  .tsteps { margin: 0; padding: 0 0 0 2px; list-style: none; counter-reset: ts; }
  .tsteps li { position: relative; padding: 5px 0 5px 28px; color: var(--tx2); font-size: 13.5px; counter-increment: ts; }
  .tsteps li::before { content: counter(ts); position: absolute; left: 0; top: 5px; width: 20px; height: 20px; display: grid; place-items: center;
                       font: 11px var(--hud); color: #170a00; background: var(--grad); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .fb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
  .fb button { padding: 12px 4px; border: 0; font: 600 13px var(--ui); color: var(--tx); background: #11151e; box-shadow: inset 0 0 0 1px var(--ln2);
               clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); transition: transform .14s var(--ease); }
  .fb button:active { transform: scale(.95); }
  .fb button.on { color: #170a00; background: var(--grad); box-shadow: none; font-weight: 800; }
  .fb button span { display: block; font-size: 19px; margin-bottom: 2px; }
  .tstat { margin-top: 10px; text-align: center; font: 600 13px var(--ui); color: var(--or2); }
  .tstat.done { color: var(--grn); }
  .hist { margin: 8px 0 0; padding: 0; list-style: none; }
  .hist li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 6px 2px; border-top: 1px solid var(--ln); font-size: 12.5px; color: var(--tx2); }
  .hist li span:last-child { margin-left: auto; white-space: nowrap; }
  .hist li b { font-family: var(--hud); font-weight: 400; color: var(--tx); }
  .ideal { text-align: center; background: linear-gradient(180deg, rgba(255,130,0,.16), rgba(255,130,0,.04)); }
  .ideal b { display: block; font: 17px var(--hud); letter-spacing: .05em; color: var(--ye); }
  .ideal p { margin: 4px 0 12px; color: var(--tx2); font-size: 13.5px; }
  .rescv { display: block; width: 100%; height: 150px; margin-top: 10px; background: #0a0c11; box-shadow: inset 0 0 0 1px var(--ln); }

  /* свайпы — экран со следом пальца */
  #swipe { background: radial-gradient(90% 70% at 50% 62%, #1b2131, #0a0c12 72%); }
  #sw-cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .sw-hint { position: absolute; left: 0; top: 0; width: 240px; text-align: center; pointer-events: none; transition: opacity .3s; }
  .sw-hint b { display: block; margin-top: 14px; font: 16px var(--hud); letter-spacing: .05em; }
  .sw-hint small { display: block; margin-top: 4px; color: var(--tx2); font-size: 13px; }
  .sw-arrow { position: relative; width: 40px; height: 100px; margin: -50px auto 0; animation: swa 1.6s var(--ease) infinite; }
  .sw-arrow::before { content: ''; position: absolute; left: 17px; top: 14px; bottom: 0; width: 6px; background: linear-gradient(0deg, rgba(255,90,0,0), #ffb000); }
  .sw-arrow::after { content: ''; position: absolute; left: 6px; top: 0; width: 28px; height: 22px; background: #ffc400; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  @keyframes swa { 0% { transform: translateY(26px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(-26px); opacity: 1; } 100% { transform: translateY(-34px); opacity: 0; } }
  .sw-live { position: absolute; left: 0; top: 0; z-index: 3; padding: 5px 10px; white-space: nowrap; pointer-events: none; opacity: 0;
             font: 13px var(--hud); color: #170a00; background: var(--grad); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
             transition: opacity .15s; }
  .sw-card { position: absolute; left: calc(14px + var(--sl)); right: calc(14px + var(--sr)); bottom: calc(18px + var(--sb)); z-index: 3; padding: 12px 14px;
             max-width: 460px; margin: 0 auto;
             background: rgba(15,18,26,.94); box-shadow: inset 0 0 0 1px rgba(255,150,0,.45); pointer-events: none; opacity: 0; transform: translateY(12px);
             clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
             transition: opacity .25s, transform .25s var(--ease); }
  .sw-card.show { opacity: 1; transform: none; }
  .sw-card b { display: block; font: 13px var(--hud); letter-spacing: .08em; color: var(--or2); }
  .sw-card.bad b { color: var(--red); }
  .sw-card p { margin: 4px 0 0; color: var(--tx2); font-size: 13px; }
  .sw-g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; text-align: center; }
  .sw-g span { display: block; font: 18px var(--hud); color: var(--tx); }
  .sw-g small { display: block; font: 700 9.5px var(--ui); letter-spacing: .07em; color: var(--tx3); text-transform: uppercase; }
  .dots { display: flex; gap: 5px; margin-top: 7px; }
  .dots i { width: 16px; height: 5px; background: rgba(255,255,255,.13); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); }
  .dots i.on { background: var(--grad); }

  /* v353: эффекты — только transform и opacity, чтобы ничего не тормозило */
  .fx { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .fx i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: #ffc400; box-shadow: 0 0 8px 2px rgba(255,140,0,.6);
          opacity: 0; will-change: transform, opacity; animation: spark var(--d, 9s) linear var(--dl, 0s) infinite; }
  @keyframes spark { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 12% { opacity: .85; } 75% { opacity: .45; }
                     100% { transform: translate3d(var(--sx, 0px), -105vh, 0); opacity: 0; } }
  body.ovl .fx { display: none; }
  .panel.rv { opacity: 0; transform: translate3d(0, 16px, 0); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .panel.rv.in { opacity: 1; transform: none; }
  .btn { overflow: hidden; }
  .btn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -45%; width: 32%; pointer-events: none; opacity: 0;
                background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); transform: translate3d(0, 0, 0) skewX(-18deg); }
  .btn.big:not([disabled])::after { animation: sheen 3.6s var(--ease) 1.2s infinite; }
  @keyframes sheen { 0% { opacity: 0; transform: translate3d(0, 0, 0) skewX(-18deg); } 6% { opacity: 1; }
                     38%, 100% { opacity: 0; transform: translate3d(520%, 0, 0) skewX(-18deg); } }
  .chip, .fb button, .last button, .qlist button { position: relative; overflow: hidden; }
  .chip.on { animation: pick .3s var(--ease); }
  @keyframes pick { 0% { transform: scale(.93); } 60% { transform: scale(1.03); } 100% { transform: none; } }
  .rp { position: absolute; z-index: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none;
        background: rgba(255,255,255,.32); transform: scale(0); animation: rp .55s var(--ease) forwards; }
  @keyframes rp { to { transform: scale(var(--rs, 18)); opacity: 0; } }
  .cf { position: fixed; left: 50%; top: 36%; z-index: 90; width: 0; height: 0; pointer-events: none; }
  .cf i { position: absolute; left: 0; top: 0; width: 8px; height: 12px; margin: -6px 0 0 -4px; border-radius: 2px; will-change: transform, opacity; }
  @media (prefers-reduced-motion: reduce) {
    .fx, .btn::after { display: none; }
    .panel.rv { opacity: 1; transform: none; transition: none; }
    .ovl, .stpop.show, .chip.on { animation: none; }
  }

  /* сообщения */
  .toast { position: fixed; left: 50%; bottom: calc(18px + var(--sb)); z-index: 80; max-width: 92%;
           transform: translate(-50%, 14px); opacity: 0; pointer-events: none; padding: 11px 16px; font: 600 13.5px var(--ui);
           background: #151925; box-shadow: inset 0 0 0 1px rgba(255,138,0,.5), 0 16px 34px rgba(0,0,0,.7); transition: opacity .24s, transform .24s var(--ease); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { box-shadow: inset 0 0 0 1px rgba(255,74,61,.6), 0 16px 34px rgba(0,0,0,.7); color: #ffd0cb; }
  #fatal { padding: 60px 18px; text-align: center; }
  #fatal b { display: block; font: 19px var(--hud); letter-spacing: .04em; margin-bottom: 10px; }
  #fatal span { color: var(--tx2); font-size: 14px; }
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="13" stroke="#ff9500" stroke-width="2.4"/><circle cx="20" cy="20" r="3" fill="#ffc400"/>
        <path d="M20 2v9M20 29v9M2 20h9M29 20h9" stroke="#ffc400" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div><b id="t-ttl">НАСТРОЙКА ОТТЯЖКИ</b><small id="t-sub">для Free Fire</small></div>

  </header>

  <!-- 1. телефон, как играешь, свои настройки -->
  <section id="s-prof" class="scr">
    <div class="hero">
      <div class="hero-k" id="h-k"></div>
      <h1 id="h-t"></h1>
      <p id="h-d"></p>

      <div id="q-box">
        <div class="srch"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
          <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
        <div id="q-list" class="qlist"></div>
      </div>
      <div id="q-sel" class="qsel" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffb000" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>
        <div class="qs-m"><b id="qs-n"></b><small id="qs-d"></small></div>
        <button type="button" id="qs-x"></button>
      </div>
      <button type="button" class="lnk" id="q-man"></button>
      <div id="man" hidden>
        <div class="lbl" id="l-dev"></div><div class="chips" id="c-dev"></div>
        <div class="lbl" id="l-scr"></div><div class="chips" id="c-scr"></div>
        <div class="lbl" id="l-mname"></div>
        <input id="m-name" class="inp" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="lbl" id="l-minch"></div>
        <input id="m-inch" class="inp" maxlength="5" inputmode="decimal" autocomplete="off">
      </div>
    </div>
    <div class="panel">
      <div class="ph"><span>02</span><b id="p2-t"></b></div>
      <div class="lbl" id="l-grip"></div><div class="chips" id="c-grip"></div>
      <div class="lbl" id="l-style"></div><div class="chips" id="c-style"></div>
      <div class="lbl" id="l-mode"></div><div class="chips" id="c-mode"></div>
    </div>
    <div class="panel">
      <div class="ph"><span>03</span><b id="p3-t"></b></div>
      <div class="chips" id="c-own"></div>
      <div id="own" hidden>
        <div class="og">
          <label class="oi"><span id="ol-gen"></span><input id="o-gen" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi"><span id="ol-red"></span><input id="o-red" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi"><span id="ol-x2"></span><input id="o-x2" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi"><span id="ol-x4"></span><input id="o-x4" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi"><span id="ol-snp"></span><input id="o-snp" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi"><span id="ol-free"></span><input id="o-free" inputmode="numeric" maxlength="3" autocomplete="off"></label>
          <label class="oi wide"><span id="ol-fire"></span><input id="o-fire" inputmode="numeric" maxlength="3" autocomplete="off"></label>
        </div>
        <div class="small" id="own-h" style="margin-top:8px"></div>

  <!-- 4. результат -->
  <section id="s-res" class="scr" hidden>
    <div class="rk">
      <div class="rk-emb"><i id="rk-i">🎯</i></div>
      <div class="rk-n" id="rk-n"></div>
      <div class="rk-s" id="rk-s"></div>
      <div class="rk-p" id="rk-p"></div>

<!-- v353: этап 1 «Кнопка огня»: игрок ставит кнопку туда, где она у него в игре, и подбирает размер -->
<div id="hud" class="ovl" hidden>

  <i class="dc dc-map"></i><i class="dc dc-joy"></i><i class="dc dc-b dc-b1"></i><i class="dc dc-b dc-b2"></i><i class="dc dc-b dc-b3"></i>
  <div class="fbtn need" id="hd-fire"><svg viewBox="0 0 12 18"><path d="M6 0c1.6 1.5 2.6 3.3 2.6 5.6V13H3.4V5.6C3.4 3.3 4.4 1.5 6 0z" fill="#ffd23f"/><path d="M2.6 14h6.8v4H2.6z" fill="#ff9500"/></svg></div>
  <div class="hud"><div class="hl"><b id="hd-t"></b></div></div>
  <div class="hd-card" id="hd-card"><b id="hd-h1"></b><small id="hd-h2"></small></div>
  <div class="hd-ctl" id="hd-ctl">
    <div class="hd-sz"><span id="hd-sl"></span><b id="hd-sv"></b></div>
    <div class="hd-row"><button type="button" class="hd-pm" id="hd-minus">−</button><input type="range" id="hd-size" min="10" max="200" step="1" value="50"><button type="button" class="hd-pm" id="hd-plus">+</button></div>
    <button type="button" class="btn" id="hd-ok"></button>
  </div>
  <div class="stpop" id="hd-pop"></div>
  <button type="button" class="aquit" id="hd-quit">✕</button>
</div>

  } catch (_) {}
}, true);

    if (fx * fx + fy * fy > rr * rr) { W.miss++; nudgeFire($('sw-fire')); e.preventDefault(); return; }       // v351: с кнопки огня
    W.ptr = e.pointerId;
    try { swEl.setPointerCapture(e.pointerId); } catch (_) {}
    W.cur = { pts: [{ t: e.timeStamp || now(), x: e.clientX, y: e.clientY }], so: Math.sqrt(fx * fx + fy * fy) / Math.max(1, W.fire.r) }; W.last = null;
    $('sw-hint').style.opacity = '0'; $('sw-card').classList.remove('show');
    e.preventDefault(); swReq();
  });
  swEl.addEventListener('pointermove', function (e) {
    if (W.ptr === null || e.pointerId !== W.ptr || !W.cur) return;
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) W.cur.pts.push({ t: evs[i].timeStamp || now(), x: evs[i].clientX, y: evs[i].clientY });
    swLive(e.clientX, e.clientY); swReq(); e.preventDefault();
  });
  function swUp(e) { if (W.ptr === null || e.pointerId !== W.ptr) return; W.ptr = null; swFinish(); }
  swEl.addEventListener('pointerup', swUp);
  swEl.addEventListener('pointercancel', swUp);
  $('sw-quit').addEventListener('click', function (e) { e.stopPropagation(); quitSwipe(); });

  // ── результат ───────────────────────────────────────────────────────
  // v351: всё одним запросом; плюс ориентация и размер экрана; v352 — без фликов, с промахами мимо кнопки огня;
  // v353 — где кнопка огня и какого размера, оттяжки по врагам больше нет
  function finishTune() {
    fullOff();
    var b = body();
    b.flick = []; b.drag = []; b.miss = W.miss;
    b.pxcm = Math.round(W.pxcm * 100) / 100; b.orient = S.orient || (isLand() ? 'land' : 'port');
    b.sf = Math.round(sfac() * 1000) / 1000;

              room: Math.round(Math.max(0, W.fire.y - inset('top'))) };
    b.swipes = W.list.map(function (m) { return { len: r1(m.len), path: r1(m.path), dur: Math.round(m.dur), vmax: Math.round(m.vmax * 1000) / 1000, dx: r1(m.dx), dy: r1(m.dy),

  }
  // v353: нет интернета — замер остаётся на телефоне и уходит сам, как только связь вернётся
  function pendSave(b) { S.pending = { t: Date.now(), b: b }; lsSet('aim_pend_' + UID, S.pending); }
  function pendShow() {
    var p = lsGet('aim_pend_' + UID);

  function calcOff() {
    $('calc').hidden = false; $('calc').classList.add('off');

  function sendTune(b) {
    if (S.busy) return;

    $('calc').hidden = false; $('calc').classList.remove('off'); $('calc-off').hidden = true;
    $('calc-t').textContent = L.calc_t; $('calc-d').textContent = L.calc_d;
    var t0 = now(), copy = JSON.parse(JSON.stringify(b));
    post('/casino/aim/tune', b).then(function (res) {
      setTimeout(function () {
        S.busy = false;
        if (!res.j || !res.j.ok) {
          if (!res.status || res.status >= 500) { pendSave(copy); calcOff(); return; }
          $('calc').hidden = true; lsDel('aim_pend_' + UID); pendShow();
          toast(errText(res), true); haptic('error'); show('prof'); return;
        }
        lsDel('aim_pend_' + UID); lsDel('aim_draft_' + UID); pendShow();
        $('calc').hidden = true; S.last = res.j; renderLast();
        renderRes(res.j, true); show('res'); haptic('success');

    }).catch(function () { S.busy = false; pendSave(copy); calcOff(); });
  }
  var KEYS = ['gen', 'red', 'x2', 'x4', 'snp', 'free'];
  function renderRes(r, fresh) {
    S.res = r;
    var tune = r.kind === 'tune', st = r.st || {}, t = r.tune || {}, cur = !!(r.prof && r.prof.cur), filled = r.filled || [];
    // шапка: что это — настройка (и на каком она шаге) или прошлый тест
    $('rk-i').textContent = tune ? (t.done ? '✅' : '🎯') : ((r.rank && r.rank.ico) || '🎯');

    $('rk-s').innerHTML = tune ? (t.done ? esc(L.res_sd) : t.n ? tpl(L.res_s, { n: t.n, p: pct(t.step) }) : esc(L.res_s0))

      var right = '';

      else if (own && d) right = '<small class="' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</small><small class="was">' + esc(tpl(L.was, { v: b })) + '</small> ';
      else if (own) right = '<small class="was">' + esc(L.same) + '</small> ';
      else if (!tune && d) right = '<small class="' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</small>';
      var tick = d && (own || !tune) ? '<u style="left:' + (Math.min(1, b / max) * 100).toFixed(1) + '%"></u>' : '';
      return '<div class="sl"><div class="sl-h"><span>' + esc(L.labels[k]) + '</span><span>' + right + '<b data-a="' + (own ? b : v) + '">' + v + '</b></span></div>'
        + '<div class="sl-t"><i data-v="' + Math.min(1, v / max) + '"></i>' + tick + '</div></div>';

    var fv = r.vals.fire, fb0 = r.base ? r.base.fire : fv, fown = tune && ((cur && filled.indexOf('fire') < 0) || !!st.hsize);   // v353: кнопку поставил сам

    // проверка в тренировке

    $('tsteps').hidden = !tune;
    var fbs = $('fb').querySelectorAll('button');
    for (var i = 0; i < fbs.length; i++) fbs[i].classList.toggle('on', fbs[i].getAttribute('data-fb') === r.fb);
    $('tstat').className = 'tstat' + (t.done ? ' done' : '');
    var lim = tune && !t.done && t.lo && t.hi, pp = { p: pct(t.step), lo: t.lo, hi: t.hi };          // v353: вилка
    $('tstat').textContent = tune ? (t.done ? L.tdone : lim ? (t.close ? tpl(L.tclose, pp) : st.mode === 'both' ? tpl(L.tlim2, pp) : tpl(L.tlim, pp))
      : tpl(L.tnext, pp)) : L.told;
    $('hist').innerHTML = (tune ? (t.hist || []) : []).map(function (h, n) {
      var what = h.v === 'ok' ? L.h_ok : (h.v === 'up' ? L.h_up : L.h_down) + ' · ' + (h.pct > 0 ? '+' : '−') + pct(h.pct) + '%';
      return '<li><span>' + esc(tpl(L.h_n, { n: n + 1 })) + ' — ' + esc(what) + '</span><span>' + esc(L.gen) + ' <b>' + h.gen + '</b> · '
        + esc(L.red) + ' <b>' + h.red + '</b></span></li>';
    }).join('');
    // что показал замер
    var diag = r.diag || [], cv = $('res-cv'), paths = fresh ? S.paths : null;
    $('diag').innerHTML = diag.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('');
    $('diag-p').hidden = !diag.length && !(paths && paths.length);
    cv.hidden = !(paths && paths.length);
    if (paths && paths.length) requestAnimationFrame(function () { drawPaths(cv, paths); });
    // почему так: ярче — то, что показали игра и замер (у настройки — до «Итога» включительно)
    var why = r.why || [], hl = 2, sum = -1;
    for (var wi = 0; wi < why.length; wi++) if (/^(Итог|Result|Итог трёх этапов|All three stages)/.test(why[wi])) { hl = wi + 1; sum = wi; break; }
    $('why').innerHTML = why.map(function (w, n) { return '<li class="' + (n < hl ? 'hl' : '') + (n === sum ? ' sum' : '') + '">' + esc(w) + '</li>'; }).join('');
    $('id-d').innerHTML = tpl(L.id_d, { p: S.price });
    // полоски заполняются плавно (только transform); v353: цифры «бегут» от того, что было, к новым
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var is = $('sl').querySelectorAll('.sl-t i');
        for (var j = 0; j < is.length; j++) is[j].style.transform = 'scaleX(' + is[j].getAttribute('data-v') + ')';
      });
    });
    if (fresh && !RM) countUp($('sl').querySelectorAll('b[data-a]'));
  }
  function countUp(els) {
    var list = [], t0 = now(), ms = 700;
    for (var i = 0; i < els.length; i++) {
      var to = Number(els[i].textContent), from = Number(els[i].getAttribute('data-a'));
      if (to === to && from === from && from !== to) list.push({ el: els[i], a: from, b: to });
    }
    if (!list.length) return;
    setTimeout(function () { list.forEach(function (x) { x.el.textContent = String(x.b); }); }, ms + 150);   // кадры не идут (фон) — всё равно точные числа
    (function tick() {
      var k = Math.min(1, (now() - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      list.forEach(function (x) { x.el.textContent = String(Math.round(x.a + (x.b - x.a) * e)); });
      if (k < 1) requestAnimationFrame(tick);
    })();
  }
  // v353: «В голову!» — конфетти (только transform и opacity, сами исчезают)
  function confetti() {
    if (RM) return;
    var box = document.createElement('div'), cols = ['#ff5a00', '#ff9500', '#ffd84a', '#5be38f', '#ffffff'];
    box.className = 'cf'; document.body.appendChild(box);
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 200;
      var dx = Math.cos(a) * d, up = -60 - Math.random() * 160, rot = (Math.random() * 2 - 1) * 540;
      p.style.background = cols[i % cols.length]; box.appendChild(p);
      if (p.animate) p.animate([{ transform: 'translate3d(0,0,0) rotate(0deg)', opacity: 1 },
                                { transform: 'translate3d(' + (dx * 0.6).toFixed(0) + 'px,' + up.toFixed(0) + 'px,0) rotate(' + (rot / 2).toFixed(0) + 'deg)', opacity: 1, offset: 0.4 },
                                { transform: 'translate3d(' + dx.toFixed(0) + 'px,' + (up + 260 + Math.random() * 120).toFixed(0) + 'px,0) rotate(' + rot.toFixed(0) + 'deg)', opacity: 0 }],
                               { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    }
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 1900);
  }
  // v353: искры на фоне, плавное появление панелей, волна от нажатия
  function fxInit() {
    if (RM) return;
    var h = '';
    for (var i = 0; i < 14; i++) {
      h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;--d:' + (7 + Math.random() * 7).toFixed(1) + 's;--dl:-' + (Math.random() * 12).toFixed(1)
        + 's;--sx:' + ((Math.random() * 2 - 1) * 60).toFixed(0) + 'px"></i>';
    }
    $('fx').innerHTML = h;
  }
  function revealInit() {
    var ps = document.querySelectorAll('#app .panel');
    if (RM || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.06 });
    for (var i = 0; i < ps.length; i++) { ps[i].classList.add('rv'); ps[i].style.transitionDelay = (Math.min(i, 4) * 0.06) + 's'; io.observe(ps[i]); }

  document.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return;

  }, true);
  function copyText(t) {

      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

    if (!$('calc').hidden && $('calc').classList.contains('off') && S.pending) sendTune(S.pending.b);

    if (!S.res) return;

  });
  $('fb').addEventListener('click', function (e) {
    var b = e.target.closest('[data-fb]');
    if (!b || S.busy) return;

      else toast(kind === 'up' ? L.fb_up7 : kind === 'down' ? L.fb_down7 : L.fb_ok7);

  });
  $('ideal').addEventListener('click', function () {
    try { if (tg && tg.openTelegramLink) { tg.openTelegramLink(S.orderUrl); return; } } catch (e) {}
    window.open(S.orderUrl, '_blank');
  });
  $('again').addEventListener('click', function () { begin(); });
  $('toprof').addEventListener('click', function () { show('prof'); });
  try { if (window.matchMedia) { var mq = window.matchMedia('(orientation: landscape)'); if (mq.addEventListener) mq.addEventListener('change', rotCheck); } } catch (e) {}

  // для проверки в браузере (только чтение)
  window.__aimDbg = {
    hud: function () { var g = H.g || {}; return { open: !$('hud').hidden, x: g.x, y: g.y, r: g.r, size: S.hud.size, fx: S.hud.x, fy: S.hud.y,
                                                   top: $('hd-ctl').classList.contains('hi') }; },
    view: function () { return { view: S.view, hud: !$('hud').hidden, swipe: !$('swipe').hidden, calc: !$('calc').hidden,
                                 off: $('calc').classList.contains('off') && !$('calc').hidden }; },
    swipe: function () { return { open: !$('swipe').hidden, n: W.n, got: W.list.length, pxcm: W.pxcm, done: W.done, fx: W.fire.x, fy: W.fire.y, fr: W.fire.r }; },
    px: function () { return { pxcm: pxPerCm(), model: modelPxcm() }; },
    miss: function () { return { swipe: W.miss }; },
    ls: function () { return { ph: !!lsGet('aim_ph'), draft: lsGet('aim_draft_' + UID), pend: !!lsGet('aim_pend_' + UID), hud: lsGet('aim_hud_' + UID) }; },
    res: function () { return { swipes: W.list.length, sf: sfac(), orient: S.orient, hud: S.hud, phHash: S.phHash }; }
  };

  // ── старт страницы ──────────────────────────────────────────────────
  texts(); syncChips(); syncGo(); fxInit(); revealInit();
  if (!UID || !API) {
    $('s-prof').hidden = true; $('fatal').hidden = false;
    $('fatal-t').textContent = L.none_t; $('fatal-d').textContent = L.none_d;
    return;
  }

  var phc = lsGet('aim_ph');

})();
