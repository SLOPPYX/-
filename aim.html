        if (!res.j || !res.j.ok) { toast(errText(res), true); haptic('error'); show('prof'); return; }
        S.last = res.j; renderLast();
        renderRes(res.j, true); show('res'); haptic('success');
      }, Math.max(0, 900 - (now() - t0)));
    }).catch(function () { $('calc').hidden = true; toast(L.e_net, true); show('prof'); });
  }
  // рисунок всех свайпов на результате: каждый — от одной точки внизу, в одном масштабе
  function drawPaths(cv, paths) {
    var dpr = Math.min(3, window.devicePixelRatio || 1), w = cv.clientWidth || 300, h = cv.clientHeight || 150;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    var maxd = 1;
    paths.forEach(function (p) { p.forEach(function (q) { maxd = Math.max(maxd, Math.abs(q.x - p[0].x), Math.abs(q.y - p[0].y)); }); });
    var k = (h - 26) / maxd, ox = w / 2, oy = h - 12;
    c.save(); c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1;
    for (var gx = 0; gx < w; gx += 24) { c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, h); c.stroke(); }
    for (var gy = h; gy > 0; gy -= 24) { c.beginPath(); c.moveTo(0, gy); c.lineTo(w, gy); c.stroke(); }
    c.restore();
    paths.forEach(function (p, i) {
      stroke(c, p.map(function (q) { return { x: ox + (q.x - p[0].x) * k, y: oy + (q.y - p[0].y) * k }; }), 0.55 + 0.09 * i, 8, 5);
    });
  }
  var swEl = $('swipe');
  swEl.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('#sw-quit')) return;
    if (W.done || W.ptr !== null || e.isPrimary === false) return;
    W.ptr = e.pointerId;
    try { swEl.setPointerCapture(e.pointerId); } catch (_) {}
    W.cur = { pts: [{ t: e.timeStamp || now(), x: e.clientX, y: e.clientY }] }; W.last = null;
    $('sw-hint').style.opacity = '0'; $('sw-card').classList.remove('show');
    e.preventDefault(); swReq();
  });
  swEl.addEventListener('pointermove', function (e) {
    if (W.ptr === null || e.pointerId !== W.ptr || !W.cur) return;
    var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (!evs.length) evs = [e];
    for (var i = 0; i < evs.length; i++) W.cur.pts.push({ t: evs[i].timeStamp || now(), x: evs[i].clientX, y: evs[i].clientY });
    swLive(e.clientX, e.clientY); swReq(); e.preventDefault();
  });
  function swUp(e) { if (W.ptr === null || e.pointerId !== W.ptr) return; W.ptr = null; swFinish(); }
  swEl.addEventListener('pointerup', swUp);
  swEl.addEventListener('pointercancel', swUp);
  $('sw-quit').addEventListener('click', function (e) { e.stopPropagation(); quitSwipe(); });

  // ── результат ───────────────────────────────────────────────────────
  function finish() {
    $('calc').hidden = false;
    var t0 = now(), b = body();
    b.flick = A.res.flick; b.drag = A.res.drag;
    post('/casino/aim/result', b).then(function (res) {
      var wait = Math.max(0, 900 - (now() - t0));
      setTimeout(function () {
        $('calc').hidden = true;
        if (!res.j || !res.j.ok) { toast(errText(res), true); haptic('error'); show('prof'); return; }
        S.last = res.j; renderLast();
        renderRes(res.j, true); show('res'); haptic('success');
      }, wait);
    }).catch(function () { $('calc').hidden = true; toast(L.e_net, true); show('prof'); });
  }
  var KEYS = ['gen', 'red', 'x2', 'x4', 'snp', 'free'];
  function dec(v, n) { return Number(v || 0).toFixed(n).replace('.', LANG === 'ru' ? ',' : '.'); }
  function renderRes(r, fresh) {
    S.res = r;
    var st = r.st || {}, sw = r.kind === 'swipe';
    S.mode = sw ? 'swipe' : 'aim';
    $('rk-i').textContent = (r.rank && r.rank.ico) || '🎯';
    $('rk-n').textContent = (r.rank && r.rank.name) || '';
    $('rk-n').classList.toggle('sm', sw);
    $('rk-s').innerHTML = sw ? esc(tpl(L.res_sw, { n: st.n || 0 })) : tpl(L.pts, { s: String(st.score || 0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') });
    $('rk-p').textContent = r.summary || '';
    $('stats').innerHTML = sw
      ? '<div><b>' + dec(st.len, 1) + '</b><small>' + esc(L.st_len) + '</small></div>'
        + '<div><b>' + Math.round(st.v || 0) + '</b><small>' + esc(L.st_spd) + '</small></div>'
        + '<div><b>' + Math.round((st.straight || 0) * 100) + '%</b><small>' + esc(L.st_str) + '</small></div>'
      : '<div><b>' + (st.hits || 0) + '/' + (st.total || 0) + '</b><small>' + esc(L.st_hit) + '</small></div>'
        + '<div><b>' + (st.heads || 0) + '</b><small>' + esc(L.st_head) + '</small></div>'
        + '<div><b>' + dec((st.react || 0) / 1000, 2) + '</b><small>' + esc(L.st_rt) + '</small></div>';
    var cv = $('res-cv'), paths = sw && fresh ? S.paths : null;
    cv.hidden = !(paths && paths.length);
    if (paths && paths.length) requestAnimationFrame(function () { drawPaths(cv, paths); });
    $('sl').innerHTML = KEYS.map(function (k) {
      var v = r.vals[k], b = r.base ? r.base[k] : v, d = v - b, max = 200;
      return '<div class="sl"><div class="sl-h"><span>' + esc(L.labels[k]) + '</span><span>'
        + (d ? '<small class="' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</small>' : '')
        + '<b>' + v + '</b></span></div><div class="sl-t"><i data-v="' + Math.min(1, v / max) + '"></i>'
        + (d ? '<u style="left:' + (Math.min(1, b / max) * 100).toFixed(1) + '%"></u>' : '') + '</div></div>';
    }).join('');
    $('fire').innerHTML = '<span>' + esc(L.fire) + '</span><b>' + r.vals.fire + '%</b>';
    $('why').innerHTML = (r.why || []).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('');
    $('sent').textContent = fresh ? L.sent : L.sent_last;
    $('id-d').innerHTML = tpl(L.id_d, { p: S.price });
    var fbs = $('fb').querySelectorAll('button');
    for (var i = 0; i < fbs.length; i++) fbs[i].classList.toggle('on', fbs[i].getAttribute('data-fb') === r.fb);
    // полоски заполняются плавно (только transform)
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var is = $('sl').querySelectorAll('.sl-t i');
        for (var j = 0; j < is.length; j++) is[j].style.transform = 'scaleX(' + is[j].getAttribute('data-v') + ')';
      });
    });
  }
  function copyText(t) {
    function fallback() {
      try {
        var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // ── события ─────────────────────────────────────────────────────────
  $('q').addEventListener('input', renderList);
  $('q-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ph]'); if (b) { pickPhone(b.getAttribute('data-ph')); return; }
    if (e.target.closest('[data-use]')) { var q = $('q').value.trim().slice(0, 40); setManual(true); $('m-name').value = q; haptic(null, 'light'); }
  });
  $('qs-x').addEventListener('click', function () { unpick(); $('q').value = ''; renderList(); try { $('q').focus(); } catch (e) {} });
  $('q-man').addEventListener('click', function () { setManual(!S.manual); });
  document.addEventListener('click', function (e) {
    var c = e.target.closest('.chip[data-k]');
    if (!c) return;
    S.prof[c.getAttribute('data-k')] = Number(c.getAttribute('data-v'));
    syncChips(); syncGo(); haptic();
  });
  $('go').addEventListener('click', function () { begin('aim'); });
  $('go2').addEventListener('click', function () { begin('swipe'); });
  $('br-go').addEventListener('click', function () { if (A.kind === 'swipe') startSwipe(); else startArena(A.kind); });
  $('last').addEventListener('click', function (e) { if (e.target.closest('#last-b') && S.last) { renderRes(S.last, false); show('res'); } });
  $('copy').addEventListener('click', function () {
    if (!S.res) return;
    var v = S.res.vals;
    copyText(tpl(L.copyline, v)).then(function (ok) { toast(ok ? L.copied : tpl(L.copyline, v)); haptic(ok ? 'success' : null); });
  });
  $('fb').addEventListener('click', function (e) {
    var b = e.target.closest('[data-fb]');
    if (!b || S.busy) return;
    var kind = b.getAttribute('data-fb');
    S.busy = true;
    post('/casino/aim/feedback', { kind: kind }).then(function (res) {
      S.busy = false;
      if (!res.j || !res.j.ok) { toast(errText(res), true); return; }
      S.last = res.j; renderLast(); renderRes(res.j, true);
      toast(kind === 'up' ? L.fb_up : kind === 'down' ? L.fb_down : L.fb_ok); haptic('success');
    }).catch(function () { S.busy = false; toast(L.e_net, true); });
  });
  $('ideal').addEventListener('click', function () {
    try { if (tg && tg.openTelegramLink) { tg.openTelegramLink(S.orderUrl); return; } } catch (e) {}
    window.open(S.orderUrl, '_blank');
  });
  $('again').addEventListener('click', function () { begin(S.mode); });
  $('toprof').addEventListener('click', function () { show('prof'); });

  // для проверки в браузере: где сейчас цель и с какой «скоростью» двигается прицел (только чтение)
  window.__aimDbg = {
    need: function () { return A.tgt ? { dx: A.tgt.x - A.cam.x, dy: A.tgt.y - A.cam.y, k: A.tgt.k, cx: A.cx, cy: A.cy,
                                           g: A.kind === 'flick' ? S.gain.flick : S.gain.drag, kind: A.kind, i: A.i, n: A.n, shot: A.shot } : null; },
    view: function () { return { view: S.view, arena: !$('arena').hidden, swipe: !$('swipe').hidden, calc: !$('calc').hidden }; },
    swipe: function () { return { open: !$('swipe').hidden, n: W.n, got: W.list.length, pxcm: W.pxcm, done: W.done }; }
  };

  // ── старт страницы ──────────────────────────────────────────────────
  texts(); syncGo();
  if (!UID || !API) {
    $('s-prof').hidden = true; $('fatal').hidden = false;
    $('fatal-t').textContent = L.none_t; $('fatal-d').textContent = L.none_d;
    return;
  }
  renderList();
  getState().then(function (res) {
    var j = res && res.j;
    if (!j || !j.ok) {
      if (res && res.status === 401) toast(L.e_auth, true); else toast(L.e_ph, true);
      setManual(true); return;
    }
    S.phones = j.phones || []; buildIdx();
    if (j.rounds) S.rounds = j.rounds;
    if (j.order_url) S.orderUrl = j.order_url;
    if (j.ideal_price) S.price = j.ideal_price;
    if (j.swipes) S.swipes = j.swipes;
    if (j.diag) for (var dk in j.diag) S.diag[Number(dk)] = Number(j.diag[dk]);
    S.last = j.last || null; renderLast(); prefill(S.last); renderList();
  }).catch(function () { toast(L.e_ph, true); setManual(true); });
})();
</script>
