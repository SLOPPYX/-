   действовать от чужого имени нельзя. Страница открыта со старой кнопкой (без ключа) и бот отказал — подсказка «открой заново». */
(function () {

      d.textContent = 'Кнопка устарела после обновления бота. Закрой это окно и открой «🎯 Настройка оттяжки» заново из меню бота.';
      (document.body || document.documentElement).appendChild(d);

  }
  window.__tkStale = stale;

  if (!of) return;
  window.fetch = function (u, o) {
    var act = false;
    try {
      if (typeof u === 'string' && u.indexOf('/casino/') >= 0) {
        o = o || {};
        act = String(o.method || 'GET').toUpperCase() !== 'GET';
        if (TK) {
          if (!act) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(TK);
          else if (typeof o.body === 'string' && o.body.charAt(0) === '{') {
            var b = JSON.parse(o.body);

<style>
  /* v348: оформление в духе Free Fire: почти чёрный фон, оранжево-жёлтый, скошенные кнопки и углы панелей, прицел и мишени

     v351: «Настройка оттяжки» — инструмент, а не игра: свои настройки из игры, замер горизонтально с кнопки огня,
     проверка в тренировке; без рангов и очков. Отступы учитывают вырезы экрана и кнопки Telegram в полноэкранном режиме.
     v353: этап 1 — «Кнопка огня» (игрок ставит кнопку, как у себя в игре), этап 2 — свайпы от неё. Эффекты — искры, плавное
     появление, блик, волна от нажатия, конфетти — тоже только transform и opacity; при «уменьшить движение» их нет.
     v354: этап 2 «как в игре» — полигон, манекен, прицел и стрельба; камера едет с сенсой игрока. Анкета — шаги и живые панели. */
  :root { color-scheme: dark;
          --bg: #06070a; --pan: #0f121a; --pan2: #151925; --ln: rgba(255,255,255,.07); --ln2: rgba(255,255,255,.13);
          --or: #ff8a00; --or2: #ffb000; --ye: #ffd84a; --red: #ff4a3d; --grn: #5be38f;

          --grad: linear-gradient(90deg, #ff5a00 0%, #ff9500 55%, #ffc400 100%);
          --hud: 'Russo One', 'Rubik', system-ui, sans-serif; --ui: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
          --ease: cubic-bezier(.2,.7,.2,1);
          --st: max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px)); --ct: var(--tg-content-safe-area-inset-top, 0px);
          --sb: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
          --sl: max(env(safe-area-inset-left, 0px), var(--tg-safe-area-inset-left, 0px));
          --sr: max(env(safe-area-inset-right, 0px), var(--tg-safe-area-inset-right, 0px)); }

         padding: calc(10px + var(--st) + var(--ct)) calc(14px + var(--sr)) calc(26px + var(--sb)) calc(14px + var(--sl)); }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: radial-gradient(130% 55% at 50% -12%, rgba(255,110,0,.24), transparent 62%),
                             repeating-linear-gradient(135deg, rgba(255,255,255,.017) 0 2px, transparent 2px 12px); }

  #app { max-width: 520px; margin: 0 auto; }

  .panel .scan { display: none; position: absolute; left: 0; top: 0; width: 45%; height: 2px; pointer-events: none;

  .lbl { margin: 12px 0 7px; font: 700 11px var(--ui); letter-spacing: .12em; color: var(--tx3); text-transform: uppercase; }

  /* v351: свои настройки из игры */
  .og { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }

    if (RM || !('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.06 });
    for (var i = 0; i < ps.length; i++) { ps[i].classList.add('rv'); ps[i].style.transitionDelay = (Math.min(i, 4) * 0.06) + 's'; io.observe(ps[i]); }
  }
  document.addEventListener('pointerdown', function (e) {
    if (RM || !e.target || !e.target.closest) return;
    var b = e.target.closest('.btn, .chip, .fb button, .last button, .qlist button');
    if (!b || b.disabled) return;
    var r = b.getBoundingClientRect(), s = document.createElement('span');
    s.className = 'rp'; s.style.left = (e.clientX - r.left) + 'px'; s.style.top = (e.clientY - r.top) + 'px';
    s.style.setProperty('--rs', String(Math.ceil(Math.max(r.width, r.height) / 7)));
    b.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 600);
  }, true);
  function copyText(t) {
    function fallback() {
      try {
        var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // ── события ─────────────────────────────────────────────────────────
  $('q').addEventListener('input', renderList);
  $('q-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ph]'); if (b) { pickPhone(b.getAttribute('data-ph')); return; }
    if (e.target.closest('[data-use]')) { var q = $('q').value.trim().slice(0, 40); setManual(true); $('m-name').value = q; haptic(null, 'light'); }
  });
  $('qs-x').addEventListener('click', function () { unpick(); $('q').value = ''; renderList(); try { $('q').focus(); } catch (e) {} });
  $('q-man').addEventListener('click', function () { setManual(!S.manual); });
  $('m-inch').addEventListener('input', function () {
    var v = manInch();
    if (v) { S.prof.scr = inchClass(v); syncChips(); }
    syncGo(); draftSave();
  });
  $('m-name').addEventListener('input', draftSave);
  OWN_KEYS.forEach(function (k) {
    $('o-' + k).addEventListener('input', function () { var s = this.value.replace(/\D/g, '').slice(0, 3); if (s !== this.value) this.value = s; syncGo(); draftSave(); });
  });
  $('own-last').addEventListener('click', function () { if (S.last && S.last.vals) { ownFill(S.last.vals); syncGo(); haptic(null, 'light'); } });
  document.addEventListener('click', function (e) {
    var c = e.target.closest('.chip[data-k]');
    if (!c) return;
    S.prof[c.getAttribute('data-k')] = Number(c.getAttribute('data-v'));
    syncChips(); syncGo(); haptic(); draftSave();
  });
  $('go').addEventListener('click', function () { begin(); });
  $('rot-skip').addEventListener('click', function () {
    var f = S.rotThen; S.rotThen = null; S.orient = 'port';
    if (f) f();
  });
  $('pend-b').addEventListener('click', function () { if (S.pending && S.pending.b) sendTune(S.pending.b); });
  $('calc-retry').addEventListener('click', function () { if (S.pending && S.pending.b) sendTune(S.pending.b); });
  $('calc-exit').addEventListener('click', function () { $('calc').hidden = true; pendShow(); show('prof'); });
  window.addEventListener('online', function () {          // связь вернулась — отправляем сам
    if (!$('calc').hidden && $('calc').classList.contains('off') && S.pending) sendTune(S.pending.b);
  });
  $('last').addEventListener('click', function (e) { if (e.target.closest('#last-b') && S.last) { renderRes(S.last, false); show('res'); } });
  $('copy').addEventListener('click', function () {
    if (!S.res) return;
    var v = S.res.vals;
    copyText(tpl(L.copyline, v)).then(function (ok) { toast(ok ? L.copied : tpl(L.copyline, v)); haptic(ok ? 'success' : null); });
  });
  $('fb').addEventListener('click', function (e) {
    var b = e.target.closest('[data-fb]');
    if (!b || S.busy) return;
    var kind = b.getAttribute('data-fb');
    S.busy = true;
    post('/casino/aim/feedback', { kind: kind }).then(function (res) {
      S.busy = false;
      if (!res.j || !res.j.ok) { toast(errText(res), true); return; }
      S.last = res.j; renderLast(); renderRes(res.j, true);
      var t = res.j.tune, h = t && t.hist && t.hist[t.hist.length - 1];
      if (res.j.kind === 'tune') toast(kind === 'ok' ? L.fb_ok : tpl(kind === 'up' ? L.fb_up : L.fb_down, { n: t.n, p: pct(h ? h.pct : 0) }) + (t.close ? L.fb_close : ''));
      else toast(kind === 'up' ? L.fb_up7 : kind === 'down' ? L.fb_down7 : L.fb_ok7);
      if (kind === 'ok' && t && t.done) confetti();
      haptic('success');
    }).catch(function () { S.busy = false; toast(L.e_net, true); });
  });
  $('ideal').addEventListener('click', function () {
    try { if (tg && tg.openTelegramLink) { tg.openTelegramLink(S.orderUrl); return; } } catch (e) {}
    window.open(S.orderUrl, '_blank');
  });
  $('again').addEventListener('click', function () { begin(); });
  $('toprof').addEventListener('click', function () { show('prof'); });
  try { if (window.matchMedia) { var mq = window.matchMedia('(orientation: landscape)'); if (mq.addEventListener) mq.addEventListener('change', rotCheck); } } catch (e) {}

  // для проверки в браузере (только чтение)
  window.__aimDbg = {
    hud: function () { var g = H.g || {}; return { open: !$('hud').hidden, x: g.x, y: g.y, r: g.r, size: S.hud.size, fx: S.hud.x, fy: S.hud.y,
                                                   top: $('hd-ctl').classList.contains('hi') }; },
    view: function () { return { view: S.view, hud: !$('hud').hidden, swipe: !$('swipe').hidden, calc: !$('calc').hidden,
                                 off: $('calc').classList.contains('off') && !$('calc').hidden }; },
    swipe: function () { return { open: !$('swipe').hidden, n: W.n, got: W.list.length, pxcm: W.pxcm, done: W.done, fx: W.fire.x, fy: W.fire.y, fr: W.fire.r }; },
    need: function () { var t = W.tgt; return { ready: !!t && !W.busy && W.ptr === null && !W.done && !$('swipe').hidden, h: t ? CHEST * t.k * W.Z : 0,
                                                g: W.g, k: t ? t.k : 0, fx: W.fire.x, fy: W.fire.y, fr: W.fire.r, i: W.list.length, n: W.n,
                                                cam: { x: W.cam.x, y: W.cam.y }, shots: W.shots, res: W.res.slice() }; },
    px: function () { return { pxcm: pxPerCm(), model: modelPxcm() }; },
    miss: function () { return { swipe: W.miss }; },
    ls: function () { return { ph: !!lsGet('aim_ph'), draft: lsGet('aim_draft_' + UID), pend: !!lsGet('aim_pend_' + UID), hud: lsGet('aim_hud_' + UID) }; },
    res: function () { return { swipes: W.list.length, sf: sfac(), orient: S.orient, hud: S.hud, phHash: S.phHash }; }
  };

  // ── старт страницы ──────────────────────────────────────────────────
  texts(); syncChips(); syncGo(); fxInit(); revealInit();
  if (!UID || !API) {
    $('s-prof').hidden = true; $('fatal').hidden = false;
    $('fatal-t').textContent = L.none_t; $('fatal-d').textContent = L.none_d;
    return;
  }
  // v353: база телефонов уже на телефоне — поиск работает сразу, ответы прошлого раза на месте, ещё до ответа бота
  var phc = lsGet('aim_ph');
  if (phc && phc.h && phc.l && phc.l.length > 100) { S.phones = phc.l; S.phHash = String(phc.h); buildIdx(); restore(false); }
  renderList(); pendShow();
  getState().then(function (res) {
    var j = res && res.j;
    if (!j || !j.ok) {
      if (res && res.status === 401) toast(L.e_auth, true); else toast(S.phones.length ? L.e_net : L.e_ph, true);
      if (!S.phones.length) setManual(true); else restore(true);
      return;
    }
    if (j.phones && j.phones.length) {
      S.phones = j.phones; buildIdx();
      if (j.ph_hash) { S.phHash = String(j.ph_hash); lsSet('aim_ph', { h: j.ph_hash, l: j.phones }); }
    }
    if (j.rounds) S.rounds = j.rounds;
    if (j.order_url) S.orderUrl = j.order_url;
    if (j.ideal_price) S.price = j.ideal_price;
    if (j.swipes) S.swipes = j.swipes;
    if (j.diag) for (var dk in j.diag) S.diag[Number(dk)] = Number(j.diag[dk]);
    S.last = j.last || null; renderLast(); restore(true); renderList();
  }).catch(function () { toast(S.phones.length ? L.e_net : L.e_ph, true); if (!S.phones.length) setManual(true); else restore(true); });
})();
</script>
